<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#191814" />
<meta name="description" content="AG GROUP — Radni nalog i obračun za Nor klizni sistem (2–5 šina)" />
<title>AG GROUP — Slajding Nor · radni nalog</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fjalla+One&family=Hanken+Grotesk:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500;600&display=swap');
  /* Isti izgled kao program za pergole: tamna radna površina, papirni nalog, bronzani akcenat */
  :root{
    --shell:#15171b; --shell2:#1e2127; --line:#33373f; --muted:#888;
    --paper:#f6f4ee; --paper2:#ebe7db; --ink:#191814;
    --bronze:#a9743c; --bronzeD:#8a5d2e; --ok:#3f7a4d; --warn:#bd4a2a; --info:#2f5f8f;
  }
  *{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--shell);font-family:'Hanken Grotesk',sans-serif;}

  .topbar{background:var(--ink);padding:12px 16px;display:flex;align-items:center;
    justify-content:space-between;gap:10px;position:sticky;top:0;z-index:50;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:10px;}
  .logo{padding:3px 8px;border:2px solid var(--bronze);border-radius:4px;
    font-family:'Fjalla One',sans-serif;color:var(--bronze);font-size:16px;}
  .brand-t{font-family:'Fjalla One',sans-serif;font-size:16px;color:#fff;letter-spacing:.04em;line-height:1;}
  .brand-s{font-size:9.5px;color:var(--muted);letter-spacing:.08em;margin-top:2px;}
  .topbar-actions{display:flex;gap:6px;flex-wrap:wrap;}
  .btn{border:0;padding:10px 14px;border-radius:5px;font-family:'Fjalla One',sans-serif;
    font-size:13px;letter-spacing:.04em;cursor:pointer;white-space:nowrap;}
  .btn-primary{background:var(--bronze);color:#fff;}
  .btn-primary:active{background:var(--bronzeD);}
  .btn-secondary{background:#2a2d34;color:#fff;border:1px solid var(--line);}
  .btn-secondary.active{background:var(--bronze);border-color:var(--bronze);}
  a.btn{text-decoration:none;display:inline-block;}
  .btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--bronze);outline-offset:1px;}

  .panel{max-width:820px;margin:14px auto 0;padding:0 14px;}
  .card-in{background:var(--shell2);border:1px solid var(--line);border-radius:10px;padding:14px;}
  .grp{font-family:'Fjalla One',sans-serif;font-size:13px;color:var(--bronze);letter-spacing:.07em;margin:14px 0 8px;}
  .grp:first-child{margin-top:0;}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  @media(min-width:560px){.row{grid-template-columns:1fr 1fr 1fr;}}
  label{display:block;}
  .lbl{font-weight:700;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:#d8d4c4;}
  .sub{font-size:9.5px;color:var(--muted);margin:1px 0 3px;}
  input,select{width:100%;margin-top:2px;padding:9px 10px;background:#101216;
    border:1px solid var(--line);border-radius:5px;color:#fff;
    font-family:'Hanken Grotesk',sans-serif;font-size:14px;}
  input[type=number]{font-family:'Spline Sans Mono',monospace;font-size:15px;}
  input::placeholder{color:#5c606b;}
  select option{background:#1e2127;}
  .hint{text-align:center;color:var(--muted);font-size:11px;margin:10px 0 4px;}
  .sistem-izbor{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .sistem-izbor label{display:flex;gap:9px;align-items:flex-start;background:#101216;border:1px solid var(--line);
    border-radius:7px;padding:10px 11px;cursor:pointer;}
  .sistem-izbor input{width:auto;margin:3px 0 0;accent-color:var(--bronze);}
  .sistem-izbor b{display:block;color:#fff;font-size:13px;}
  .sistem-izbor small{display:block;color:var(--muted);font-size:10.5px;margin-top:2px;line-height:1.35;}
  .sistem-izbor label:has(input:checked){border-color:var(--bronze);background:#1c1813;}

  /* DOKUMENT */
  .doc{max-width:820px;margin:18px auto 50px;background:var(--paper);
    box-shadow:0 18px 45px rgba(0,0,0,.5);padding:22px 22px;color:var(--ink);}
  .doc-head{display:flex;justify-content:space-between;align-items:flex-start;
    border-bottom:3px solid var(--ink);padding-bottom:11px;gap:10px;}
  .doc-title{font-family:'Fjalla One',sans-serif;font-size:27px;letter-spacing:.02em;line-height:.95;}
  .doc-sub{font-family:'Fjalla One',sans-serif;font-size:12px;color:var(--bronze);letter-spacing:.16em;margin-top:3px;}
  .doc-meta{text-align:right;font-family:'Spline Sans Mono',monospace;font-size:10.5px;line-height:1.65;}
  .badge{background:var(--ink);color:#fff;padding:3px 7px;border-radius:3px;display:inline-block;font-weight:600;font-size:9.5px;}
  .badge.obracun{background:var(--bronze);}
  .info-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:11px;}
  @media(max-width:480px){.info-row{grid-template-columns:1fr;}}
  .card{background:var(--paper2);padding:9px 11px;border-radius:5px;}
  .card-t{font-family:'Fjalla One',sans-serif;font-size:10.5px;letter-spacing:.09em;color:var(--bronzeD);}
  .mono{font-family:'Spline Sans Mono',monospace;}
  .dims{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:11px;}
  @media(max-width:480px){.dims{grid-template-columns:1fr 1fr;}}
  .dim{background:var(--ink);color:#fff;padding:6px 7px;border-radius:4px;}
  .dim-k{font-size:8.5px;letter-spacing:.06em;color:#b9b3a0;}
  .dim-v{font-family:'Spline Sans Mono',monospace;font-weight:600;font-size:14px;}
  .calc-line{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-family:'Spline Sans Mono',monospace;font-size:11px;}

  .sec{margin-top:20px;}
  .sec-h{display:flex;align-items:baseline;gap:8px;border-bottom:2px solid var(--ink);padding-bottom:3px;margin-bottom:8px;}
  .sec-n{font-family:'Spline Sans Mono',monospace;font-weight:600;font-size:10.5px;background:var(--ink);color:#fff;padding:2px 6px;border-radius:3px;}
  .sec-n.acc{background:var(--bronze);}
  .sec-t{margin:0;font-family:'Fjalla One',sans-serif;font-size:16px;letter-spacing:.02em;text-transform:uppercase;}
  .sec-x{margin-left:auto;font-family:'Spline Sans Mono',monospace;font-size:11px;color:#5a5446;}

  .tw{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;}
  th{font-weight:700;font-size:10px;letter-spacing:.03em;text-transform:uppercase;color:#fff;background:var(--ink);padding:5px 7px;text-align:left;border-right:1px solid #43403a;}
  td{padding:5px 7px;border-bottom:1px solid var(--paper2);font-size:12px;vertical-align:middle;}
  td.m{font-family:'Spline Sans Mono',monospace;font-weight:500;}
  tbody tr:nth-child(even):not(.obr-sum):not(.obr-total){background:#efebe0;}
  .chk{width:14px;height:14px;border:1.5px solid #9a927c;border-radius:3px;display:inline-block;}
  .thumb{width:68px;height:50px;object-fit:contain;background:#fff;border:1px solid #d8d1bd;border-radius:4px;padding:2px;display:block;cursor:zoom-in;}
  @media(max-width:640px){.thumb{width:54px;height:40px;}}
  .sif{font-family:'Spline Sans Mono',monospace;font-size:9.5px;color:#7a7361;margin-bottom:2px;}
  .nap{font-size:10px;color:#5a5446;margin-top:1px;}
  .oz{display:inline-block;font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:3px;margin-left:5px;vertical-align:1px;background:#e3d6c3;color:#6b4a22;}
  .mera{font-family:'Spline Sans Mono',monospace;font-weight:600;font-size:14px;white-space:nowrap;}
  .kom{font-family:'Spline Sans Mono',monospace;font-weight:700;font-size:14px;text-align:center;}

  .box-cut{border:2px solid var(--ink);border-radius:6px;padding:10px 12px;}
  .box-cut-t{font-family:'Fjalla One',sans-serif;font-size:11px;letter-spacing:.05em;}
  .box-cut-v{font-family:'Spline Sans Mono',monospace;font-weight:600;font-size:22px;color:var(--bronze);}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(max-width:560px){.two{grid-template-columns:1fr;}}
  .note{border-radius:5px;padding:7px 10px;font-size:11.5px;margin-top:8px;line-height:1.45;}
  .note-ok{background:#e7efe6;border:1px solid var(--ok);}
  .note-warn{background:#f6e7df;border:1px solid var(--warn);}
  .note-info{background:#e5edf5;border:1px solid var(--info);}
  .sema{background:#fff;border:1px solid var(--paper2);border-radius:6px;padding:8px;}
  .sema svg{display:block;width:100%;height:auto;}

  ol.napomene{margin:0;padding-left:18px;font-size:11.5px;line-height:1.6;}
  .potpisi{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:22px;}
  .potpis{border-top:1px solid var(--ink);padding-top:5px;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#5a5446;}
  .potpis-l{margin-top:14px;font-weight:400;color:var(--muted);}
  .foot{margin-top:16px;border-top:1px solid var(--paper2);padding-top:6px;font-family:'Spline Sans Mono',monospace;font-size:9px;color:var(--muted);text-align:center;}

  /* OBRAČUN */
  .obr-sum{background:#191814;color:#fff;}
  .obr-sum td{border:0;font-weight:700;padding:7px 8px;font-size:13px;}
  .obr-total{background:var(--bronze);color:#fff;}
  .obr-total td{border:0;font-weight:700;padding:9px 10px;font-size:15px;}
  .obr-total td.amt{font-family:'Spline Sans Mono',monospace;font-size:18px;}
  .euro{font-family:'Spline Sans Mono',monospace;font-weight:600;text-align:right;white-space:nowrap;}
  .obr-warning{background:#fbe9b6;border:1px solid #c2933a;color:#5e4413;padding:8px 12px;border-radius:5px;font-size:11.5px;margin:10px 0;line-height:1.45;}
  .cene{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 10px;}
  .cene label{background:var(--paper2);border-radius:5px;padding:6px 8px;}
  .cene span{display:block;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#5a5446;}
  .cene input{background:#fff;color:var(--ink);border:1px solid #cfc7b2;font-size:14px;padding:6px 8px;}
  .cene input.prazno{border-color:var(--warn);background:#fff6f2;}
  .cene small{display:block;font-size:9.5px;color:#7a7361;margin-top:2px;}

  /* Kartica troška */
  .kartica{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:0;margin-top:12px;border-radius:7px;overflow:hidden;border:2px solid var(--ink);break-inside:avoid;}
  @media(max-width:600px){.kartica{grid-template-columns:1fr;}}
  .kart-gl{background:var(--ink);color:#fff;padding:14px 16px;display:flex;flex-direction:column;gap:2px;}
  .kart-k{font-family:'Fjalla One',sans-serif;font-size:12px;letter-spacing:.14em;color:#d9b48a;}
  .kart-v{font-family:'Spline Sans Mono',monospace;font-weight:600;font-size:30px;line-height:1.15;}
  .kart-s{font-size:11px;color:#b9b3a0;}
  .kart-mini{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:auto;padding-top:12px;border-top:1px solid #3a3730;}
  .kart-mini span{display:block;font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:#b9b3a0;}
  .kart-mini b{font-family:'Spline Sans Mono',monospace;font-size:13px;font-weight:600;}
  .kart-gr{background:#fff;padding:12px 14px;display:flex;flex-direction:column;gap:8px;}
  .kg-t{display:flex;justify-content:space-between;gap:8px;align-items:baseline;font-size:12px;}
  .kg-t span{font-weight:700;}
  .kg-t small{font-weight:400;color:#7a7361;margin-left:6px;font-size:10.5px;}
  .kg-t b{font-family:'Spline Sans Mono',monospace;font-weight:600;white-space:nowrap;}
  .kg-bar{height:6px;background:var(--paper2);border-radius:3px;overflow:hidden;margin-top:3px;}
  .kg-bar i{display:block;height:100%;background:var(--bronze);border-radius:3px;}
  .kg-nula .kg-t b{color:var(--warn);font-family:'Hanken Grotesk',sans-serif;font-size:11px;}
  .kg-fale{font-size:11px;line-height:1.45;background:#f6e7df;border:1px solid var(--warn);border-radius:5px;padding:6px 9px;margin-top:2px;}
  .kg-fale.kg-ok{background:#e7efe6;border-color:var(--ok);}

  /* ARHIVA */
  .arch-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;}
  .arch-overlay.open{display:flex;justify-content:flex-end;}
  .arch-panel{background:var(--shell2);border-left:1px solid var(--line);width:min(400px,100vw);height:100vh;overflow-y:auto;}
  .arch-head{background:var(--ink);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;}
  .arch-head-t{font-family:'Fjalla One',sans-serif;color:var(--bronze);font-size:15px;letter-spacing:.05em;}
  .arch-close{background:none;border:none;color:#aaa;font-size:20px;cursor:pointer;padding:4px 8px;line-height:1;}
  .arch-empty{padding:40px 20px;color:var(--muted);text-align:center;font-size:13px;line-height:1.5;}
  .arch-item{padding:13px 16px;border-bottom:1px solid var(--line);}
  .arch-item b{font-family:'Fjalla One',sans-serif;color:#fff;font-size:13px;font-weight:400;}
  .arch-item small{display:block;font-size:11px;color:#a09880;margin:3px 0 9px;}
  .btn-xs{border:0;padding:5px 11px;border-radius:4px;font-family:'Fjalla One',sans-serif;font-size:11px;cursor:pointer;letter-spacing:.03em;}
  .btn-xs-load{background:var(--bronze);color:#fff;}
  .btn-xs-del{background:#2e1a1a;color:#e07070;border:1px solid #5a2020;margin-left:6px;}

  #imgZoom{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:300;align-items:center;justify-content:center;flex-direction:column;gap:10px;cursor:zoom-out;}
  #imgZoom img{max-width:90vw;max-height:75vh;background:#fff;border-radius:8px;padding:14px;}
  #imgZoom div{color:#eee;font-size:14px;}

  @media print{
    @page{margin:10mm;}
    html,body{background:#fff;}
    .no-print{display:none!important;}
    .doc{box-shadow:none!important;margin:0!important;max-width:100%!important;padding:0!important;}
    .sec-h{break-after:avoid;} tr{break-inside:avoid;} thead{display:table-header-group;}
    .card,.box-cut,.note,.potpisi,.sema{break-inside:avoid;}
  }
  .rr-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  @media(max-width:620px){.rr-grid{grid-template-columns:1fr;}}
  .rr-k{background:#fff;border:1.5px solid #191814;border-radius:6px;padding:8px;break-inside:avoid;}
  .rr-k svg{width:100%;height:auto;display:block;}
  .rr-presek svg{max-width:470px;margin:0 auto;}
  .rr-n{font-family:'Fjalla One',sans-serif;font-size:13px;letter-spacing:.06em;text-align:center;margin-bottom:2px;}
</style>
</head>

<!-- PIN: pamti se na uređaju 30 dana. Nalog otvoren preko QR koda (zaključan) ne traži PIN. -->
<style>
  html.ag-zak body > *:not(#agPin){display:none !important;}
  #agPin{position:fixed;inset:0;z-index:9999;background:#15171b;display:flex;align-items:center;justify-content:center;font-family:'Hanken Grotesk',system-ui,sans-serif;}
  #agPin .pk{width:min(320px,88vw);background:#1e2127;border:1px solid #33373f;border-radius:14px;padding:26px 22px;text-align:center;color:#fff;}
  #agPin .pl{display:inline-block;padding:3px 9px;border:2px solid #a9743c;border-radius:4px;color:#a9743c;font-family:'Fjalla One',sans-serif;font-size:18px;}
  #agPin h2{font-family:'Fjalla One',sans-serif;font-weight:400;letter-spacing:.05em;font-size:20px;margin:14px 0 4px;}
  #agPin p{font-size:12px;color:#8b8f98;margin:0 0 16px;}
  #agPin input{width:100%;text-align:center;font-size:30px;letter-spacing:.45em;padding:12px 0 12px .45em;background:#101216;border:1px solid #33373f;border-radius:8px;color:#fff;font-family:'Spline Sans Mono',monospace;margin:0;}
  #agPin input.ne{border-color:#d8754a;animation:agTr .3s;}
  #agPin .pg{height:18px;font-size:12px;color:#f0b49a;margin-top:8px;}
  @keyframes agTr{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  @media print{#agPin{display:none!important;}}
</style>
<script>
(function(){
  var K='ag_pin_do', H=2088368152, DANA=30;
  function h(s){var x=5381;for(var i=0;i<s.length;i++)x=((x<<5)+x+s.charCodeAt(i))>>>0;return x;}
  try{ if(+localStorage.getItem(K) > Date.now()) return; }catch(e){}
  if((location.hash||'').indexOf('#z1~')===0) return;
  document.documentElement.classList.add('ag-zak');
  var d=document.createElement('div'); d.id='agPin';
  d.innerHTML='<div class="pk"><span class="pl">AG</span><h2>AG GROUP · RADNI NALOZI</h2><p>Unesi PIN — pamti se na ovom uređaju '+DANA+' dana</p>'
    +'<input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" id="agPinIn" aria-label="PIN"><div class="pg" id="agPinG"></div></div>';
  document.body.insertBefore(d, document.body.firstChild);
  var inp=document.getElementById('agPinIn'), g=document.getElementById('agPinG');
  inp.addEventListener('input',function(){
    inp.classList.remove('ne'); g.textContent='';
    if(inp.value.length<4) return;
    if(h(inp.value)===H){
      try{ localStorage.setItem(K, String(Date.now()+DANA*864e5)); }catch(e){}
      document.documentElement.classList.remove('ag-zak'); d.remove();
    } else { inp.value=''; inp.classList.add('ne'); g.textContent='Pogrešan PIN'; }
  });
  setTimeout(function(){inp.focus();},50);
})();
</script>

<div class="panel no-print" id="unos">
  <div class="card-in">
    <div class="grp">① MERE SISTEMA (mm)</div>
    <div class="row">
      <label><div class="lbl">Širina</div><div class="sub">širina sistema</div>

      <label><div class="lbl">Staklo</div><div class="sub">ısıcam / tek cam</div>
        <select id="staklo"><option value="isicam" selected>Termopan 4+12+4</option><option value="tek">Jednostruko</option></select></label>
      <label><div class="lbl">Srednji H profil</div><div class="sub">orta birleşim</div>
        <select id="srednji"><option value="ne" selected>Ne</option><option value="da">Da</option></select></label>
      <label><div class="lbl">Boja (RAL)</div><div class="sub">važi za sve profile</div>
        <input type="text" id="ral" value="7016" placeholder="npr. 7016"></label>
    </div>

    <div class="grp">③ PODACI ZA NALOG</div>
    <div class="row">
      <label><div class="lbl">Broj naloga</div><input type="text" id="brNaloga" placeholder="N-2026-001"></label>

/* ───────── helperi ───────── */
const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mm = n => { const v=Math.round(n*10)/10; return (Number.isInteger(v)?String(v):v.toFixed(1).replace('.',',')); };
const br = (n,d=2) => (Math.round(n*10**d)/10**d).toFixed(d).replace('.',',').replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const eur = n => br(n,2)+" €";
const datumSr = s => /^\d{4}-\d{2}-\d{2}$/.test(s||'') ? s.split('-').reverse().join('.')+'.' : (s||'—');
const naGore = v => Math.ceil(v - 1e-9);

/* ───────── JEZGRO — Nor kalkulator „Sürme Hesaplama" ─────────
   X = širina, Y = visina sistema, D = broj šina = broj krila (2–5).
   prag: sa pragom (eşikli) ili bez (eşiksiz) · staklo: termopan ili jednostruko · H: srednji spoj (orta birleşim).
   Gornja kasa je UVEK profil sa pragom; donja je sa ili bez praga.                                    */
function proracun(I){
  const X=+I.sirina||0, Y=+I.visina||0, n=Math.max(1,Math.round(+I.kom||1));
  const D=Math.min(5,Math.max(2,Math.round(+I.sine||4)));
  const prag = I.prag==='eşikli', termo = I.staklo!=='tek', H = I.srednji==='da' ? 1 : 0;
  const P=[]; const add=(sif,mera,kom,nap)=>P.push({sif,mera,kom,nap});
  const stakloS=((X-146)+(D-1)*4-79*H)/D;           // širina stakla (Excel F17)
  const stakloV= prag ? Y-213 : Y-193;               // visina stakla (Excel G17)
  add(SA_PRAGOM[D], X-24, n, "širina − 24 · gornja kasa");
  add(prag?SA_PRAGOM[D]:BEZ_PRAGA[D], X-24, n, prag?"širina − 24 · donja kasa sa pragom":"širina − 24 · donja kasa bez praga");
  add(termo?"10394":"10395", stakloS-30, 2*D*n, "širina stakla − 30 · gore i dole na svakom krilu");
  add(termo?"10396":"10397", prag?Y-125:Y-105, 2*n, (prag?"visina − 125":"visina − 105")+" · krajnja krila");
  add(termo?"10398":"10399", prag?Y-59:Y-39, (2*D-2)*n, (prag?"visina − 59":"visina − 39")+" · vertikale krila");
  add(BOCNA[D], Y, 2*n, "= visina · levo i desno");
  add("10400", prag?Y-26:Y-15, 2*n, prag?"visina − 26":"visina − 15");
  if(H) add("10401", prag?Y-59:Y-39, n, (prag?"visina − 59":"visina − 39")+" · srednji spoj");
  P.forEach(p=>{ p.kg=(p.mera/1000)*p.kom*PROF[p.sif].kgm; });
  const aktivni=P.filter(p=>p.kom>0&&p.mera>0);
  const kg=aktivni.reduce((a,p)=>a+p.kg,0);
  const staklo={s:naGore(stakloS), v:naGore(stakloV), kom:D*n};
  const m2=Math.max(0,staklo.s)*Math.max(0,staklo.v)*staklo.kom/1e6;
  const OK=[
    {id:"teker",  naziv:"Točak (Sürme Teker)",                       kol:2*D*n, jed:"kom", nap:"2 po krilu"},
    {id:"kollu",  naziv:"Garnitura krila sa ručkom (Kollu Kanat Aksesuar Takımı)", kol:2*n, jed:"kom", nap:"2 po sistemu"},
    {id:"kenetli",naziv:"Garnitura kenet krila (Kenetli Kanat Aksesuar Takımı)",  kol:(D-2)*n, jed:"kom", nap:"broj krila − 2"},
  ];
  if(prag) OK.push({id:"conta",naziv:"Zaptivka (Sızdırmazlık Contası)",kol:4*n,jed:"kom",nap:"samo sa pragom"},
                   {id:"izol", naziv:"Termo zaptivka (Isı Yalıtım Contası)",kol:4*n,jed:"kom",nap:"samo sa pragom"});
  OK.push({id:"staklo", naziv:termo?"Staklo termopan 4+12+4":"Staklo jednostruko", kol:m2, jed:"m²", nap:`${D} po sistemu · ${staklo.s} × ${staklo.v} mm`});
  return {X,Y,D,n,prag,termo,H,P,aktivni,kg,staklo,m2,stakloS,stakloV,OK};
}

/* ───────── PROVERE ───────── */
function provere(R){
  const out=[];
  if(R.X<=0||R.Y<=0) out.push(["warn","Unesi širinu i visinu sistema."]);
  else if(R.staklo.s<=0||R.staklo.v<=0) out.push(["warn","Mera stakla je nula ili negativna — proveri širinu i visinu."]);
  if(R.termo) out.push(["info","Termopan: odbitci su isti kao u Nor kalkulatoru za jednostruko staklo — potvrditi sa Nor-om."]);
  if(R.H) out.push(["info",`Srednji H profil: staklo je uže za 79 mm po sistemu (${mm(79/R.D)} mm po krilu).`]);
  return out;
}

function prikaz(v){
  pogled=v;
  $("btnNalog").classList.toggle('active',v==='nalog');
  $("btnObracun").classList.toggle('active',v==='obracun');
  crtaj();
}
function crtaj(){
  const I=citaj(), R=proracun(I);
  $("doc").innerHTML = pogled==='nalog' ? nalogHTML(I,R) : obracunHTML(I,R);
  if(pogled==='obracun') vezeCena(I,R);
}
function imgTag(sif){
  const s=IMG[sif]; if(!s) return '';
  return `<img class="thumb" src="${s}" alt="${esc(sif+' '+PROF[sif].naziv)}" onclick="uvecaj(this)">`;
}
function uvecaj(im){ $("imgZoomPic").src=im.src; $("imgZoomCap").textContent=im.alt; $("imgZoom").style.display='flex'; }

/* ───────── ŠEMA — pogled spreda, u razmeri ───────── */
function sema(R){
  const X=Math.max(R.X,1), Y=Math.max(R.Y,1);
  const maxW=360, maxH=230, k=Math.min(maxW/X, maxH/Y);
  const w=X*k, h=Y*k, x0=56, y0=18, ram=Math.max(4,30*k), sina=Math.max(5,40*k);
  const unW=w-2*ram, kr=Math.max(10,(R.stakloS+40)*k), korak=R.D>1?(unW-kr)/(R.D-1):0;
  let krila='';
  for(let i=0;i<R.D;i++){
    const x=x0+ram+i*korak, y=y0+sina, hh=h-2*sina;
    krila += `<rect x="${x}" y="${y}" width="${kr}" height="${hh}" fill="#e3edf3" fill-opacity=".72" stroke="#191814" stroke-width="1.2"/>
      <line x1="${x+5}" y1="${y+hh*0.55}" x2="${x+kr*0.45}" y2="${y+hh*0.18}" stroke="#fff" stroke-width="2.2" opacity=".9"/>
      <text x="${x+kr/2}" y="${y+hh-8}" text-anchor="middle" font-family="Spline Sans Mono, monospace" font-size="9.5" fill="#191814">${i+1}</text>`;
  }
  return `<svg viewBox="0 0 ${x0+w+40} ${y0+h+46}" role="img" aria-label="Šema Nor kliznog sistema spreda, ${R.X} × ${R.Y} mm, ${R.D} krila">
    <rect x="${x0}" y="${y0}" width="${w}" height="${h}" fill="#fff" stroke="#191814" stroke-width="2"/>
    <rect x="${x0}" y="${y0}" width="${w}" height="${sina}" fill="#2a2d34"/>
    <rect x="${x0}" y="${y0+h-sina}" width="${w}" height="${sina}" fill="${R.prag?'#2a2d34':'#6b6f78'}"/>
    <rect x="${x0}" y="${y0}" width="${ram}" height="${h}" fill="#6b6f78"/><rect x="${x0+w-ram}" y="${y0}" width="${ram}" height="${h}" fill="#6b6f78"/>
    ${krila}
    <g stroke="#a9743c" stroke-width="1" fill="none">
      <line x1="${x0}" y1="${y0+h+14}" x2="${x0+w}" y2="${y0+h+14}"/><line x1="${x0}" y1="${y0+h+8}" x2="${x0}" y2="${y0+h+20}"/><line x1="${x0+w}" y1="${y0+h+8}" x2="${x0+w}" y2="${y0+h+20}"/>
      <line x1="${x0-16}" y1="${y0}" x2="${x0-16}" y2="${y0+h}"/><line x1="${x0-22}" y1="${y0}" x2="${x0-10}" y2="${y0}"/><line x1="${x0-22}" y1="${y0+h}" x2="${x0-10}" y2="${y0+h}"/>
    </g>
    <text x="${x0+w/2}" y="${y0+h+32}" text-anchor="middle" font-family="Spline Sans Mono, monospace" font-size="12" font-weight="600" fill="#8a5d2e">${R.X}</text>
    <text x="${x0-22}" y="${y0+h/2}" text-anchor="middle" font-family="Spline Sans Mono, monospace" font-size="12" font-weight="600" fill="#8a5d2e" transform="rotate(-90 ${x0-22} ${y0+h/2})">${R.Y}</text>
  </svg>`;
}

/* ───────── NALOG ───────── */

   <div class="tw"><table><thead><tr><th style="width:96px">Profil</th><th>Naziv</th><th style="width:96px;text-align:right">Mera mm</th><th style="width:46px;text-align:center">Kom</th><th style="width:30px;text-align:center">✓</th></tr></thead><tbody>`;
  R.aktivni.forEach(p=>{
    h += `<tr><td><div class="sif">${p.sif}</div>${imgTag(p.sif)}</td>
      <td><b>${PROF[p.sif].naziv}</b><div class="nap">${PROF[p.sif].tr} · ${p.nap}</div></td>
      <td class="mera" style="text-align:right">${mm(p.mera)}</td><td class="kom">${p.kom}</td><td style="text-align:center"><span class="chk"></span></td></tr>`;
  });
  h += `</tbody></table></div></div>`;
  h += `<div class="sec"><div class="sec-h"><span class="sec-n">02</span><h3 class="sec-t">Staklo i šema</h3><span class="sec-x">${br(R.m2,2)} m²</span></div>
   <div class="two"><div>
     <div class="box-cut"><div class="box-cut-t">MERA STAKLA ZA NARUDŽBINU</div>
       <div class="box-cut-v">${R.staklo.s} × ${R.staklo.v}</div>
       <div style="font-size:10.5px;color:#5a5446">širina × visina (mm) · <b>${R.staklo.kom} kom</b> · ${br(R.m2,2)} m² · ${R.termo?'termopan 4+12+4':'jednostruko'}<br>
       širina = (X − 146 + (krila − 1) × 4${R.H?' − 79':''}) / krila · visina = Y − ${R.prag?213:193} · zaokruženo naviše</div></div>
     <div class="card mono" style="margin-top:9px;font-size:11px;line-height:1.85">
       <div>Krila: <b>${R.D}</b> na ${R.D} šine</div>
       <div>Vertikale: <b>2 × krilo sa ručkom</b> + <b>${2*R.D-2} × kenet</b></div>
       <div>Baza krila: <b>${2*R.D} kom</b> · ${mm(R.stakloS-30)} mm</div></div>
   </div><div class="sema">${sema(R)}</div></div></div>`;
  h += `<div class="sec"><div class="sec-h"><span class="sec-n">03</span><h3 class="sec-t">Okov i staklo</h3></div>
   <div class="tw"><table><thead><tr><th>Stavka</th><th style="width:120px;text-align:right">Količina</th><th style="width:30px;text-align:center">✓</th></tr></thead><tbody>`;
  R.OK.forEach(o=>{
    h += `<tr><td><b>${o.naziv}</b><div class="nap">${o.nap}</div></td>
      <td class="mera" style="text-align:right">${o.jed==='m²'?br(o.kol,2):o.kol} ${o.jed}</td><td style="text-align:center"><span class="chk"></span></td></tr>`;
  });
  h += `</tbody></table></div></div>
  <div class="sec"><div class="sec-h"><span class="sec-n">04</span><h3 class="sec-t">Napomene za radionicu</h3></div>
    <ol class="napomene">
      <li>Gornja kasa je uvek profil sa pragom; donja ${R.prag?'je takođe sa pragom':'je bez praga'}.</li>
      <li>Kase gore i dole: širina − 24 mm. Bočna kasa: puna visina.</li>
      <li>Krajnja krila imaju profil sa ručkom (2 kom), ostale vertikale su keneti (${2*R.D-2} kom).</li>
      <li>Baza krila: po jedna gore i dole na svakom krilu — ${2*R.D} kom po sistemu.</li>
    </ol></div>
  <div class="foot">AG GROUP · program za Nor klizni sistem · ${VER}</div>`;
  return h;
}

/* ───────── OBRAČUN ───────── */
const CENE_DEF = {alu:4.65, fire:10, teker:0, kollu:0, kenetli:0, conta:0, izol:0, staklo:0, rad:0, marza:30, pdv:20};
const CENE_OPIS = {
  alu:["Aluminijum (plastificiran)","€/kg"], fire:["Otpad aluminijuma","% na kg"],
  teker:["Točak","€/kom"], kollu:["Garnitura krila sa ručkom","€/kom"], kenetli:["Garnitura kenet krila","€/kom"],
  conta:["Zaptivka","€/kom"], izol:["Termo zaptivka","€/kom"], staklo:["Staklo","€/m²"],
  rad:["Rad","€/sistem"], marza:["Marža","%"], pdv:["PDV","%"]
};
const CENE_KLJUC='snr_cene1';
function citajCene(){
  try{ return Object.assign({},CENE_DEF, JSON.parse(localStorage.getItem(CENE_KLJUC)||'{}')); }
  catch(e){ return Object.assign({},CENE_DEF); }
}
function obracun(R,C){
  const alu=R.kg*C.alu, fire=alu*(C.fire/100);
  const okov=R.OK.map(o=>({...o, cena:C[o.id]||0, ukupno:o.kol*(C[o.id]||0)}));
  const okovUk=okov.reduce((a,o)=>a+o.ukupno,0);
  const rad=R.n*C.rad, trosak=alu+fire+okovUk+rad, prodaja=trosak*(1+C.marza/100), pdv=prodaja*C.pdv/100;
  return {alu,fire,okov,okovUk,rad,trosak,prodaja,pdv,ukupno:prodaja+pdv};
}
function karticaTroska(R,C,O,fale){
  const g = id => O.okov.filter(o=>id.includes(o.id)).reduce((a,o)=>a+o.ukupno,0);
  const grupe=[
    ["Aluminijum", O.alu+O.fire, `${br(R.kg,1)} kg · ${br(C.alu,2)} €/kg`+(C.fire>0?` + ${br(C.fire,0)} % otpad`:'')],
    ["Staklo", g(["staklo"]), `${br(R.m2,2)} m² · ${R.staklo.kom} kom`],
    ["Okov", g(["teker","kollu","kenetli","conta","izol"]), "točkovi i garniture"],
    ...(C.rad>0?[["Rad", O.rad, `${R.n} sist.`]]:[]),
  ];
  const max=Math.max(1,...grupe.map(x=>x[1])), m2=R.X*R.Y/1e6*R.n;
  return `<div class="kartica">
    <div class="kart-gl"><div class="kart-k">KOŠTA NAS</div><div class="kart-v">${eur(O.trosak)}</div>
      <div class="kart-s">${C.rad>0?"materijal + rad":"materijal, bez rada"} · ${R.n} ${R.n===1?'sistem':'sistema'} ${R.X} × ${R.Y}</div>
      <div class="kart-mini"><div><span>Po sistemu</span><b>${eur(O.trosak/R.n)}</b></div>
        <div><span>Po m² otvora</span><b>${m2>0?eur(O.trosak/m2):'—'}</b></div>
        <div><span>Prodajna sa PDV</span><b>${eur(O.ukupno)}</b></div></div></div>
    <div class="kart-gr">
      ${grupe.map(([n,v,d])=>`<div class="kg-red${v>0?'':' kg-nula'}"><div class="kg-t"><span>${n}<small>${d}</small></span><b>${v>0?eur(v):'cena nije uneta'}</b></div>
        <div class="kg-bar"><i style="width:${(v/max*100).toFixed(1)}%"></i></div></div>`).join('')}
      ${fale.length?`<div class="kg-fale">Još fali cena za: <b>${fale.map(k=>CENE_OPIS[k][0]).join(', ')}</b>. Dok se ne unese, trošak je niži od stvarnog.</div>`:`<div class="kg-fale kg-ok">Sve cene su unete.</div>`}
    </div></div>`;
}
function obracunHTML(I,R){
  const C=citajCene(), O=obracun(R,C);
  const vidljive=Object.keys(CENE_DEF).filter(k=>!(['conta','izol'].includes(k)&&!R.prag));
  const fale=vidljive.filter(k=>!['fire','rad'].includes(k) && !(+C[k]>0));
  let h=zaglavlje(I,R,true)+karticaTroska(R,C,O,fale);
  h += `<div class="obr-warning no-print">Cene se upisuju u polja ispod i pamte u ovom pregledaču. Aluminijum 4,65 €/kg je cena sa Nor potvrde porudžbine.</div>
    <div class="sec no-print"><div class="sec-h"><span class="sec-n acc">€</span><h3 class="sec-t">Jedinične cene</h3></div><div class="cene">`;
  vidljive.forEach(k=>{ h += `<label><span>${CENE_OPIS[k][0]}</span><input type="number" step="0.01" min="0" id="c_${k}" value="${C[k]}" class="${+C[k]>0||k==='fire'||k==='rad'?'':'prazno'}"><small>${CENE_OPIS[k][1]}</small></label>`; });
  h += `</div></div>
   <div class="sec"><div class="sec-h"><span class="sec-n">01</span><h3 class="sec-t">Aluminijum po profilima</h3></div>
   <div class="tw"><table><thead><tr><th>Šifra</th><th>Profil</th><th style="text-align:right">Mera</th><th style="text-align:center">Kom</th><th style="text-align:right">kg/m</th><th style="text-align:right">kg</th></tr></thead><tbody>`;
  R.aktivni.forEach(p=>{ h += `<tr><td class="m">${p.sif}</td><td>${PROF[p.sif].naziv}</td><td class="m" style="text-align:right">${mm(p.mera)}</td><td class="m" style="text-align:center">${p.kom}</td><td class="m" style="text-align:right">${br(PROF[p.sif].kgm,3)}</td><td class="m" style="text-align:right">${br(p.kg,2)}</td></tr>`; });
  h += `<tr class="obr-sum"><td colspan="5">UKUPNO ALUMINIJUM</td><td class="euro">${br(R.kg,2)} kg</td></tr></tbody></table></div></div>
   <div class="sec"><div class="sec-h"><span class="sec-n">02</span><h3 class="sec-t">Trošak</h3></div>
   <div class="tw"><table><thead><tr><th>Stavka</th><th style="text-align:right">Količina</th><th style="text-align:right">Cena</th><th style="text-align:right">Iznos</th></tr></thead><tbody>
   <tr><td><b>Aluminijum</b> · RAL ${esc(I.ral)||'—'}</td><td class="m" style="text-align:right">${br(R.kg,2)} kg</td><td class="euro">${eur(C.alu)}</td><td class="euro">${eur(O.alu)}</td></tr>
   <tr><td><b>Otpad aluminijuma</b></td><td class="m" style="text-align:right">${br(C.fire,1)} %</td><td class="euro">—</td><td class="euro">${eur(O.fire)}</td></tr>`;
  O.okov.forEach(o=>{ h += `<tr><td><b>${o.naziv}</b></td><td class="m" style="text-align:right">${o.jed==='m²'?br(o.kol,2):o.kol} ${o.jed}</td><td class="euro">${eur(o.cena)}</td><td class="euro">${eur(o.ukupno)}</td></tr>`; });
  h += `<tr><td><b>Rad</b></td><td class="m" style="text-align:right">${R.n} sist.</td><td class="euro">${eur(C.rad)}</td><td class="euro">${eur(O.rad)}</td></tr>
   <tr class="obr-sum"><td colspan="3">TROŠAK ${C.rad>0?"(materijal + rad)":"(materijal)"}</td><td class="euro">${eur(O.trosak)}</td></tr>
   <tr><td colspan="3">Prodajna cena bez PDV-a · marža ${br(C.marza,0)} %</td><td class="euro">${eur(O.prodaja)}</td></tr>
   <tr><td colspan="3">PDV ${br(C.pdv,0)} %</td><td class="euro">${eur(O.pdv)}</td></tr>
   <tr class="obr-total"><td colspan="3">PRODAJNA CENA SA PDV-om</td><td class="amt euro">${eur(O.ukupno)}</td></tr>
   </tbody></table></div></div>
   <div class="foot">AG GROUP · obračun Nor kliznog sistema · ${VER}</div>`;
  return h;
}
function vezeCena(I,R){
  Object.keys(CENE_DEF).forEach(k=>{
    const el=$('c_'+k); if(!el) return;
    el.addEventListener('change',()=>{
      const C=citajCene(); C[k]=Math.max(0,+el.value||0);
      try{ localStorage.setItem(CENE_KLJUC,JSON.stringify(C)); }catch(e){}
      const y=window.scrollY; crtaj(); window.scrollTo(0,y);
    });
  });
}

/* ───────── ARHIVA — na serveru (isti API kao pergole, status 'snr') ─────────
   Bez interneta nalog se čuva lokalno i sam šalje na server kad se arhiva
   sledeći put otvori sa internetom. */
const ARH='snr_arhiva';
const API_URL='https://app.aggroup.rs/api', API_KEY='ag2025app'; // isti ključ kao u api/config.php
const apiH=()=>({'Content-Type':'application/json','X-Api-Key':API_KEY});
function arhiva(){ try{return JSON.parse(localStorage.getItem(ARH)||'[]');}catch(e){return [];} }
function arhivaUpisi(a){ try{ localStorage.setItem(ARH,JSON.stringify(a.slice(0,200))); }catch(e){} }
let snrAktivan={id:null,kljuc:''};
const snrKljuc=I=>((I.brNaloga||'').trim()+'|'+(I.kupac||'').trim());
function snrPayload(I,opis,id){
  return {id:id||0, klijent:[I.brNaloga,I.kupac].filter(Boolean).join(' · ')||'(bez naziva)', napomena:opis, status:'snr', input_data:I, result_data:null};
}
async function snrPosalji(I,opis,id){
  const res=await fetch(API_URL+'/nalozi.php?action=save',{method:'POST',headers:apiH(),body:JSON.stringify(snrPayload(I,opis,id))});
  const j=await res.json(); if(!j.ok) throw new Error('save'); return +j.id;
}
async function sacuvaj(){
  const I=citaj(), R=proracun(I);
  const opis=`Nor ${R.D} šine · ${R.X}×${R.Y}${R.n>1?' ×'+R.n:''}`;
  const b=$("btnSacuvaj"), t=b.textContent; b.textContent='⏳ Čuvam...';
  // isti broj naloga i kupac → ažurira se isti zapis
  const isti = snrAktivan.id && snrKljuc(I)!=='|' && snrAktivan.kljuc===snrKljuc(I);
  let poruka;
  try{
    const id=await snrPosalji(I,opis,isti?snrAktivan.id:0);
    snrAktivan={id,kljuc:snrKljuc(I)}; poruka=isti?'✓ Ažurirano':'✓ Sačuvano';
  }catch(e){
    const a=arhiva(); a.unshift({id:Date.now(), vreme:new Date().toLocaleString('sr-RS'), I, opis}); arhivaUpisi(a);
    poruka='✓ Lokalno (nema interneta)';
  }
  b.textContent=poruka; setTimeout(()=>b.textContent=t,1800);
}
// lokalno sačuvani nalozi (stari ili bez interneta) → na server
async function snrSinhronizuj(){
  const a=arhiva(); if(!a.length) return 0;
  const ostalo=[]; let n=0;
  for(const o of a){
    try{ await snrPosalji(o.I, (o.opis||'')+(o.vreme?' · '+o.vreme:''), 0); n++; }
    catch(e){ ostalo.push(o); }
  }
  arhivaUpisi(ostalo); return n;
}
async function otvoriArhivu(){
  $("arhiva").classList.add('open');
  $("arhivaLista").innerHTML='<div class="arch-empty">⏳ Učitavam...</div>';
  let server=null, preneto=0;
  try{
    preneto=await snrSinhronizuj();
    const res=await fetch(API_URL+'/nalozi.php?action=list&tip=snr',{headers:{'X-Api-Key':API_KEY}});
    const j=await res.json();
    if(j.ok) server=j.data.filter(o=>o.status==='snr');
  }catch(e){}
  const lok=arhiva();
  let html='';
  if(server===null) html+='<div class="arch-empty" style="padding:12px 16px;color:#f0b49a">📴 Nema veze sa serverom — prikazani su samo nalozi sačuvani na ovom uređaju.</div>';
  else if(preneto) html+=`<div class="arch-empty" style="padding:12px 16px;color:#9fd8a8">✓ ${preneto} lokalno sačuvanih naloga prebačeno na server.</div>`;
  html+=(server||[]).map(o=>`<div class="arch-item">
      <b>${esc(o.klijent||'(bez naziva)')}</b>
      <small>${esc(o.napomena||'')} · ${esc((o.created_at||'').substring(0,16))}</small>
      <button class="btn-xs btn-xs-load" onclick="ucitaj(${o.id},1)">Učitaj</button><button class="btn-xs btn-xs-del" onclick="obrisi(${o.id},1)">Obriši</button></div>`).join('');
  html+=lok.map(o=>`<div class="arch-item">
      <b>${esc([o.I.brNaloga,o.I.kupac].filter(Boolean).join(' · ')||'(bez naziva)')} 📴</b>
      <small>${esc(o.opis)} · ${esc(o.vreme)} · samo na ovom uređaju</small>
      <button class="btn-xs btn-xs-load" onclick="ucitaj(${o.id},0)">Učitaj</button><button class="btn-xs btn-xs-del" onclick="obrisi(${o.id},0)">Obriši</button></div>`).join('');
  if(!(server||[]).length && !lok.length) html+='<div class="arch-empty">Nema sačuvanih naloga.<br>Klikni 💾 Sačuvaj da sačuvaš trenutni.</div>';
  $("arhivaLista").innerHTML=html;
}
function zatvoriArhivu(){ $("arhiva").classList.remove('open'); }
function snrPopuni(I){
  POLJA.forEach(k=>{ if(I[k]!==undefined) $(k).value=I[k]; });
  zatvoriArhivu(); crtaj();
}
async function ucitaj(id,saServera){
  if(!saServera){ const o=arhiva().find(x=>x.id===id); if(o){ snrAktivan={id:null,kljuc:''}; snrPopuni(o.I); } return; }
  try{
    const res=await fetch(API_URL+'/nalozi.php?action=get&id='+id,{headers:{'X-Api-Key':API_KEY}});
    const j=await res.json();
    if(j.ok && j.data.input_data){ snrAktivan={id,kljuc:snrKljuc(j.data.input_data)}; snrPopuni(j.data.input_data); }
  }catch(e){ alert('Ne mogu da učitam nalog — proveri internet.'); }
}
async function obrisi(id,saServera){
  if(!confirm('Obrisati ovaj nalog iz arhive?')) return;
  if(saServera){
    try{ await fetch(API_URL+'/nalozi.php?action=delete',{method:'POST',headers:apiH(),body:JSON.stringify({id})}); }catch(e){}
  } else arhivaUpisi(arhiva().filter(x=>x.id!==id));
  otvoriArhivu();
}
