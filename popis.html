<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<meta name="theme-color" content="#191814"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>AG — Popis magacina</title>
<style>
:root{
  --ink:#191814; --bronze:#a9743c; --bronzeD:#8a5d2e;
  --shell:#15171b; --shell2:#1e2127; --line:#2e3138;
  --ok:#3a7a4d; --warn:#bd4a2a; --paper:#f6f4ee;
  --text:#e8e4d8; --muted:#888;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
html,body{background:var(--shell);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;font-size:15px;min-height:100vh;}

/* ── HEADER ── */
.hdr{background:var(--ink);padding:12px 16px 10px;position:sticky;top:0;z-index:100;}
.hdr-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.hdr-title{font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--bronze);}
.hdr-date{font-size:11px;color:var(--muted);}
.progress-bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;}
.progress-fill{height:100%;background:var(--bronze);border-radius:2px;transition:width .3s;}
.progress-txt{font-size:10px;color:var(--muted);margin-top:4px;text-align:right;}

/* ── SEKCIJE ── */
.sek-wrap{margin:10px 12px 0;}
.sek-btn{width:100%;background:var(--shell2);border:1px solid var(--line);border-radius:10px;
  padding:13px 16px;display:flex;align-items:center;justify-content:space-between;
  cursor:pointer;margin-bottom:6px;text-align:left;}
.sek-btn.open{border-color:var(--bronze);border-bottom-left-radius:0;border-bottom-right-radius:0;margin-bottom:0;}
.sek-left{display:flex;align-items:center;gap:10px;}
.sek-icon{font-size:18px;width:28px;text-align:center;}
.sek-name{font-weight:700;font-size:14px;}
.sek-count{font-size:11px;color:var(--muted);margin-top:1px;}
.sek-badge{background:var(--bronze);color:#fff;font-size:10px;font-weight:700;
  padding:2px 7px;border-radius:10px;white-space:nowrap;}
.sek-badge.done{background:var(--ok);}
.sek-arrow{color:var(--muted);font-size:12px;transition:transform .2s;}
.sek-btn.open .sek-arrow{transform:rotate(180deg);}

.sek-body{display:none;background:var(--shell2);border:1px solid var(--bronze);
  border-top:none;border-radius:0 0 10px 10px;margin-bottom:6px;overflow:hidden;}
.sek-body.open{display:block;}

/* ── STAVKA ── */
.stavka{padding:12px 14px;border-bottom:1px solid var(--line);}
.stavka:last-child{border-bottom:none;}
.stavka-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:8px;}
.stavka-info{flex:1;min-width:0;}
.stavka-sifra{font-size:10px;color:var(--muted);font-family:monospace;letter-spacing:.04em;}
.stavka-naziv{font-size:13px;font-weight:600;line-height:1.3;}
.stavka-jed{font-size:10px;color:var(--muted);}
.stavka-ok{width:24px;height:24px;border-radius:50%;background:var(--line);
  display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;margin-top:2px;}
.stavka-ok.done{background:var(--ok);color:#fff;}

/* ── KOM COUNTER ── */
.kom-row{display:flex;align-items:center;gap:0;}
.kom-btn{width:44px;height:44px;border:1px solid var(--line);background:var(--shell);
  color:var(--text);font-size:20px;font-weight:300;cursor:pointer;
  display:flex;align-items:center;justify-content:center;border-radius:8px;}
.kom-btn:active{background:var(--bronze);}
.kom-val{flex:1;height:44px;background:var(--shell);border:1px solid var(--line);
  border-left:none;border-right:none;text-align:center;font-size:18px;font-weight:700;
  color:#fff;-moz-appearance:textfield;}
.kom-val::-webkit-inner-spin-button,.kom-val::-webkit-outer-spin-button{-webkit-appearance:none;}
.kom-min-row{margin-top:6px;display:flex;align-items:center;gap:8px;}
.kom-min-lbl{font-size:10px;color:var(--muted);white-space:nowrap;}
.kom-min-inp{flex:1;height:34px;background:var(--shell);border:1px solid var(--line);
  border-radius:6px;color:var(--text);font-size:13px;text-align:center;padding:0 8px;}

/* ── PROFIL KOMADI ── */
.komadi-list{display:flex;flex-direction:column;gap:6px;margin-bottom:8px;}
.komad-row{display:flex;align-items:center;gap:6px;}
.komad-len{flex:1;height:44px;background:var(--shell);border:1px solid var(--line);
  border-radius:8px;color:#fff;font-size:16px;text-align:center;font-weight:600;padding:0 8px;}
.komad-len::placeholder{color:var(--muted);font-weight:400;font-size:13px;}
.komad-del{width:44px;height:44px;background:#2e1a1a;border:1px solid #5a2020;
  border-radius:8px;color:#e07070;font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.komad-del:active{background:#5a2020;}
.komad-len.otpad{border-color:var(--warn);color:#e07a5f;}
.otpad-tag{font-size:10px;color:var(--warn);margin-left:4px;}
.btn-add-komad{width:100%;height:42px;background:var(--shell);border:1px dashed var(--line);
  border-radius:8px;color:var(--muted);font-size:13px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:6px;}
.btn-add-komad:active{border-color:var(--bronze);color:var(--bronze);}
.profil-sum{font-size:11px;color:var(--muted);margin-top:4px;text-align:right;}

/* ── GRUPISANI KOMADI (bunt prikaz) ── */
.grp-list{display:flex;flex-direction:column;gap:5px;margin-bottom:8px;}
.grp-chip{display:flex;align-items:center;gap:8px;background:var(--shell);
  border:1px solid var(--line);border-radius:8px;padding:6px 8px 6px 12px;}
.grp-chip.otpad{border-color:var(--warn);}
.grp-len{font-size:16px;font-weight:700;color:#fff;font-family:monospace;}
.grp-len.otpad{color:#e07a5f;}
.grp-x{font-size:13px;color:var(--muted);}
.grp-n{font-size:16px;font-weight:700;color:var(--bronze);min-width:30px;}
.grp-btns{display:flex;gap:4px;margin-left:auto;}
.grp-btn{width:38px;height:38px;border:1px solid var(--line);background:var(--shell2);
  color:var(--text);font-size:17px;cursor:pointer;border-radius:7px;
  display:flex;align-items:center;justify-content:center;}
.grp-btn:active{background:var(--bronze);}
.grp-btn.del{background:#2e1a1a;border-color:#5a2020;color:#e07070;font-size:14px;}
.grp-btn.del:active{background:#5a2020;}

/* ── BUNT UNOS ── */
.bunt-row{display:flex;align-items:center;gap:6px;}
.bunt-kom{width:74px;height:46px;background:var(--shell);border:1px solid var(--line);
  border-radius:8px;color:#fff;font-size:17px;text-align:center;font-weight:700;}
.bunt-kom::placeholder,.bunt-mm::placeholder{color:var(--muted);font-weight:400;font-size:12px;}
.bunt-x{color:var(--muted);font-size:14px;flex-shrink:0;}
.bunt-mm{flex:1;height:46px;background:var(--shell);border:1px solid var(--line);
  border-radius:8px;color:#fff;font-size:17px;text-align:center;font-weight:700;min-width:0;}
.bunt-add{height:46px;padding:0 16px;background:var(--bronze);border:none;border-radius:8px;
  color:#fff;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0;}
.bunt-add:active{background:var(--bronzeD);}

/* ── NOVI ARTIKAL ── */
.btn-novi-art{width:calc(100% - 28px);margin:10px 14px 12px;height:42px;background:transparent;
  border:1px dashed var(--bronze);border-radius:8px;color:var(--bronze);font-size:13px;
  font-weight:600;cursor:pointer;}
.btn-novi-art:active{background:rgba(169,116,60,.15);}
.novi-form{margin:0 14px 12px;background:var(--shell);border:1px solid var(--bronze);
  border-radius:8px;padding:12px;display:none;}
.novi-form.open{display:block;}
.novi-form label{display:block;font-size:10px;color:var(--muted);margin:8px 0 3px;}
.novi-form label:first-child{margin-top:0;}
.novi-inp{width:100%;height:42px;background:var(--shell2);border:1px solid var(--line);
  border-radius:7px;color:#fff;font-size:14px;padding:0 10px;}
.novi-btns{display:flex;gap:8px;margin-top:12px;}
.novi-save{flex:1;height:42px;background:var(--ok);border:none;border-radius:7px;
  color:#fff;font-size:13px;font-weight:700;cursor:pointer;}
.novi-cancel{height:42px;padding:0 14px;background:var(--shell2);border:1px solid var(--line);
  border-radius:7px;color:var(--text);font-size:13px;cursor:pointer;}
.custom-tag{font-size:9px;color:var(--bronze);border:1px solid var(--bronze);
  border-radius:3px;padding:1px 4px;margin-left:5px;vertical-align:middle;}
.art-del{font-size:10px;color:#e07070;background:none;border:none;cursor:pointer;
  text-decoration:underline;padding:2px 0;margin-top:2px;}

/* ── BOTTOM BAR ── */
.bottom-bar{position:sticky;bottom:0;background:var(--ink);border-top:1px solid var(--line);
  padding:10px 12px;display:flex;gap:8px;z-index:100;}
.btn-save{flex:1;height:46px;background:var(--bronze);border:none;border-radius:8px;
  color:#fff;font-size:14px;font-weight:700;cursor:pointer;letter-spacing:.04em;}
.btn-save:active{background:var(--bronzeD);}
.btn-export{height:46px;padding:0 16px;background:var(--shell2);border:1px solid var(--line);
  border-radius:8px;color:var(--text);font-size:13px;cursor:pointer;white-space:nowrap;}
.btn-export:active{border-color:var(--bronze);}
.autosave{font-size:10px;color:var(--ok);text-align:center;padding:4px 0 0;width:100%;}

/* ── TOAST ── */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);
  background:#222;color:#fff;padding:8px 18px;border-radius:20px;font-size:12px;
  opacity:0;transition:all .25s;pointer-events:none;z-index:999;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ── EXPORT MODAL ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:500;
  align-items:flex-end;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal{background:var(--shell2);border-radius:16px 16px 0 0;width:100%;max-height:80vh;
  overflow-y:auto;padding:20px 16px 32px;}
.modal h3{font-size:15px;margin-bottom:14px;color:var(--bronze);}
.export-out{background:var(--shell);border:1px solid var(--line);border-radius:8px;
  padding:10px;font-size:10px;font-family:monospace;white-space:pre-wrap;
  max-height:200px;overflow-y:auto;color:#aaa;margin-bottom:12px;}
.btn-copy{width:100%;height:44px;background:var(--bronze);border:none;border-radius:8px;
  color:#fff;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:8px;}
.btn-modal-close{width:100%;height:44px;background:var(--shell);border:1px solid var(--line);
  border-radius:8px;color:var(--text);font-size:13px;cursor:pointer;}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-top">
    <div class="hdr-title">AG GROUP · POPIS MAGACINA</div>
    <div class="hdr-date" id="hdDate">—</div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progFill" style="width:0%"></div></div>
  <div class="progress-txt" id="progTxt">0 / 0 stavki ima unos</div>
</div>

<div class="sek-wrap" id="mainWrap"></div>
<div style="height:8px"></div>

<div class="bottom-bar">
  <button class="btn-save" onclick="manualSave()">💾 Sačuvaj</button>
  <button class="btn-export" onclick="openExport()">📤 Izvoz</button>
  <div class="autosave" id="autoSaveTxt"></div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="exportModal" onclick="if(event.target===this)closeExport()">
  <div class="modal">
    <h3>📤 Izvoz podataka popisa</h3>
    <div class="export-out" id="exportOut"></div>
    <button class="btn-copy" onclick="copyExport()">Kopiraj sve</button>
    <button class="btn-modal-close" onclick="closeExport()">Zatvori</button>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════
   DEFINICIJA SVIH STAVKI
═══════════════════════════════════════════ */
const SEKCIJE = [
  {
    id:"alu", icon:"🔩", naziv:"Aluminijum profili",
    tip:"profil",
    stavke:[
      {sifra:"10501", naziv:"Šina (raj) 90×150"},

    tip:"kom",
    stavke:[

      {sifra:"ARV-T",  naziv:"Tapa (poklopac rupe 20mm)"},
      {sifra:"ARV-D",  naziv:"Tipla"},

  },
  {

    tip:"kom",
    stavke:[

      {sifra:"ARV-M5",  naziv:"Podloška fiksatora motora"},

      {sifra:"ARV-M7",  naziv:"Spoj stub–oluk"},

/* ═══════════════════════════════════════════
   STANJE — čuva se u localStorage
═══════════════════════════════════════════ */
const API_URL = 'https://app.aggroup.rs/api';
const API_KEY = 'ag2025app'; // mora biti isti kao u api/config.php

const OTPAD_PRAG_DEFAULT = 2000;
const OTPAD_PRAG_MAP = {
  "10501": 1500,  // Šina (raj) 90×150
  "10475": 1500,  // Šina (raj) 110×150
  "10419": 1500,  // Stub 110×144
  "10414": 1500,  // Stub 100×100
};
function getOtpadPrag(sifra){ return OTPAD_PRAG_MAP[sifra] ?? OTPAD_PRAG_DEFAULT; }
const LS_KEY = 'ag_popis_v1';
let STATE = {};

async function loadState(){
  try {
    const res = await fetch(API_URL+'/magacin.php?action=get', {headers:{'X-Api-Key': API_KEY}});
    const json = await res.json();
    if(json.ok){
      // server je izvor istine — i prazan magacin je validno stanje (posle reseta)
      STATE = json.data;
      localStorage.setItem(LS_KEY, JSON.stringify(STATE)); // keš
      return;
    }
  } catch(e){}
  // fallback: localStorage kad nema konekcije
  try { STATE = JSON.parse(localStorage.getItem(LS_KEY)||'{}'); } catch(e){ STATE={}; }
}

async function saveState(){
  localStorage.setItem(LS_KEY, JSON.stringify(STATE)); // uvek keš
  document.getElementById('autoSaveTxt').textContent = 'Čuvam...';
  try {
    const res = await fetch(API_URL+'/magacin.php?action=setall', {
      method:'POST',
      headers:{'Content-Type':'application/json','X-Api-Key': API_KEY},
      body: JSON.stringify({state: STATE})
    });
    const json = await res.json();
    document.getElementById('autoSaveTxt').textContent = json.ok ? 'Sačuvano ' + now() : '⚠ Lokalno ' + now();
  } catch(e){
    document.getElementById('autoSaveTxt').textContent = '📴 Lokalno ' + now();
  }
}
function now(){
  return new Date().toLocaleTimeString('sr-RS',{hour:'2-digit',minute:'2-digit'});
}
function getItem(sifra){ return STATE[sifra] || null; }
function setItem(sifra, data){ STATE[sifra]=data; saveState(); updateProgress(); }

/* ═══════════════════════════════════════════
   CUSTOM ARTIKLI — iz baze + localStorage keš
═══════════════════════════════════════════ */
const ART_LS_KEY = 'ag_custom_artikli';

async function loadArtikli(){
  let lista = [];
  try {
    const res = await fetch(API_URL+'/artikli.php?action=list', {headers:{'X-Api-Key': API_KEY}});
    const json = await res.json();
    if(json.ok){
      lista = json.data;
      // pokušaj da pošalješ pending artikle koji su čekali konekciju
      const local = JSON.parse(localStorage.getItem(ART_LS_KEY)||'[]');
      for(const a of local.filter(x=>x._pending)){
        try {
          const r = await fetch(API_URL+'/artikli.php?action=add', {
            method:'POST', headers:{'Content-Type':'application/json','X-Api-Key':API_KEY},
            body: JSON.stringify(a)
          });
          if((await r.json()).ok){ delete a._pending; lista.push(a); }
        } catch(e){}
      }
      localStorage.setItem(ART_LS_KEY, JSON.stringify(lista));
    }
  } catch(e){
    lista = JSON.parse(localStorage.getItem(ART_LS_KEY)||'[]');
  }
  // ubaci u sekcije (preskoči duplikate sa hardkodiranom listom)
  lista.forEach(a => {
    const sek = SEKCIJE.find(s => s.id === a.kategorija);
    if(!sek) return;
    if(sek.stavke.find(s => s.sifra === a.sifra)) return;
    sek.stavke.push({sifra: a.sifra, naziv: a.naziv, tip: a.tip, custom: true});
  });
}

/* ═══════════════════════════════════════════
   BUILD UI
═══════════════════════════════════════════ */
function build(){
  const wrap = document.getElementById('mainWrap');
  wrap.innerHTML = '';
  SEKCIJE.forEach(sek => {
    const total = sek.stavke.length;
    const done  = sek.stavke.filter(s => hasDone(s.sifra)).length;
    const pct   = Math.round(done/total*100);

    const btn = document.createElement('div');
    btn.className = 'sek-btn';
    btn.id = 'btn_'+sek.id;
    btn.innerHTML = `
      <div class="sek-left">
        <span class="sek-icon">${sek.icon}</span>
        <div>
          <div class="sek-name">${sek.naziv}</div>
          <div class="sek-count">${done}/${total} uneto</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <span class="sek-badge ${done===total?'done':''}">${pct}%</span>
        <span class="sek-arrow">▼</span>
      </div>`;
    btn.onclick = () => toggleSek(sek.id);

    const body = document.createElement('div');
    body.className = 'sek-body';
    body.id = 'body_'+sek.id;
    body.innerHTML = sek.stavke.map(s => buildStavka(s, sek.tip, sek.id)).join('')
      + buildNoviForm(sek);

    wrap.appendChild(btn);
    wrap.appendChild(body);
  });
}

function buildNoviForm(sek){
  // Sekcije sa jednim fiksnim tipom ne treba da imaju dropdown — ne može da se pogreši
  // Samo "elek" i "ost" imaju mešane tipove pa prikazujemo izbor
  const mixed = ['elek','ost'].includes(sek.id);
  const tipField = mixed
    ? `<label>Način merenja</label>
      <select class="novi-inp" id="nf_tip_${sek.id}">
        <option value="kom">Komad (kom)</option>
        <option value="metar">Dužni metar (m)</option>
        <option value="metar2">Kvadrat (m²)</option>
      </select>`
    : `<input type="hidden" id="nf_tip_${sek.id}" value="${sek.tip}">
      <div style="font-size:10px;color:var(--muted);margin:6px 0 2px;">
        Tip: <b style="color:var(--bronze)">${
          sek.tip==='profil' ? 'Profil — unos po komadima i dužinama' :
          sek.tip==='metar'  ? 'Dužni metar (m)' : 'Komad (kom)'
        }</b>
      </div>`;

  return `
    <button class="btn-novi-art" onclick="openNovi('${sek.id}')">＋ Novi artikal u: ${sek.naziv}</button>
    <div class="novi-form" id="nf_${sek.id}">
      <label>Šifra artikla</label>
      <input class="novi-inp" id="nf_sifra_${sek.id}" placeholder="npr. STR75" autocomplete="off" style="text-transform:uppercase">
      <label>Naziv</label>
      <input class="novi-inp" id="nf_naziv_${sek.id}" placeholder="naziv artikla" autocomplete="off">
      ${tipField}
      <div class="novi-btns">
        <button class="novi-save" onclick="saveNovi('${sek.id}')">✓ Dodaj artikal</button>
        <button class="novi-cancel" onclick="closeNovi('${sek.id}')">Otkaži</button>
      </div>
    </div>`;
}

function openNovi(sekId){ document.getElementById('nf_'+sekId).classList.add('open'); }
function closeNovi(sekId){ document.getElementById('nf_'+sekId).classList.remove('open'); }

async function saveNovi(sekId){
  const sifra = document.getElementById('nf_sifra_'+sekId).value.trim().toUpperCase();
  const naziv = document.getElementById('nf_naziv_'+sekId).value.trim();
  const tip   = document.getElementById('nf_tip_'+sekId).value;
  if(!sifra || !naziv){ showToast('⚠ Unesi šifru i naziv'); return; }
  // duplikat?
  for(const sek of SEKCIJE){
    if(sek.stavke.find(s => s.sifra === sifra)){
      showToast('⚠ Šifra '+sifra+' već postoji'); return;
    }
  }
  const art = {sifra, naziv, kategorija: sekId, tip};
  let saved = false;
  try {
    const res = await fetch(API_URL+'/artikli.php?action=add', {
      method:'POST', headers:{'Content-Type':'application/json','X-Api-Key': API_KEY},
      body: JSON.stringify(art)
    });
    saved = (await res.json()).ok;
  } catch(e){}
  // u localStorage keš (pending ako API nije prošao — sinhronizuje se kasnije)
  const local = JSON.parse(localStorage.getItem(ART_LS_KEY)||'[]');
  if(!saved) art._pending = true;
  local.push(art);
  localStorage.setItem(ART_LS_KEY, JSON.stringify(local));

  const sek = SEKCIJE.find(s => s.id === sekId);
  sek.stavke.push({sifra, naziv, tip, custom: true});
  build();
  updateProgress();
  toggleSek(sekId);
  showToast(saved ? '✓ Artikal dodat' : '📴 Dodat lokalno — sinhronizuje se kasnije');
}

async function delArtikal(sifra, sekId){
  if(!confirm('Ukloniti artikal '+sifra+' iz kataloga?\n(Stanje u magacinu ostaje zabeleženo)')) return;
  try {
    await fetch(API_URL+'/artikli.php?action=delete', {
      method:'POST', headers:{'Content-Type':'application/json','X-Api-Key': API_KEY},
      body: JSON.stringify({sifra})
    });
  } catch(e){}
  const local = JSON.parse(localStorage.getItem(ART_LS_KEY)||'[]').filter(a=>a.sifra!==sifra);
  localStorage.setItem(ART_LS_KEY, JSON.stringify(local));
  const sek = SEKCIJE.find(s => s.id === sekId);
  sek.stavke = sek.stavke.filter(s => s.sifra !== sifra);
  build();
  updateProgress();
  toggleSek(sekId);
}

function buildStavka(s, sekTip, sekId){
  const tip = s.tip || sekTip;
  const isDone = hasDone(s.sifra);
  const d = getItem(s.sifra) || {};
  const customTag = s.custom ? '<span class="custom-tag">novo</span>' : '';
  const customDel = s.custom ? `<button class="art-del" onclick="delArtikal('${s.sifra}','${sekId}')">ukloni artikal</button>` : '';

  if(tip === 'profil'){
    const komadi = (d.komadi || []).filter(k=>+k.duzina>0);
    const ukupno = komadi.reduce((a,k)=>a+(+k.duzina||0),0);
    return `<div class="stavka" id="stav_${s.sifra}">
      <div class="stavka-top">
        <div class="stavka-info">
          <div class="stavka-sifra">${s.sifra}${customTag}</div>
          <div class="stavka-naziv">${s.naziv}</div>
          <div class="stavka-jed">unos: broj komada × dužina (mm)</div>
          ${customDel}
        </div>
        <div class="stavka-ok ${isDone?'done':''}" id="ok_${s.sifra}">${isDone?'✓':''}</div>
      </div>
      <div class="grp-list" id="kl_${s.sifra}">${buildGrupe(s.sifra, komadi)}</div>
      <div class="bunt-row">
        <input class="bunt-kom" type="number" inputmode="numeric" min="1" placeholder="kom" id="bk_${s.sifra}">
        <span class="bunt-x">×</span>
        <input class="bunt-mm" type="number" inputmode="numeric" min="1" placeholder="dužina mm" id="bd_${s.sifra}">
        <button class="bunt-add" onclick="addBunt('${s.sifra}')">＋ Dodaj</button>
      </div>
      <div class="profil-sum" id="sum_${s.sifra}">${ukupno>0?'Ukupno: '+komadi.length+' kom = '+(ukupno/1000).toFixed(2)+' m':''}</div>
    </div>`;
  }

  const jed = tip==='metar'?'m':tip==='metar2'?'m²':'kom';
  const val = d.kolicina ?? '';
  const min = d.minimum ?? '';
  return `<div class="stavka" id="stav_${s.sifra}">
    <div class="stavka-top">
      <div class="stavka-info">
        <div class="stavka-sifra">${s.sifra}${customTag}</div>
        <div class="stavka-naziv">${s.naziv}</div>
        <div class="stavka-jed">${jed}</div>
        ${customDel}
      </div>
      <div class="stavka-ok ${isDone?'done':''}" id="ok_${s.sifra}">${isDone?'✓':''}</div>
    </div>
    <div class="kom-row">
      <button class="kom-btn" style="border-radius:8px 0 0 8px" onclick="adj('${s.sifra}',-1)">−</button>
      <input class="kom-val" type="number" min="0" step="${tip==='kom'?1:0.5}" inputmode="decimal"
        value="${val}" id="inp_${s.sifra}"
        onchange="setKol('${s.sifra}',this.value)"
        oninput="setKol('${s.sifra}',this.value)">
      <button class="kom-btn" style="border-radius:0 8px 8px 0" onclick="adj('${s.sifra}',1)">＋</button>
    </div>
    <div class="kom-min-row">
      <span class="kom-min-lbl">Min. upozorenje:</span>
      <input class="kom-min-inp" type="number" min="0" inputmode="decimal"
        placeholder="npr. 10" value="${min}" id="min_${s.sifra}"
        onchange="setMin('${s.sifra}',this.value)">
    </div>
  </div>`;
}

/* ═══════════════════════════════════════════
   AKCIJE — profili (grupisani prikaz, bunt unos)
═══════════════════════════════════════════ */
function buildGrupe(sifra, komadi){
  const grupe = {};
  komadi.forEach(k => { const len = +k.duzina; grupe[len] = (grupe[len]||0)+1; });
  const prag = getOtpadPrag(sifra);
  const lens = Object.keys(grupe).map(Number).sort((a,b)=>b-a);
  if(!lens.length) return '<div style="font-size:11px;color:var(--muted);padding:4px 2px;">Nema unetih komada</div>';
  return lens.map(len => {
    const n = grupe[len];
    const otp = len < prag;
    return `<div class="grp-chip${otp?' otpad':''}">
      <span class="grp-len${otp?' otpad':''}">${len} mm</span>
      ${otp?'<span class="otpad-tag">ispod praga</span>':''}
      <span class="grp-x">×</span><span class="grp-n">${n}</span>
      <div class="grp-btns">
        <button class="grp-btn" onclick="grpAdj('${sifra}',${len},-1)">−</button>
        <button class="grp-btn" onclick="grpAdj('${sifra}',${len},1)">＋</button>
        <button class="grp-btn del" onclick="grpDel('${sifra}',${len})">✕</button>
      </div>
    </div>`;
  }).join('');
}

function addBunt(sifra){
  const komInp = document.getElementById('bk_'+sifra);
  const mmInp  = document.getElementById('bd_'+sifra);
  const kom = parseInt(komInp.value) || 1;
  const mm  = parseInt(mmInp.value);
  if(!mm || mm <= 0){ showToast('⚠ Unesi dužinu u mm'); mmInp.focus(); return; }
  const d = getItem(sifra) || {komadi:[]};
  if(!d.komadi) d.komadi = [];
  for(let i=0; i<kom; i++) d.komadi.push({duzina: String(mm)});
  setItem(sifra, d);
  refreshStavka(sifra);
  komInp.value = ''; mmInp.value = '';
  showToast('✓ '+kom+' × '+mm+' mm dodato');
}

function grpAdj(sifra, len, delta){
  const d = getItem(sifra) || {komadi:[]};
  if(!d.komadi) d.komadi = [];
  if(delta > 0){
    d.komadi.push({duzina: String(len)});
  } else {
    const idx = d.komadi.findIndex(k => +k.duzina === len);
    if(idx === -1) return;
    d.komadi.splice(idx, 1);
  }
  setItem(sifra, d);
  refreshStavka(sifra);
}

function grpDel(sifra, len){
  const d = getItem(sifra) || {komadi:[]};
  const n = (d.komadi||[]).filter(k => +k.duzina === len).length;
  if(n > 1 && !confirm('Obrisati svih '+n+' komada od '+len+' mm?')) return;
  d.komadi = (d.komadi||[]).filter(k => +k.duzina !== len);
  setItem(sifra, d);
  refreshStavka(sifra);
}

function updateSum(sifra){
  const d = getItem(sifra)||{};
  const komadi = (d.komadi||[]).filter(k=>+k.duzina>0);
  const uk = komadi.reduce((a,k)=>a+(+k.duzina||0),0);
  const el = document.getElementById('sum_'+sifra);
  if(el) el.textContent = uk>0?'Ukupno: '+komadi.length+' kom = '+(uk/1000).toFixed(2)+' m':'';
}

/* ═══════════════════════════════════════════
   AKCIJE — kom / metar
═══════════════════════════════════════════ */
function adj(sifra, delta){
  const inp = document.getElementById('inp_'+sifra);
  const cur = parseFloat(inp.value)||0;
  const step = parseFloat(inp.step)||1;
  const nv = Math.max(0, Math.round((cur+delta*step)*100)/100);
  inp.value = nv;
  setKol(sifra, nv);
}
function setKol(sifra, val){
  const d = getItem(sifra)||{};
  d.kolicina = val===''||val===null?'':+val;
  setItem(sifra,d);
  updateOk(sifra);
}
function setMin(sifra, val){
  const d = getItem(sifra)||{};
  d.minimum = val===''?'':+val;
  setItem(sifra,d);
}

/* ═══════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════ */
function hasDone(sifra){
  const d = STATE[sifra];
  if(!d) return false;
  if(d.komadi) return d.komadi.length>0 && d.komadi.some(k=>+k.duzina>0);
  return d.kolicina!==undefined && d.kolicina!=='';
}
function updateOk(sifra){
  const el = document.getElementById('ok_'+sifra);
  if(!el) return;
  const done = hasDone(sifra);
  el.className = 'stavka-ok '+(done?'done':'');
  el.textContent = done?'✓':'';
  updateSekHeader(sifra);
  updateProgress();
}
function updateSekHeader(sifra){
  SEKCIJE.forEach(sek=>{
    if(!sek.stavke.find(s=>s.sifra===sifra)) return;
    const total = sek.stavke.length;
    const done  = sek.stavke.filter(s=>hasDone(s.sifra)).length;
    const pct   = Math.round(done/total*100);
    const btn   = document.getElementById('btn_'+sek.id);
    if(!btn) return;
    btn.querySelector('.sek-count').textContent = done+'/'+total+' uneto';
    const badge = btn.querySelector('.sek-badge');
    badge.textContent = pct+'%';
    badge.className = 'sek-badge '+(done===total?'done':'');
  });
}
function updateProgress(){
  let total=0, done=0;
  SEKCIJE.forEach(s=>{ s.stavke.forEach(st=>{ total++; if(hasDone(st.sifra)) done++; }); });
  document.getElementById('progFill').style.width = Math.round(done/total*100)+'%';
  document.getElementById('progTxt').textContent = done+' / '+total+' stavki ima unos';
}
function refreshStavka(sifra){
  const el = document.getElementById('kl_'+sifra);
  if(el){
    const d = getItem(sifra)||{};
    const komadi = (d.komadi||[]).filter(k=>+k.duzina>0);
    el.innerHTML = buildGrupe(sifra, komadi);
    updateSum(sifra);
    updateOk(sifra);
  }
}
function toggleSek(id){
  const btn  = document.getElementById('btn_'+id);
  const body = document.getElementById('body_'+id);
  const open = body.classList.contains('open');
  btn.classList.toggle('open',!open);
  body.classList.toggle('open',!open);
}

/* ═══════════════════════════════════════════
   SAVE / EXPORT
═══════════════════════════════════════════ */
function manualSave(){
  saveState();
  showToast('✓ Sačuvano');
}
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}
function openExport(){
  const lines = [];
  lines.push('AG GROUP — Popis magacina');
  lines.push('Datum: '+new Date().toLocaleDateString('sr-RS'));
  lines.push('');
  SEKCIJE.forEach(sek=>{
    lines.push('=== '+sek.naziv.toUpperCase()+' ===');
    sek.stavke.forEach(s=>{
      const d = getItem(s.sifra);
      if(!d){ lines.push('  '+s.sifra+' | '+s.naziv+' | —'); return; }
      if(d.komadi){
        const uk = d.komadi.reduce((a,k)=>a+(+k.duzina||0),0);
        lines.push('  '+s.sifra+' | '+s.naziv+' | '+d.komadi.length+' komada | '+uk+' mm ukupno');
        d.komadi.forEach((k,i)=>{ lines.push('    Komad '+(i+1)+': '+(k.duzina||'?')+' mm'); });
      } else {
        lines.push('  '+s.sifra+' | '+s.naziv+' | '+d.kolicina+(d.minimum?'  (min: '+d.minimum+')':''));
      }
    });
    lines.push('');
  });
  document.getElementById('exportOut').textContent = lines.join('\n');
  document.getElementById('exportModal').classList.add('open');
}
function closeExport(){ document.getElementById('exportModal').classList.remove('open'); }
function copyExport(){
  const txt = document.getElementById('exportOut').textContent;
  navigator.clipboard.writeText(txt).then(()=>{ showToast('✓ Kopirano'); closeExport(); });
}

/* ═══════════════════════════════════════════
   INIT
═══════════════════════════════════════════ */
document.getElementById('hdDate').textContent = new Date().toLocaleDateString('sr-RS',{day:'2-digit',month:'2-digit',year:'numeric'});
Promise.all([loadState(), loadArtikli()]).then(()=>{ build(); updateProgress(); });
</script>
