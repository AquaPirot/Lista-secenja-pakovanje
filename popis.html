<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<meta name="theme-color" content="#191814"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>AG — Popis magacina</title>
<style>
:root{
  --ink:#191814; --bronze:#a9743c; --bronzeD:#8a5d2e;
  --shell:#15171b; --shell2:#1e2127; --line:#2e3138;
  --ok:#3a7a4d; --warn:#bd4a2a; --paper:#f6f4ee;
  --text:#e8e4d8; --muted:#888;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
html,body{background:var(--shell);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;font-size:15px;min-height:100vh;}

/* ── HEADER ── */
.hdr{background:var(--ink);padding:12px 16px 10px;position:sticky;top:0;z-index:100;}
.hdr-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.hdr-title{font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--bronze);}
.hdr-date{font-size:11px;color:var(--muted);}
.progress-bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;}
.progress-fill{height:100%;background:var(--bronze);border-radius:2px;transition:width .3s;}
.progress-txt{font-size:10px;color:var(--muted);margin-top:4px;text-align:right;}

/* ── SEKCIJE ── */
.sek-wrap{margin:10px 12px 0;}
.sek-btn{width:100%;background:var(--shell2);border:1px solid var(--line);border-radius:10px;
  padding:13px 16px;display:flex;align-items:center;justify-content:space-between;
  cursor:pointer;margin-bottom:6px;text-align:left;}
.sek-btn.open{border-color:var(--bronze);border-bottom-left-radius:0;border-bottom-right-radius:0;margin-bottom:0;}
.sek-left{display:flex;align-items:center;gap:10px;}
.sek-icon{font-size:18px;width:28px;text-align:center;}
.sek-name{font-weight:700;font-size:14px;}
.sek-count{font-size:11px;color:var(--muted);margin-top:1px;}
.sek-badge{background:var(--bronze);color:#fff;font-size:10px;font-weight:700;
  padding:2px 7px;border-radius:10px;white-space:nowrap;}
.sek-badge.done{background:var(--ok);}
.sek-arrow{color:var(--muted);font-size:12px;transition:transform .2s;}
.sek-btn.open .sek-arrow{transform:rotate(180deg);}

.sek-body{display:none;background:var(--shell2);border:1px solid var(--bronze);
  border-top:none;border-radius:0 0 10px 10px;margin-bottom:6px;overflow:hidden;}
.sek-body.open{display:block;}

/* ── STAVKA ── */
.stavka{padding:12px 14px;border-bottom:1px solid var(--line);}
.stavka:last-child{border-bottom:none;}
.stavka-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:8px;}
.stavka-info{flex:1;min-width:0;}
.stavka-sifra{font-size:10px;color:var(--muted);font-family:monospace;letter-spacing:.04em;}
.stavka-naziv{font-size:13px;font-weight:600;line-height:1.3;}
.stavka-jed{font-size:10px;color:var(--muted);}
.stavka-ok{width:24px;height:24px;border-radius:50%;background:var(--line);
  display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;margin-top:2px;}
.stavka-ok.done{background:var(--ok);color:#fff;}

/* ── KOM COUNTER ── */
.kom-row{display:flex;align-items:center;gap:0;}
.kom-btn{width:44px;height:44px;border:1px solid var(--line);background:var(--shell);
  color:var(--text);font-size:20px;font-weight:300;cursor:pointer;
  display:flex;align-items:center;justify-content:center;border-radius:8px;}
.kom-btn:active{background:var(--bronze);}
.kom-val{flex:1;height:44px;background:var(--shell);border:1px solid var(--line);
  border-left:none;border-right:none;text-align:center;font-size:18px;font-weight:700;
  color:#fff;-moz-appearance:textfield;}
.kom-val::-webkit-inner-spin-button,.kom-val::-webkit-outer-spin-button{-webkit-appearance:none;}
.kom-min-row{margin-top:6px;display:flex;align-items:center;gap:8px;}
.kom-min-lbl{font-size:10px;color:var(--muted);white-space:nowrap;}
.kom-min-inp{flex:1;height:34px;background:var(--shell);border:1px solid var(--line);
  border-radius:6px;color:var(--text);font-size:13px;text-align:center;padding:0 8px;}

/* ── PROFIL KOMADI ── */
.komadi-list{display:flex;flex-direction:column;gap:6px;margin-bottom:8px;}
.komad-row{display:flex;align-items:center;gap:6px;}
.komad-len{flex:1;height:44px;background:var(--shell);border:1px solid var(--line);
  border-radius:8px;color:#fff;font-size:16px;text-align:center;font-weight:600;padding:0 8px;}
.komad-len::placeholder{color:var(--muted);font-weight:400;font-size:13px;}
.komad-del{width:44px;height:44px;background:#2e1a1a;border:1px solid #5a2020;
  border-radius:8px;color:#e07070;font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.komad-del:active{background:#5a2020;}
.komad-len.otpad{border-color:var(--warn);color:#e07a5f;}
.otpad-tag{font-size:10px;color:var(--warn);margin-left:4px;}
.btn-add-komad{width:100%;height:42px;background:var(--shell);border:1px dashed var(--line);
  border-radius:8px;color:var(--muted);font-size:13px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:6px;}
.btn-add-komad:active{border-color:var(--bronze);color:var(--bronze);}
.profil-sum{font-size:11px;color:var(--muted);margin-top:4px;text-align:right;}

/* ── BOTTOM BAR ── */
.bottom-bar{position:sticky;bottom:0;background:var(--ink);border-top:1px solid var(--line);
  padding:10px 12px;display:flex;gap:8px;z-index:100;}
.btn-save{flex:1;height:46px;background:var(--bronze);border:none;border-radius:8px;
  color:#fff;font-size:14px;font-weight:700;cursor:pointer;letter-spacing:.04em;}
.btn-save:active{background:var(--bronzeD);}
.btn-export{height:46px;padding:0 16px;background:var(--shell2);border:1px solid var(--line);
  border-radius:8px;color:var(--text);font-size:13px;cursor:pointer;white-space:nowrap;}
.btn-export:active{border-color:var(--bronze);}
.autosave{font-size:10px;color:var(--ok);text-align:center;padding:4px 0 0;width:100%;}

/* ── TOAST ── */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);
  background:#222;color:#fff;padding:8px 18px;border-radius:20px;font-size:12px;
  opacity:0;transition:all .25s;pointer-events:none;z-index:999;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ── EXPORT MODAL ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:500;
  align-items:flex-end;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal{background:var(--shell2);border-radius:16px 16px 0 0;width:100%;max-height:80vh;
  overflow-y:auto;padding:20px 16px 32px;}
.modal h3{font-size:15px;margin-bottom:14px;color:var(--bronze);}
.export-out{background:var(--shell);border:1px solid var(--line);border-radius:8px;
  padding:10px;font-size:10px;font-family:monospace;white-space:pre-wrap;
  max-height:200px;overflow-y:auto;color:#aaa;margin-bottom:12px;}
.btn-copy{width:100%;height:44px;background:var(--bronze);border:none;border-radius:8px;
  color:#fff;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:8px;}
.btn-modal-close{width:100%;height:44px;background:var(--shell);border:1px solid var(--line);
  border-radius:8px;color:var(--text);font-size:13px;cursor:pointer;}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-top">
    <div class="hdr-title">AG GROUP · POPIS MAGACINA</div>
    <div class="hdr-date" id="hdDate">—</div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progFill" style="width:0%"></div></div>
  <div class="progress-txt" id="progTxt">0 / 0 stavki ima unos</div>
</div>

<div class="sek-wrap" id="mainWrap"></div>
<div style="height:8px"></div>

<div class="bottom-bar">
  <button class="btn-save" onclick="manualSave()">💾 Sačuvaj</button>
  <button class="btn-export" onclick="openExport()">📤 Izvoz</button>
  <div class="autosave" id="autoSaveTxt"></div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="exportModal" onclick="if(event.target===this)closeExport()">
  <div class="modal">
    <h3>📤 Izvoz podataka popisa</h3>
    <div class="export-out" id="exportOut"></div>
    <button class="btn-copy" onclick="copyExport()">Kopiraj sve</button>
    <button class="btn-modal-close" onclick="closeExport()">Zatvori</button>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════
   DEFINICIJA SVIH STAVKI
═══════════════════════════════════════════ */
const SEKCIJE = [
  {
    id:"alu", icon:"🔩", naziv:"Aluminijum profili",
    tip:"profil",
    stavke:[
      {sifra:"10501", naziv:"Šina (raj) 90×150"},
      {sifra:"10475", naziv:"Šina (raj) 110×150"},
      {sifra:"10468", naziv:"Oluk"},
      {sifra:"10471", naziv:"Korniš — TANKI"},
      {sifra:"10472", naziv:"Korniš — DEBELI"},
      {sifra:"10470", naziv:"Tanki stringcourse (korniš kedera)"},
      {sifra:"10419", naziv:"Stub 110×144"},
      {sifra:"10414", naziv:"Stub 100×100"},
      {sifra:"10420", naziv:"Panel (između rajeva)"},
      {sifra:"10417", naziv:"Cev motora"},
      {sifra:"CEV-80",  naziv:"Cev na zidu 80×40 (čelična)"},
      {sifra:"CEV-100", naziv:"Cev na zidu 100×100 (čelična)"},
    ]
  },
  {
    id:"pla", icon:"🔧", naziv:"Plastika",
    tip:"kom",
    stavke:[
      {sifra:"ARV-01", naziv:"Velike plastike za zupčanik"},
      {sifra:"ARV-02", naziv:"Veliki zupčanik"},
      {sifra:"ARV-03", naziv:"Kočnica"},
      {sifra:"ARV-04", naziv:"Prednji zatezač L/D"},
      {sifra:"ARV-05", naziv:"Komplet za prednji ležaj"},
      {sifra:"ARV-07", naziv:"Plastika spoja kaiša"},
      {sifra:"ARV-08", naziv:"Velika kolica"},
      {sifra:"ARV-09", naziv:"Mala kolica"},
      {sifra:"ARV-06", naziv:"Odvod vode oluka"},
      {sifra:"ARV-19", naziv:"Ugaoni umetak tankog korniša"},
      {sifra:"ARV-20", naziv:"Srednji umetak tankog korniša"},
      {sifra:"ARV-21", naziv:"Ugaoni umetak debelog korniša"},
      {sifra:"ARV-22", naziv:"Srednji umetak debelog korniša"},
      {sifra:"ARV-T",  naziv:"Tapa (poklopac rupe 20mm)"},
      {sifra:"ARV-D",  naziv:"Tipla"},
      {sifra:"PRG-117",naziv:"Veliki ležaj"},
      {sifra:"PRG-119",naziv:"Mali ležaj"},
    ]
  },
  {
    id:"met", icon:"⚙️", naziv:"Metal okov",
    tip:"kom",
    stavke:[
      {sifra:"ARV-M1",  naziv:"Zidni nosač šine"},
      {sifra:"ARV-M2a", naziv:"Zadnji spoj šine — SA rupom"},
      {sifra:"ARV-M2b", naziv:"Zadnji spoj šine — BEZ rupe"},
      {sifra:"ARV-M4",  naziv:"Fiksator motora na šinu"},
      {sifra:"ARV-M5",  naziv:"Podloška fiksatora motora"},
      {sifra:"ARV-M6",  naziv:"Spoj šina–oluk"},
      {sifra:"ARV-M7",  naziv:"Spoj stub–oluk"},
      {sifra:"ARV-M8",  naziv:"Spoj rasponke i raja"},
      {sifra:"ARV-M10", naziv:"Prednji zatezač automat"},
      {sifra:"ARV-M11", naziv:"Prednji poklopac šine"},
      {sifra:"ARV-M12", naziv:"Donja stopa stuba"},
      {sifra:"ARV-M13", naziv:"Bočni poklopac oluka L+D"},
    ]
  },
  {
    id:"fit", icon:"📏", naziv:"Fitilji, kederi, kaiševi",
    tip:"metar",
    stavke:[
      {sifra:"PRG-102", naziv:"Fitilj / keder šine"},
      {sifra:"PRG-104", naziv:"Fitilj / keder oluka"},
      {sifra:"PRG-101", naziv:"Fitilj / keder cerade — korniš"},
      {sifra:"PRG-103", naziv:"Fitilj kabla"},
      {sifra:"PRG-105", naziv:"T10×16 zupčasti kaiš"},
    ]
  },
  {
    id:"elek", icon:"⚡", naziv:"Elektronika",
    tip:"kom",
    stavke:[
      {sifra:"PRG-108",  naziv:"24V LED (24W yatay led)"},
      {sifra:"PRG-116",  naziv:"Kabl 2×0,75mm²", tip:"metar"},
      {sifra:"MOTOR",    naziv:"Motor"},
      {sifra:"DALJ",     naziv:"Daljinski upravljač"},
      {sifra:"TRAFO-10", naziv:"Trafo 10A"},
      {sifra:"TRAFO-20", naziv:"Trafo 20A"},
      {sifra:"TRAFO-30", naziv:"Trafo 30A"},
      {sifra:"DIMER",    naziv:"Dimer"},
    ]
  },
  {
    id:"ost", icon:"🏭", naziv:"Cerada i ostalo",
    tip:"kom",
    stavke:[
      {sifra:"CER-ANT", naziv:"Cerada — Antracit",  tip:"metar2"},
      {sifra:"CER-KRE", naziv:"Cerada — Krem",      tip:"metar2"},
      {sifra:"CER-CRN", naziv:"Cerada — Crna",      tip:"metar2"},
      {sifra:"CER-MIS", naziv:"Cerada — Miš boja",  tip:"metar2"},
      {sifra:"LIM-125", naziv:"Trapezni lim 125×80"},
      {sifra:"VIJCI",   naziv:"Vijci + pakovanje (kompleti)"},
    ]
  },
];

/* ═══════════════════════════════════════════
   STANJE — čuva se u localStorage
═══════════════════════════════════════════ */
const OTPAD_PRAG = 2000; // mm — ispod ove dužine komad je otpad
const LS_KEY = 'ag_popis_v1';
let STATE = {};

function loadState(){
  try { STATE = JSON.parse(localStorage.getItem(LS_KEY)||'{}'); } catch(e){ STATE={}; }
}
function saveState(){
  localStorage.setItem(LS_KEY, JSON.stringify(STATE));
  document.getElementById('autoSaveTxt').textContent = 'Sačuvano ' + now();
}
function now(){
  return new Date().toLocaleTimeString('sr-RS',{hour:'2-digit',minute:'2-digit'});
}
function getItem(sifra){ return STATE[sifra] || null; }
function setItem(sifra, data){ STATE[sifra]=data; saveState(); updateProgress(); }

/* ═══════════════════════════════════════════
   BUILD UI
═══════════════════════════════════════════ */
function build(){
  const wrap = document.getElementById('mainWrap');
  wrap.innerHTML = '';
  SEKCIJE.forEach(sek => {
    const total = sek.stavke.length;
    const done  = sek.stavke.filter(s => hasDone(s.sifra)).length;
    const pct   = Math.round(done/total*100);

    const btn = document.createElement('div');
    btn.className = 'sek-btn';
    btn.id = 'btn_'+sek.id;
    btn.innerHTML = `
      <div class="sek-left">
        <span class="sek-icon">${sek.icon}</span>
        <div>
          <div class="sek-name">${sek.naziv}</div>
          <div class="sek-count">${done}/${total} uneto</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <span class="sek-badge ${done===total?'done':''}">${pct}%</span>
        <span class="sek-arrow">▼</span>
      </div>`;
    btn.onclick = () => toggleSek(sek.id);

    const body = document.createElement('div');
    body.className = 'sek-body';
    body.id = 'body_'+sek.id;
    body.innerHTML = sek.stavke.map(s => buildStavka(s, sek.tip)).join('');

    wrap.appendChild(btn);
    wrap.appendChild(body);
  });
}

function buildStavka(s, sekTip){
  const tip = s.tip || sekTip;
  const isDone = hasDone(s.sifra);
  const d = getItem(s.sifra) || {};

  if(tip === 'profil'){
    const komadi = d.komadi || [];
    const ukupno = komadi.reduce((a,k)=>a+(+k.duzina||0),0);
    return `<div class="stavka" id="stav_${s.sifra}">
      <div class="stavka-top">
        <div class="stavka-info">
          <div class="stavka-sifra">${s.sifra}</div>
          <div class="stavka-naziv">${s.naziv}</div>
          <div class="stavka-jed">metar · unos po komadima</div>
        </div>
        <div class="stavka-ok ${isDone?'done':''}" id="ok_${s.sifra}">${isDone?'✓':''}</div>
      </div>
      <div style="font-size:10px;color:var(--muted);margin-bottom:6px;">Komadi ispod ${OTPAD_PRAG/1000}m se ne unose — smatraju se otpadom</div>
      <div class="komadi-list" id="kl_${s.sifra}">
        ${komadi.map((k,i)=>buildKomadRow(s.sifra,i,k)).join('')}
      </div>
      <button class="btn-add-komad" onclick="addKomad('${s.sifra}')">＋ Dodaj komad</button>
      <div class="profil-sum" id="sum_${s.sifra}">${ukupno>0?'Ukupno: '+ukupno+' mm = '+(ukupno/1000).toFixed(2)+' m':''}</div>
    </div>`;
  }

  const jed = tip==='metar'?'m':tip==='metar2'?'m²':'kom';
  const val = d.kolicina ?? '';
  const min = d.minimum ?? '';
  const lok = d.lokacija ?? '';
  return `<div class="stavka" id="stav_${s.sifra}">
    <div class="stavka-top">
      <div class="stavka-info">
        <div class="stavka-sifra">${s.sifra}</div>
        <div class="stavka-naziv">${s.naziv}</div>
        <div class="stavka-jed">${jed}</div>
      </div>
      <div class="stavka-ok ${isDone?'done':''}" id="ok_${s.sifra}">${isDone?'✓':''}</div>
    </div>
    <div class="kom-row">
      <button class="kom-btn" style="border-radius:8px 0 0 8px" onclick="adj('${s.sifra}',-1)">−</button>
      <input class="kom-val" type="number" min="0" step="${tip==='kom'?1:0.5}" inputmode="decimal"
        value="${val}" id="inp_${s.sifra}"
        onchange="setKol('${s.sifra}',this.value)"
        oninput="setKol('${s.sifra}',this.value)">
      <button class="kom-btn" style="border-radius:0 8px 8px 0" onclick="adj('${s.sifra}',1)">＋</button>
    </div>
    <div class="kom-min-row">
      <span class="kom-min-lbl">Min. upozorenje:</span>
      <input class="kom-min-inp" type="number" min="0" inputmode="decimal"
        placeholder="npr. 10" value="${min}" id="min_${s.sifra}"
        onchange="setMin('${s.sifra}',this.value)">
    </div>
  </div>`;
}

function buildKomadRow(sifra, idx, k){
  const isOtpad = +k.duzina > 0 && +k.duzina < OTPAD_PRAG;
  return `<div class="komad-row" id="kr_${sifra}_${idx}">
    <input class="komad-len${isOtpad?' otpad':''}" type="number" inputmode="numeric" min="1"
      placeholder="Dužina (mm)" value="${k.duzina||''}"
      onchange="setKomadLen('${sifra}',${idx},this.value)"
      oninput="setKomadLen('${sifra}',${idx},this.value)">
    ${isOtpad?'<span class="otpad-tag">otpad</span>':''}
    <button class="komad-del" onclick="delKomad('${sifra}',${idx})">✕</button>
  </div>`;
}

/* ═══════════════════════════════════════════
   AKCIJE — profili (po komadima)
═══════════════════════════════════════════ */
function addKomad(sifra){
  const d = getItem(sifra) || {komadi:[]};
  if(!d.komadi) d.komadi=[];
  d.komadi.push({duzina:''});
  setItem(sifra, d);
  refreshStavka(sifra);
}
function delKomad(sifra, idx){
  const d = getItem(sifra)||{komadi:[]};
  d.komadi.splice(idx,1);
  setItem(sifra,d);
  refreshStavka(sifra);
}
function setKomadLen(sifra, idx, val){
  const d = getItem(sifra)||{komadi:[]};
  if(!d.komadi[idx]) return;
  d.komadi[idx].duzina = val;
  setItem(sifra,d);
  updateSum(sifra);
  updateOk(sifra);
}
function updateSum(sifra){
  const d = getItem(sifra)||{};
  const komadi = d.komadi||[];
  const uk = komadi.reduce((a,k)=>a+(+k.duzina||0),0);
  const el = document.getElementById('sum_'+sifra);
  if(el) el.textContent = uk>0?'Ukupno: '+uk+' mm = '+(uk/1000).toFixed(2)+' m':'';
}

/* ═══════════════════════════════════════════
   AKCIJE — kom / metar
═══════════════════════════════════════════ */
function adj(sifra, delta){
  const inp = document.getElementById('inp_'+sifra);
  const cur = parseFloat(inp.value)||0;
  const step = parseFloat(inp.step)||1;
  const nv = Math.max(0, Math.round((cur+delta*step)*100)/100);
  inp.value = nv;
  setKol(sifra, nv);
}
function setKol(sifra, val){
  const d = getItem(sifra)||{};
  d.kolicina = val===''||val===null?'':+val;
  setItem(sifra,d);
  updateOk(sifra);
}
function setMin(sifra, val){
  const d = getItem(sifra)||{};
  d.minimum = val===''?'':+val;
  setItem(sifra,d);
}

/* ═══════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════ */
function hasDone(sifra){
  const d = STATE[sifra];
  if(!d) return false;
  if(d.komadi) return d.komadi.length>0 && d.komadi.some(k=>+k.duzina>0);
  return d.kolicina!==undefined && d.kolicina!=='';
}
function updateOk(sifra){
  const el = document.getElementById('ok_'+sifra);
  if(!el) return;
  const done = hasDone(sifra);
  el.className = 'stavka-ok '+(done?'done':'');
  el.textContent = done?'✓':'';
  updateSekHeader(sifra);
  updateProgress();
}
function updateSekHeader(sifra){
  SEKCIJE.forEach(sek=>{
    if(!sek.stavke.find(s=>s.sifra===sifra)) return;
    const total = sek.stavke.length;
    const done  = sek.stavke.filter(s=>hasDone(s.sifra)).length;
    const pct   = Math.round(done/total*100);
    const btn   = document.getElementById('btn_'+sek.id);
    if(!btn) return;
    btn.querySelector('.sek-count').textContent = done+'/'+total+' uneto';
    const badge = btn.querySelector('.sek-badge');
    badge.textContent = pct+'%';
    badge.className = 'sek-badge '+(done===total?'done':'');
  });
}
function updateProgress(){
  let total=0, done=0;
  SEKCIJE.forEach(s=>{ s.stavke.forEach(st=>{ total++; if(hasDone(st.sifra)) done++; }); });
  document.getElementById('progFill').style.width = Math.round(done/total*100)+'%';
  document.getElementById('progTxt').textContent = done+' / '+total+' stavki ima unos';
}
function refreshStavka(sifra){
  let tip = 'profil', sekTip = 'profil';
  SEKCIJE.forEach(sek=>{ const s=sek.stavke.find(x=>x.sifra===sifra); if(s){sekTip=sek.tip;tip=s.tip||sek.tip;} });
  const el = document.getElementById('stav_'+sifra);
  if(el){
    const d = getItem(sifra)||{};
    const komadi = d.komadi||[];
    document.getElementById('kl_'+sifra).innerHTML = komadi.map((k,i)=>buildKomadRow(sifra,i,k)).join('');
    updateSum(sifra);
    updateOk(sifra);
  }
}
function toggleSek(id){
  const btn  = document.getElementById('btn_'+id);
  const body = document.getElementById('body_'+id);
  const open = body.classList.contains('open');
  btn.classList.toggle('open',!open);
  body.classList.toggle('open',!open);
}

/* ═══════════════════════════════════════════
   SAVE / EXPORT
═══════════════════════════════════════════ */
function manualSave(){
  saveState();
  showToast('✓ Sačuvano');
}
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}
function openExport(){
  const lines = [];
  lines.push('AG GROUP — Popis magacina');
  lines.push('Datum: '+new Date().toLocaleDateString('sr-RS'));
  lines.push('');
  SEKCIJE.forEach(sek=>{
    lines.push('=== '+sek.naziv.toUpperCase()+' ===');
    sek.stavke.forEach(s=>{
      const d = getItem(s.sifra);
      if(!d){ lines.push('  '+s.sifra+' | '+s.naziv+' | —'); return; }
      if(d.komadi){
        const uk = d.komadi.reduce((a,k)=>a+(+k.duzina||0),0);
        lines.push('  '+s.sifra+' | '+s.naziv+' | '+d.komadi.length+' komada | '+uk+' mm ukupno');
        d.komadi.forEach((k,i)=>{ lines.push('    Komad '+(i+1)+': '+(k.duzina||'?')+' mm'); });
      } else {
        lines.push('  '+s.sifra+' | '+s.naziv+' | '+d.kolicina+(d.minimum?'  (min: '+d.minimum+')':''));
      }
    });
    lines.push('');
  });
  document.getElementById('exportOut').textContent = lines.join('\n');
  document.getElementById('exportModal').classList.add('open');
}
function closeExport(){ document.getElementById('exportModal').classList.remove('open'); }
function copyExport(){
  const txt = document.getElementById('exportOut').textContent;
  navigator.clipboard.writeText(txt).then(()=>{ showToast('✓ Kopirano'); closeExport(); });
}

/* ═══════════════════════════════════════════
   INIT
═══════════════════════════════════════════ */
document.getElementById('hdDate').textContent = new Date().toLocaleDateString('sr-RS',{day:'2-digit',month:'2-digit',year:'numeric'});
loadState();
build();
updateProgress();
</script>
