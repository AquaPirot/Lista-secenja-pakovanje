<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#191814" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="AG Nalog" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="description" content="AG GROUP — Radni nalog za sečenje i obračun materijala pergole" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-152.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png" />
<title>AG GROUP — Radni nalog i obračun</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fjalla+One&family=Hanken+Grotesk:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500;600&display=swap');
  :root{
    --shell:#15171b; --shell2:#1e2127; --line:#33373f; --muted:#888;
    --paper:#f6f4ee; --paper2:#ebe7db; --ink:#191814;
    --bronze:#a9743c; --bronzeD:#8a5d2e; --ok:#3f7a4d; --warn:#bd4a2a;
  }
  *{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--shell);font-family:'Hanken Grotesk',sans-serif;}

  .topbar{background:var(--ink);padding:12px 16px;display:flex;align-items:center;
    justify-content:space-between;gap:10px;position:sticky;top:0;z-index:50;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:10px;}
  .logo{padding:3px 8px;border:2px solid var(--bronze);border-radius:4px;
    font-family:'Fjalla One',sans-serif;color:var(--bronze);font-size:16px;}
  .brand-t{font-family:'Fjalla One',sans-serif;font-size:16px;color:#fff;letter-spacing:.04em;line-height:1;}
  .brand-s{font-size:9.5px;color:var(--muted);letter-spacing:.08em;margin-top:2px;}
  .topbar-actions{display:flex;gap:6px;flex-wrap:wrap;}
  .btn{border:0;padding:10px 14px;border-radius:5px;font-family:'Fjalla One',sans-serif;
    font-size:13px;letter-spacing:.04em;cursor:pointer;white-space:nowrap;}
  .btn-primary{background:var(--bronze);color:#fff;}
  .btn-primary:active{background:var(--bronzeD);}
  .btn-secondary{background:#2a2d34;color:#fff;border:1px solid var(--line);}
  .btn-secondary.active{background:var(--bronze);border-color:var(--bronze);}

  .panel{max-width:820px;margin:14px auto 0;padding:0 14px;}
  .card-in{background:var(--shell2);border:1px solid var(--line);border-radius:10px;padding:14px;}
  .grp{font-family:'Fjalla One',sans-serif;font-size:13px;color:var(--bronze);letter-spacing:.07em;margin:14px 0 8px;}
  .grp:first-child{margin-top:0;}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  @media(min-width:560px){.row{grid-template-columns:1fr 1fr 1fr;}}
  label{display:block;}
  .lbl{font-weight:700;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:#d8d4c4;}
  .sub{font-size:9.5px;color:var(--muted);margin:1px 0 3px;}
  input,select{width:100%;margin-top:2px;padding:9px 10px;background:#101216;
    border:1px solid var(--line);border-radius:5px;color:#fff;
    font-family:'Hanken Grotesk',sans-serif;font-size:14px;}
  input[type=number]{font-family:'Spline Sans Mono',monospace;font-size:15px;}
  input::placeholder{color:#5c606b;}
  select option{background:#1e2127;}
  .auto-box,.steel-toggle{grid-column:1/-1;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    background:#101216;border:1px solid var(--line);border-radius:6px;padding:9px 11px;}
  .auto-box label,.steel-toggle label{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:12px;color:#e8e2d0;font-weight:500;}
  .auto-box input[type=checkbox],.steel-toggle input{width:auto;margin:0;}
  .auto-stat{margin-left:auto;font-family:'Spline Sans Mono',monospace;font-size:11.5px;}
  .hint{text-align:center;color:var(--muted);font-size:11px;margin:10px 0 4px;}
  .steel-rows{grid-column:1/-1;}
  .steel-r{display:grid;grid-template-columns:1.1fr 1fr 1fr auto;gap:8px;align-items:end;margin-top:8px;}
  .steel-r .lbl{font-size:10px;}
  .btn-mini{background:var(--shell2);border:1px solid var(--line);color:#fff;padding:9px 11px;border-radius:5px;cursor:pointer;font-size:13px;}
  .btn-add{background:transparent;border:1px dashed var(--bronze);color:var(--bronze);padding:8px 12px;border-radius:5px;cursor:pointer;font-size:12px;margin-top:8px;font-family:'Hanken Grotesk',sans-serif;font-weight:600;}

  /* DOCUMENT (radni nalog) */
  .doc{max-width:820px;margin:18px auto 50px;background:var(--paper);
    box-shadow:0 18px 45px rgba(0,0,0,.5);padding:22px 22px;color:var(--ink);}
  .doc-head{display:flex;justify-content:space-between;align-items:flex-start;
    border-bottom:3px solid var(--ink);padding-bottom:11px;gap:10px;}
  .doc-title{font-family:'Fjalla One',sans-serif;font-size:27px;letter-spacing:.02em;line-height:.95;}
  .doc-sub{font-family:'Fjalla One',sans-serif;font-size:12px;color:var(--bronze);letter-spacing:.16em;margin-top:3px;}
  .doc-meta{text-align:right;font-family:'Spline Sans Mono',monospace;font-size:10.5px;line-height:1.65;}
  .badge{background:var(--ink);color:#fff;padding:3px 7px;border-radius:3px;display:inline-block;font-weight:600;font-size:9.5px;}
  .badge.obracun{background:var(--bronze);}
  .info-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:11px;}
  @media(max-width:480px){.info-row{grid-template-columns:1fr;}}
  .card{background:var(--paper2);padding:9px 11px;border-radius:5px;}
  .card-t{font-family:'Fjalla One',sans-serif;font-size:10.5px;letter-spacing:.09em;color:var(--bronzeD);}
  .mono{font-family:'Spline Sans Mono',monospace;}
  .dims{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:11px;}
  .dim{background:var(--ink);color:#fff;padding:6px 7px;border-radius:4px;}
  .dim-k{font-size:8.5px;letter-spacing:.06em;color:#b9b3a0;}
  .dim-v{font-family:'Spline Sans Mono',monospace;font-weight:600;font-size:14px;}
  .calc-line{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;font-family:'Spline Sans Mono',monospace;font-size:11px;}

  .sec{margin-top:20px;}
  .sec-h{display:flex;align-items:baseline;gap:8px;border-bottom:2px solid var(--ink);padding-bottom:3px;margin-bottom:8px;}
  .sec-n{font-family:'Spline Sans Mono',monospace;font-weight:600;font-size:10.5px;background:var(--ink);color:#fff;padding:2px 6px;border-radius:3px;}
  .sec-n.acc{background:var(--bronze);}
  .sec-t{margin:0;font-family:'Fjalla One',sans-serif;font-size:16px;letter-spacing:.02em;text-transform:uppercase;}

  table{width:100%;border-collapse:collapse;}
  th{font-weight:700;font-size:10px;letter-spacing:.03em;text-transform:uppercase;color:#fff;background:var(--ink);padding:5px 7px;text-align:left;border-right:1px solid #43403a;}
  td{padding:5px 7px;border-bottom:1px solid var(--paper2);font-size:12px;vertical-align:middle;}
  td.m{font-family:'Spline Sans Mono',monospace;font-weight:500;}
  .grp-t{font-family:'Fjalla One',sans-serif;font-size:12px;color:var(--bronzeD);letter-spacing:.04em;margin:10px 0 1px;}
  .chk{width:14px;height:14px;border:1.5px solid #9a927c;border-radius:3px;display:inline-block;}
  .thumb{width:54px;height:32px;object-fit:contain;background:#fff;border:1px solid #d8d1bd;border-radius:3px;padding:1px;display:block;}

  .box-cut{border:2px solid var(--ink);border-radius:6px;padding:10px 12px;}
  .box-cut-t{font-family:'Fjalla One',sans-serif;font-size:11px;letter-spacing:.05em;}
  .box-cut-v{font-family:'Spline Sans Mono',monospace;font-weight:600;font-size:22px;color:var(--bronze);}
  .cerada-wrap{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(max-width:520px){.cerada-wrap{grid-template-columns:1fr;}}
  .note-ok{background:#e7efe6;border:1px solid var(--ok);border-radius:5px;padding:6px 9px;font-size:11px;margin-top:8px;}
  .note-warn{background:#f6e7df;border:1px solid var(--warn);border-radius:5px;padding:6px 9px;font-size:11px;margin-top:8px;}
  .mapa{border:1px solid var(--paper2);border-radius:6px;padding:9px 10px;background:#fff;}
  .mapa-edge{display:flex;justify-content:space-between;font-family:'Spline Sans Mono',monospace;font-size:9px;color:var(--muted);}
  .mapa-body{position:relative;border:1px solid var(--line);border-radius:3px;background:repeating-linear-gradient(180deg,#faf8f2,#faf8f2 8px,#f1ede1 8px,#f1ede1 9px);margin:3px 0;}
  .keder{position:absolute;left:0;right:0;}
  .keder-bar{border-radius:1px;}
  .keder-lbl{display:flex;justify-content:space-between;font-family:'Spline Sans Mono',monospace;font-size:8.5px;color:#4a4636;margin-top:1px;font-weight:500;}
  .rezerva{position:absolute;bottom:0;left:0;right:0;border-top:1px dashed var(--ink);background:repeating-linear-gradient(45deg,#e3ddcc,#e3ddcc 4px,#d8d1bd 4px,#d8d1bd 8px);}
  .rezerva span{font-family:'Spline Sans Mono',monospace;font-size:8px;color:#5a5446;padding:2px 4px;display:block;}
  .legend{display:flex;gap:10px;margin-top:6px;font-size:9px;flex-wrap:wrap;}
  .legend span{display:flex;align-items:center;gap:4px;}
  .swatch{width:13px;height:5px;display:inline-block;border-radius:1px;}

  ol.napomene{margin:0;padding-left:18px;font-size:11.5px;line-height:1.6;}
  .potpisi{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:22px;}
  .potpis{border-top:1px solid var(--ink);padding-top:5px;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#5a5446;}
  .potpis-l{margin-top:14px;font-weight:400;color:var(--muted);}
  .foot{margin-top:16px;border-top:1px solid var(--paper2);padding-top:6px;font-family:'Spline Sans Mono',monospace;font-size:9px;color:var(--muted);text-align:center;}
  .opt-off{background:var(--paper2);border-radius:5px;padding:8px 11px;font-size:11.5px;color:#5a5446;}

  /* OBRAČUN — sumarni red i total */
  .obr-sum{background:#191814;color:#fff;}
  .obr-sum td{border:0;font-weight:700;padding:7px 8px;font-size:13px;}
  .obr-total{background:var(--bronze);color:#fff;}
  .obr-total td{border:0;font-weight:700;padding:9px 10px;font-size:15px;}
  .obr-total td.amt{font-family:'Spline Sans Mono',monospace;font-size:18px;}
  .euro{font-family:'Spline Sans Mono',monospace;font-weight:600;}
  .obr-warning{background:#fbe9b6;border:1px solid #c2933a;color:#5e4413;padding:8px 12px;border-radius:5px;font-size:11.5px;margin:10px 0;}

  @media print{
    @page{margin:10mm;}
    html,body{background:#fff;}
    .no-print{display:none!important;}
    .doc{box-shadow:none!important;margin:0!important;max-width:100%!important;padding:0!important;}
    .sec{break-inside:avoid;}
    table{break-inside:auto;} tr{break-inside:avoid;}
    .splice-warn{background:#fff!important;border:2px solid #c07000!important;color:#000!important;}
    .splice-warn *{color:#000!important;background:transparent!important;}
  }
  .arch-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;}
  .arch-overlay.open{display:flex;align-items:flex-start;justify-content:flex-end;}
  .arch-panel{background:var(--shell2);border-left:1px solid var(--line);width:min(400px,100vw);height:100vh;overflow-y:auto;display:flex;flex-direction:column;}
  .arch-head{background:var(--ink);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;}
  .arch-head-t{font-family:'Fjalla One',sans-serif;color:var(--bronze);font-size:15px;letter-spacing:.05em;}
  .arch-close{background:none;border:none;color:#aaa;font-size:20px;cursor:pointer;padding:4px 8px;line-height:1;}
  .arch-close:hover{color:#fff;}
  .arch-empty{padding:40px 20px;color:var(--muted);text-align:center;font-size:13px;}
  .arch-item{padding:13px 16px;border-bottom:1px solid var(--line);}
  .arch-item-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:3px;}
  .arch-item-nr{font-family:'Fjalla One',sans-serif;color:#fff;font-size:13px;}
  .arch-item-date{font-size:10px;color:var(--muted);flex-shrink:0;}
  .arch-item-sub{font-size:11px;color:#a09880;margin-bottom:9px;}
  .arch-item-acts{display:flex;gap:6px;}
  .btn-xs{border:0;padding:5px 11px;border-radius:4px;font-family:'Fjalla One',sans-serif;font-size:11px;cursor:pointer;letter-spacing:.03em;}
  .btn-xs-load{background:var(--bronze);color:#fff;}
  .btn-xs-load:hover{background:var(--bronzeD);}
  .btn-xs-del{background:#2e1a1a;color:#e07070;border:1px solid #5a2020;}
  .btn-xs-del:hover{background:#3e2020;}

  /* ── MAGACIN TAB ── */
  .mag-wrap{max-width:820px;margin:14px auto;padding:0 14px;}
  .mag-sek{background:var(--shell2);border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden;}
  .mag-sek-h{background:var(--ink);padding:10px 14px;font-family:'Fjalla One',sans-serif;font-size:13px;color:var(--bronze);letter-spacing:.05em;}
  .mag-row{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .mag-row:last-child{border-bottom:none;}
  .mag-sifra{font-family:'Spline Sans Mono',monospace;font-size:10px;color:var(--muted);width:62px;flex-shrink:0;}
  .mag-naziv{flex:1;font-size:12px;font-weight:600;min-width:120px;color:#e8e4d8;}
  .mag-komadi{display:flex;flex-wrap:wrap;gap:4px;flex:2;}
  .mag-chip{background:#2a2d34;border:1px solid var(--line);border-radius:4px;padding:3px 7px;font-family:'Spline Sans Mono',monospace;font-size:11px;color:#e8e4d8;white-space:nowrap;}
  .mag-chip.warn{border-color:var(--warn);color:#e07a5f;}
  .mag-qty{font-family:'Spline Sans Mono',monospace;font-size:15px;font-weight:700;color:#fff;min-width:60px;text-align:right;}
  .mag-qty.low{color:var(--warn);}
  .mag-kor-btn{background:#1a2218;border:1px solid #3a5a30;border-radius:5px;color:#7dba8a;font-size:11px;padding:4px 9px;cursor:pointer;white-space:nowrap;flex-shrink:0;}
  .mag-kor-btn:hover{background:#2a3a28;}
  .mag-empty{padding:30px;text-align:center;color:var(--muted);font-size:13px;}
  .mag-summary{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .mag-stat{background:var(--shell2);border:1px solid var(--line);border-radius:8px;padding:10px 16px;flex:1;min-width:90px;text-align:center;}
  .mag-stat-val{font-family:'Fjalla One',sans-serif;font-size:18px;color:#fff;display:block;line-height:1.2;}
  .mag-stat-lbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:block;margin-top:2px;}
  .mag-thead .mag-sifra,.mag-thead .mag-naziv,.mag-thead .mag-kgm,.mag-thead .mag-stan,.mag-thead .mag-kg{
    font-family:'Fjalla One',sans-serif;font-size:9.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:400;}
  .mag-thead{padding:6px 14px;border-bottom:1px solid var(--line);}
  .mag-kgm{font-family:'Spline Sans Mono',monospace;font-size:11px;color:var(--muted);width:62px;text-align:right;flex-shrink:0;}
  .mag-stan{font-family:'Spline Sans Mono',monospace;font-size:13px;font-weight:700;color:#fff;min-width:130px;text-align:right;flex-shrink:0;}
  .mag-stan.low{color:var(--warn);}
  .mag-stan.zero{color:var(--muted);font-size:11px;font-weight:400;}
  .mag-kg{font-family:'Spline Sans Mono',monospace;font-size:11px;color:#a0a88e;min-width:58px;text-align:right;flex-shrink:0;}

  /* ── LISTA SEČENJA ZA RADNIKE ── */
  .cut-list{background:#0d1a0e;border:2px solid #3a5a30;border-radius:8px;padding:12px 14px;margin-bottom:14px;}
  .cut-list-h{font-family:'Fjalla One',sans-serif;color:#7dba8a;font-size:13px;letter-spacing:.08em;margin-bottom:10px;}
  .cut-row{display:flex;align-items:center;gap:0;margin-bottom:5px;border-radius:5px;overflow:hidden;}
  .cut-sifra{background:#1a2e1a;color:#7dba8a;font-family:'Spline Sans Mono',monospace;font-size:11px;padding:7px 10px;width:62px;flex-shrink:0;font-weight:600;}
  .cut-naziv{background:#1e2820;color:#c8d8c0;font-size:11px;padding:7px 10px;flex:1;}
  .cut-dim{background:#2a3e2a;color:#fff;font-family:'Spline Sans Mono',monospace;font-size:16px;font-weight:700;padding:7px 14px;min-width:110px;text-align:right;}
  .cut-kom{background:#3a5a30;color:#fff;font-family:'Fjalla One',sans-serif;font-size:16px;padding:7px 12px;min-width:44px;text-align:center;}
  .cut-chk{background:#1e2820;color:var(--muted);font-size:18px;padding:7px 10px;width:36px;text-align:center;}
</style>
</head>
<body>

<div class="topbar no-print">
  <div class="brand">
    <div class="logo">AG</div>
    <div>
      <div class="brand-t">AG GROUP · RADNI NALOG</div>
      <div class="brand-s">PROGRAM ZA SEČENJE PERGOLE + OBRAČUN</div>
    </div>
  </div>
  <div class="topbar-actions">
    <button class="btn btn-secondary active" id="btnNalog" onclick="switchView('nalog')">Nalog</button>
    <button class="btn btn-secondary" id="btnObracun" onclick="switchView('obracun')">Obračun</button>
    <button class="btn btn-secondary" id="btnMagacin" onclick="switchView('magacin')">📦 Magacin</button>
    <button class="btn btn-secondary" id="btnIstorija" onclick="switchView('istorija')">📋 Istorija</button>
    <button class="btn btn-secondary" id="btnSacuvaj" onclick="saveOrder()">💾 Sačuvaj</button>
    <button class="btn btn-secondary" id="btnProizvodnja" onclick="pustiUProizvodnju()">🏭 Proizvodnja</button>
    <button class="btn btn-secondary" onclick="openArchive()">📁 Arhiva</button>
    <button class="btn btn-primary" onclick="window.print()">⎙ PDF</button>
  </div>
</div>

<div class="panel no-print" id="inputPanel">
  <div class="card-in">
    <div class="grp">① TERENSKE MERE (mm)</div>
    <div class="row">
      <label><div class="lbl">Širina</div><div class="sub">izmera na objektu</div>
        <input type="number" id="sirina" value="3500"></label>
      <label><div class="lbl">Dubina / projekcija</div><div class="sub">zid do spoljne mere stuba</div>
        <input type="number" id="dubina" value="3500"></label>
      <label><div class="lbl">Zadnja visina</div><div class="sub">pod do cevi na zidu</div>
        <input type="number" id="zadnjaVisina" value="2650"></label>
      <label><div class="lbl">Prednja visina</div><div class="sub">pod do oluka</div>
        <input type="number" id="prednjaVisina" value="2150"></label>
    </div>
    <div class="row" id="parapetSection" style="margin-top:8px">
      <div class="auto-box" style="grid-column:1/-1">
        <label><input type="checkbox" id="parapetOn">
          Ima zidić / parapet ispod stuba</label>
      </div>
      <div id="parapetInputWrap" style="display:none">
        <label><div class="lbl">Visina zidića</div><div class="sub">oduzima se od prednje visine → dužina sečenja stuba</div>
          <input type="number" id="parapetVisina" placeholder="npr. 500"></label>
      </div>
    </div>

    <div class="grp">② IZBOR PROFILA</div>
    <div class="row">
      <label><div class="lbl">Cev na zidu</div><div class="sub">nosač pergole</div>
        <select id="cev"><option value="nema">Nema cevi</option><option value="80x40" selected>80×40</option><option value="100x100">100×100</option></select></label>
      <label><div class="lbl">Stub</div>
        <select id="stub"><option selected>110x144</option><option>100x100</option></select></label>
      <label><div class="lbl">Širina raja</div><div class="sub">90×150 ili 110×150</div>
        <select id="sirinaRaja"><option value="75">75</option><option selected>90</option><option>110</option></select></label>
      <label><div class="lbl">Keder</div>
        <select id="kederTip">
          <option value="jednostrani">Jednostrani</option>
          <option value="obostrani" selected>Obostrani</option>
        </select></label>
      <label><div class="lbl">Korniš sklop</div>
        <select id="kornisSklop">
          <option value="jednodelni" selected>Jednodelni</option>
          <option value="seceni">Sečeni</option>
        </select></label>
      <label><div class="lbl">Cev motora</div>
        <select id="cevMotora"><option selected>jednodelna</option><option>po poljima</option></select></label>

/* ───────── helperi ───────── */
const $ = id => document.getElementById(id);
const round = (n,d=0)=>{const p=10**d;return isFinite(n)?Math.round(n*p)/p:0;};
const ceil = n => isFinite(n)?Math.ceil(n):0;
const esc = s => String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const eur = n => round(n,2).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,",") + " €";

function suggestIntervala(korisna){
  if(!korisna||korisna<=0)return 1;
  let best=1,bestScore=Infinity;
  for(let n=1;n<=40;n++){
    const r=korisna/n; let score;
    if(r>=399&&r<=499) score=Math.abs(r-449);
    else if(r>499) score=1e5+(r-499);
    else score=1e5+(399-r)*2;
    if(score<bestScore){bestScore=score;best=n;}
  }
  return best;
}

/* ───────── JEZGRO PRORAČUNA ───────── */
function compute(I){
  const D=+I.sirina||0, B=+I.dubina||0, A=+I.zadnjaVisina||0, Cc=+I.prednjaVisina||0;
  const cev=I.cev, sirinaRaja=+I.sirinaRaja||90;
  const cevHoriz = cev==="100x100"?100:cev==="80x40"?40:0;

  const brStubova = D<=3900?2:D<=7800?3:D<=10000?4:0;
  const brRaja=brStubova, brPolja=Math.max(0,brRaja-1);
  const sirinaPolja = brPolja?round((D-brRaja*sirinaRaja)/brPolja,0):0;
  const preko10m = D>10000;

  const kat1=A-Cc+150, kat2=B-cevHoriz;
  const pad = kat2?round((kat1/kat2)*100,1):0;
  const padOk = pad>=8&&pad<=10;
  const dijagonala = round(Math.sqrt(kat1*kat1+kat2*kat2),0);
  const duzRaja = dijagonala-200;

  const sirinaCerade=D, duzCerade=dijagonala+400;
  const korisnaZaKornize = dijagonala-100-70;
  const predlogIntervala = suggestIntervala(korisnaZaKornize);
  const brIntervala = I.autoInterval?predlogIntervala:Math.max(1,+I.brIntervala||1);
  const razmakKornisa = brIntervala?round(korisnaZaKornize/brIntervala,0):0;
  const razmakOk = razmakKornisa>=399&&razmakKornisa<=499;
  const kornisaUkupno = brIntervala+1;
  const debeli=2, tanki=Math.max(0,kornisaUkupno-2);
  const tankiSvetlo=ceil(tanki/2), tankiBez=tanki-tankiSvetlo;

  const kvObostrani = (I.kederTip || 'obostrani') === 'obostrani';
  const kvSeceni    = (I.kornisSklop || 'jednodelni') === 'seceni';
  const keder      = kvObostrani ? 'dvostrani' : 'jednostrani';
  const kornisTip  = kvSeceni    ? 'sečeni'    : 'jednodelni';
  const tipSklopa  = (kvObostrani ? 'Obostrani' : 'Jednostrani') + ', ' + (kvSeceni ? 'sečeni' : 'jednodelni');
  // Dužina jednog komada korniša
  const duzKornisa = kvSeceni
    ? (kvObostrani ? round((sirinaCerade-150)/2,0) : round((sirinaCerade-50)/2,0))
    : (sirinaCerade - 100);
  const kornisKomPoPoz = kvSeceni ? 2 : 1;

  const duzOluka=D+150;
  const limKom=ceil(D/1250);
  const cevMotoraTip=I.cevMotora;
  const duzCevMotora = cevMotoraTip==="jednodelna"
    ? D + 100
    : Math.ceil((D + 50) / brPolja);
  const brCevMotora=cevMotoraTip==="jednodelna"?1:brPolja;
  const brPanela=brPolja;
  const duzPanela=sirinaPolja+100;
  const parapetVis = I.parapetOn ? (Math.max(0,+I.parapetVisina||0)) : 0;
  const duzStuba = Math.max(0, Cc - parapetVis);

  const svetalaPoKornizu=+I.svetalaPoKornizu||0;
  // Cerada spajanje — NIJEDNA rolna ne sme biti preko 3000mm
  // Pozicije kedera se mere od PREDNJE ivice (oluk = 0mm).
  // Sastav uvek pada na keder; idemo redom: od početka tekuće rolne
  // tražimo poslednji keder unutar 3000mm i tu sečemo. Ponavljamo do kraja.
  const kederPos = i => i===1 ? 100
    : i===kornisaUkupno ? duzCerade-470
    : Math.round(100 + (i-1)*korisnaZaKornize/(kornisaUkupno-1));
  const spliceNeeded = duzCerade > 3000;
  let spliceList = [];   // [{kornis, pos}] — mesta sastava
  let spliceRolne = [];  // dužine rolni redom od fronta
  let spliceOk = true;
  if(spliceNeeded){
    let start = 0;
    while(duzCerade - start > 3000){
      let found = null;
      for(let i=kornisaUkupno; i>=1; i--){
        const p = kederPos(i);
        if(p > start && p <= start + 3000){ found = {kornis:i, pos:p}; break; }
      }
      if(!found){ spliceOk = false; break; }
      spliceList.push(found);
      start = found.pos;
    }
    if(spliceOk){
      let prev = 0;
      spliceList.forEach(s=>{ spliceRolne.push(s.pos - prev); prev = s.pos; });
      spliceRolne.push(duzCerade - prev);
    }
  }

  // LED — ravnomerna raspodela po dužini korniša:
  // korniš se deli na n jednakih segmenata, svetlo u CENTRU svakog segmenta.
  // → razmak između svetala = L/n, od ivice do prvog = L/(2n) (pola razmaka).
  // Pozicije se računaju direktno iz formule (bez sabiranja zaokruženih
  // vrednosti) pa nema nagomilavanja greške.
  const nLed = svetalaPoKornizu;
  const ledPozicije = [];
  for(let k=1; k<=nLed; k++) ledPozicije.push(Math.round(duzKornisa*(2*k-1)/(2*nLed)));
  const razmakRupa  = nLed ? Math.round(duzKornisa/nLed) : 0;
  const odIviceDoRupe = nLed ? ledPozicije[0] : 0;
  const svetalaUkupno=svetalaPoKornizu*tankiSvetlo;

  // Rupe za kolica na kornišu — SAMO jednostrani keder
  // (kod dvostranog rupe postoje u umetcima, korniš se ne buši)
  // Po jedna rupa za svaki raj: 45mm od obe ivice, ostale ravnomerno između.
  let kolicaRupe = [];
  if(keder==="jednostrani" && brRaja>=2){
    const m = 45;
    if(brRaja===2) kolicaRupe = [m, duzKornisa-m];
    else {
      kolicaRupe = [m];
      for(let k=1; k<brRaja-1; k++)
        kolicaRupe.push(Math.round(m + k*(duzKornisa-2*m)/(brRaja-1)));
      kolicaRupe.push(duzKornisa-m);
    }
  }

  const potrosnja=round(svetalaUkupno*0.34,2);
  const trafo = potrosnja<=10?"10A":potrosnja<=20?"20A":potrosnja<=30?"30A":"⚠ preko 30A";
  const trafoCena = potrosnja<=10?15:potrosnja<=20?22:30;

  return {
    in:{A,B,C:Cc,D,cev,sirinaRaja,parapetVis},
    auto:{brStubova,brRaja,brPolja,sirinaPolja,preko10m},
    raj:{kat1,kat2,pad,padOk,dijagonala,duzRaja},
    cerada:{sirinaCerade,duzCerade,korisnaZaKornize,brIntervala,predlogIntervala,
      razmakKornisa,razmakOk,kornisaUkupno,debeli,tanki,tankiSvetlo,tankiBez},
    kornis:{tipSklopa,duzKornisa,kornisTip,keder,kvObostrani,kvSeceni,kornisKomPoPoz},
    splice:{spliceNeeded,spliceList,spliceRolne,spliceOk},
    profili2:{duzOluka,limKom,cevMotoraTip,duzCevMotora,brCevMotora,brPanela,duzPanela,duzStuba},
    led:{svetalaPoKornizu,razmakRupa,odIviceDoRupe,ledPozicije,svetalaUkupno,potrosnja,trafo,trafoCena},
    kolica:{rupe:kolicaRupe},
  };
}

function ceradaMap(R){
  const n=R.cerada.kornisaUkupno, out=[];
  const K=R.cerada.korisnaZaKornize;
  for(let i=1;i<=n;i++){
    const debeli=i===1||i===n;
    const pos = i===1 ? 100
              : i===n ? R.cerada.duzCerade-470
              : Math.round(100 + (i-1)*K/(n-1));
    const tip=debeli?"debeli":(i-1)%2===1?"svetlo":"tanki";
    out.push({i,pos,tip});
  }
  return out;
}

/* ───────── OKOV — primena pravila ───────── */
function applyOkov(R, I){
  const c = {
    raja:R.auto.brRaja, stubova:R.auto.brStubova, polja:R.auto.brPolja,
    kornisaUkupno:R.cerada.kornisaUkupno, debeli:R.cerada.debeli, tanki:R.cerada.tanki,
    tankiSvetlo:R.cerada.tankiSvetlo, svetla:R.led.svetalaUkupno, cevMotora:R.profili2.brCevMotora,
    duzRaja:R.raj.duzRaja, duzOluka:R.profili2.duzOluka, duzKornisa:R.kornis.duzKornisa,
    sirina:R.in.D,
    kornisSeceni: R.kornis.kornisTip === "sečeni",
    keder: R.kornis.keder,
    kederJednostrani: R.kornis.keder === "jednostrani",
    korisnaCerade: R.cerada.brIntervala * R.cerada.razmakKornisa, // od 1. do zadnjeg kedera (mm)
  };
  const baze = {raj:c.raja, stub:c.stubova, kornis:c.kornisaUkupno, svetlo:c.svetla, fiksno:1};
  const txt  = {raj:"× broj raja ("+c.raja+")", stub:"× broj stubova ("+c.stubova+")",
                kornis:"× ukupno korniša ("+c.kornisaUkupno+")", svetlo:"× LED svetala ("+c.svetla+")", fiksno:"fiksno"};

  return KATALOG.map(it => {
    let kol, pravilo;
    if(it.fn) { kol = it.fn(c); pravilo = it.opis; }
    else { kol = (baze[it.pravilo] ?? 0) * (it.m ?? 1); pravilo = (it.m && it.m !== 1 ? it.m + " " : "") + txt[it.pravilo]; }
    kol = round(kol, it.jed === "m" ? 1 : 0);
    return Object.assign({}, it, { kol, pravilo, ukupno: round(kol * it.cena, 2) });
  });
}

/* ───────── ALUMINIJUM — težina + cena ───────── */
function aluCalc(I, R){
  // 1. Šina
  const rajKljuc = +I.sirinaRaja === 110 ? "raj110" : +I.sirinaRaja === 75 ? "raj75" : "raj90";
  const rajProf  = PROFILI[rajKljuc];
  // Profili korniša — zavise od kedera (jednostrani vs dvostrani)
  const isDvo       = R.kornis.kvObostrani;
  const kProfDebeli = isDvo ? PROFILI.kornisD416 : PROFILI.kornisDebeli; // 10416 ili 10472
  const kProfTanki  = isDvo ? PROFILI.kornisD418 : PROFILI.kornisTanki;  // 10418 ili 10471
  const kPoPoz = R.kornis.kornisKomPoPoz; // 1 ili 2 (sečeni)
  // 2. Stub
  const stubKljuc = I.stub === "110x144" ? "stub110" : "stub100";
  const stubProf  = PROFILI[stubKljuc];

  const items = [
    {key:"raj",      prof:rajProf,                naziv:"Šina (raj) "+I.sirinaRaja+"×150", mera:R.raj.duzRaja,        kom:R.auto.brRaja,   nap:"★ Dijagonala − 200mm"},
    {key:"oluk",     prof:PROFILI.oluk,           naziv:"Oluk",                            mera:R.profili2.duzOluka,  kom:1,               nap:"Širina + 150mm"},
    {key:"stub",     prof:stubProf,               naziv:"Stub ("+I.stub+")",              mera:R.profili2.duzStuba,  kom:R.auto.brStubova,nap: R.in.parapetVis>0 ? "Prednja "+R.in.C+" − zidić "+R.in.parapetVis+" = "+R.profili2.duzStuba+" mm" : "→ Prednja visina"},
    {key:"cevm",     prof:PROFILI.cevMotora,      naziv:"Cev motora",                      mera:R.profili2.duzCevMotora, kom:R.profili2.brCevMotora, nap: R.profili2.cevMotoraTip==="jednodelna" ? "Jednodelna · širina pergole + 100mm" : `Po poljima · ${R.profili2.brCevMotora} cevi (zbir = širina pergole + 50mm)`},
    {key:"panel",    prof:PROFILI.panel,          naziv:"Panel (između rajeva)",           mera:R.profili2.duzPanela, kom:R.profili2.brPanela, nap:"→ Širina polja + 100"},
    {key:"kdeb",     prof:kProfDebeli,             naziv:"★ Korniš DEBELI (ivični)",        mera:R.kornis.duzKornisa,  kom:R.cerada.debeli*kPoPoz, nap:"Uz zid + uz oluk, BEZ rupa"+(kPoPoz>1?" · sečeni ("+kPoPoz+" kom/poz)":"")},
    {key:"ksv",      prof:kProf,                  naziv:"★ Korniš sa svetlom",             mera:R.kornis.duzKornisa,  kom:R.cerada.tankiSvetlo*kPoPoz, nap:"★ Izbušene rupe za LED"+(kPoPoz>1?" · sečeni":"")},
    {key:"kbez",     prof:kProf,                  naziv:"★ Korniš bez svetla",             mera:R.kornis.duzKornisa,  kom:R.cerada.tankiBez*kPoPoz, nap:"Bez rupa"+(kPoPoz>1?" · sečeni":"")},
  ];
  let totalKg = 0, totalEur = 0;
  items.forEach(it => {
    it.metaraUk = round((it.mera/1000) * it.kom, 2);
    it.kg = round(it.metaraUk * it.prof.kgm, 2);
    it.cena = round(it.kg * ALU_PRICE_PER_KG, 2);
    totalKg += it.kg; totalEur += it.cena;
  });
  return { items, totalKg: round(totalKg,2), totalEur: round(totalEur,2) };
}

/* ───────── OBRAČUN — ukupno ───────── */
function obracunCalc(I, R, alu, okov){
  const m2cerade = round(R.cerada.sirinaCerade * R.cerada.duzCerade / 1e6, 2);
  const ceradaCena = round(m2cerade * CERADA_PER_M2, 2);

  // Razdvojimo okov po grupama za prikaz
  const sumByGroup = (g) => round(okov.filter(x=>x.grupa===g).reduce((s,x)=>s+x.ukupno,0), 2);
  const plastikaEur = sumByGroup("plastika");
  const metalEur    = sumByGroup("metal");
  const fitiljEur   = sumByGroup("fitilj");
  const ledEur      = sumByGroup("led");

  // Cev na zidu — dužina = širina pergole, cena kao čelična cev (1100 RSD/m)
  const cevNaZiduM   = I.cev==="nema" ? 0 : round(R.in.D / 1000, 2);
  const cevNaZiduEur = round(cevNaZiduM * CELIK_CEV_PER_M_EUR, 2);

  // Trapezni lim 125×80 — broj komada × 1 m² po komadu (1,25 × 0,80 = 1 m²)
  const trapezniLimKom = R.profili2.limKom;
  const trapezniLimM2  = round(trapezniLimKom * 1.25 * 0.80, 2);
  const trapezniLimEur = round(trapezniLimM2 * TRAPEZ_LIM_PER_M2_EUR, 2);

  const elek = {
    motor: MOTOR_PRICE,
    daljinski: DALJINSKI_PRICE,
    dimer: DIMER_PRICE,
    trafo: R.led.trafoCena,
    led: ledEur, // već iz katalog (LED + kabl)
  };
  const elekTotal = round(elek.motor + elek.daljinski + elek.dimer + elek.trafo + elek.led, 2);

  // Čelična konstrukcija — uračunava se samo ako je uključena u uvodu
  let celicnaM = 0, celicnaEur = 0;
  if (I.celicnaOn) {
    const valid = steelRows.filter(r => (+r.kom>0) && (+r.duzina>0));
    valid.forEach(r => { celicnaM += (+r.kom * +r.duzina) / 1000; });
    celicnaM   = round(celicnaM, 2);
    celicnaEur = round(celicnaM * CELIK_CEV_PER_M_EUR, 2);
  }

  const subtotal = round(
    alu.totalEur + ceradaCena + plastikaEur + metalEur + fitiljEur +
    cevNaZiduEur + trapezniLimEur + elekTotal + SRAFOVI_PAUSAL + celicnaEur,
  2);

  return {
    alu: alu.totalEur, aluKg: alu.totalKg,
    cerada: ceradaCena, m2cerade,
    plastika: plastikaEur, metal: metalEur, fitilj: fitiljEur,
    cevNaZiduM, cevNaZiduEur,
    trapezniLimKom, trapezniLimM2, trapezniLimEur,
    elek, elekTotal,
    srafovi: SRAFOVI_PAUSAL,
    celicnaM, celicnaEur,
    subtotal,
  };
}

/* ───────── ČELIČNA KONSTRUKCIJA UI ───────── */
let steelRows=[{profil:"100x100",kom:"",duzina:""}];
function renderSteelInputs(){
  const wrap=$("steelRows"), on=$("celicnaOn").checked;
  wrap.innerHTML="";
  wrap.style.display = on ? "block" : "none";
  $("addSteel").style.display = on ? "inline-block" : "none";
  if(!on) return;
  steelRows.forEach((r,i)=>{
    const div=document.createElement("div");
    div.className="steel-r";
    div.innerHTML=`
      <label><div class="lbl">Profil cevi</div>
        <select data-i="${i}" data-k="profil">
          <option${r.profil==="100x100"?" selected":""}>100x100</option>
          <option${r.profil==="80x40"?" selected":""}>80x40</option>
          <option${r.profil==="120x80"?" selected":""}>120x80</option>
        </select></label>
      <label><div class="lbl">Komada</div>
        <input type="number" data-i="${i}" data-k="kom" value="${esc(r.kom)}" placeholder="0"></label>
      <label><div class="lbl">Dužina (mm)</div>
        <input type="number" data-i="${i}" data-k="duzina" value="${esc(r.duzina)}" placeholder="0"></label>
      <button class="btn-mini" type="button" data-del="${i}">✕</button>`;
    wrap.appendChild(div);
  });
  wrap.querySelectorAll("select,input").forEach(el=>{
    el.addEventListener("input",e=>{
      const i=+e.target.dataset.i,k=e.target.dataset.k;
      steelRows[i][k]=e.target.value; render();
    });
  });
  wrap.querySelectorAll("[data-del]").forEach(b=>{
    b.addEventListener("click",e=>{
      const i=+e.target.dataset.del;
      steelRows.splice(i,1);
      if(steelRows.length===0) steelRows.push({profil:"100x100",kom:"",duzina:""});
      renderSteelInputs(); render();
    });
  });
}

function imgTag(key, alt){

  return `<img class="thumb" src="${IMG[key]}" alt="${esc(alt||'')}">`;
}
// Vizuelna lenta rupa: dužina L (mm), pozicije (mm od leve ivice), boja markera
function rupeBar(L, pozicije, boja){
  const barW = 540; // px, fiksno — skalira se na L
  let dots = '';
  pozicije.forEach(p=>{
    const px = Math.round(p/L*barW);
    dots += `<div style="position:absolute;left:${px}px;top:0;transform:translateX(-50%);text-align:center">
      <div style="width:9px;height:9px;border-radius:50%;background:${boja};border:2px solid #fff;box-shadow:0 0 0 1px ${boja};margin:6px auto 2px"></div>
      <div style="font-size:8px;color:#4a4636;font-family:'Spline Sans Mono',monospace;white-space:nowrap">${p}</div>
    </div>`;
  });
  return `<div style="position:relative;height:40px;max-width:${barW}px;background:#eee8da;border:1px solid #c9b896;border-radius:3px;margin:10px 0 4px">
    ${dots}
    <div style="position:absolute;left:2px;bottom:1px;font-size:7.5px;color:#999;font-family:'Spline Sans Mono',monospace">0</div>
    <div style="position:absolute;right:2px;bottom:1px;font-size:7.5px;color:#999;font-family:'Spline Sans Mono',monospace">${L}</div>
  </div>`;
}
// Ćelija profila: sifra iznad slike (ili placeholder ako nema slike)
function profCell(prof){
  const sifra = prof ? `<div style="font-size:9px;font-family:'Spline Sans Mono',monospace;color:#888;margin-bottom:2px">${esc(prof.sifra||'')}</div>` : '';
  const img   = (prof && prof.img) ? imgTag(prof.img, prof.nazivSr) : `<div style="width:48px;height:36px;background:#2a2d34;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:9px;color:#666">?</div>`;
  return sifra + img;
}

function render(){
  const I={
    sirina:$("sirina").value,dubina:$("dubina").value,zadnjaVisina:$("zadnjaVisina").value,
    prednjaVisina:$("prednjaVisina").value,cev:$("cev").value,stub:$("stub").value,
    kederTip:$("kederTip").value,kornisSklop:$("kornisSklop").value,sirinaRaja:$("sirinaRaja").value,
    cevMotora:$("cevMotora").value,bojaRal:$("bojaRal").value,bojaCerade:$("bojaCerade").value,
    autoInterval:$("autoInterval").checked,brIntervala:$("brIntervala").value,
    svetalaPoKornizu:$("svetalaPoKornizu").value,motor:$("motor").value,
    celicnaOn:$("celicnaOn").checked,
    parapetOn:$("parapetOn").checked,parapetVisina:$("parapetVisina").value,
    brNaloga:$("brNaloga").value,kupac:$("kupac").value,adresa:$("adresa").value,
    datum:$("datum").value,rok:$("rok").value,radnik:$("radnik").value,
  };
  const R=compute(I);
  const alu = aluCalc(I, R);
  const okov = applyOkov(R, I);
  const obr = obracunCalc(I, R, alu, okov);

  const autoOn=$("autoInterval").checked;
  $("brIntervala").disabled=autoOn;
  if(autoOn) $("brIntervala").value=R.cerada.predlogIntervala;
  $("intervalSub").textContent = autoOn ? ("auto-predlog: "+R.cerada.predlogIntervala) : "ručni unos";

  // Sečeni korniš dostupan samo kad ima ≥ 3 raja
  const mozeSeceni = R.auto.brRaja >= 3;
  const selSklop = $("kornisSklop");
  const secOpt = Array.from(selSklop.options).find(o=>o.value==='seceni');
  if(secOpt){
    secOpt.disabled = !mozeSeceni;
    secOpt.text = mozeSeceni ? 'Sečeni' : 'Sečeni ⛔ (min. 3 raja)';
  }
  if(!mozeSeceni && selSklop.value==='seceni') selSklop.value='jednodelni';
  const as=$("autoStat");
  as.textContent = R.cerada.brIntervala+" intervala → razmak "+R.cerada.razmakKornisa+"mm "+(R.cerada.razmakOk?"✓":"⚠");
  as.style.color = R.cerada.razmakOk ? "#5fa86f" : "#d8754a";

  if(currentView === 'nalog') renderNalog(I, R, alu, okov);
  else renderObracun(I, R, alu, okov, obr);
}
</script>
<script>
/* ───────── RENDER NALOG ───────── */
function renderNalog(I, R, alu, okov){
  const cMap = ceradaMap(R);
  const autoOn = +I.autoInterval || $("autoInterval").checked;
  const bojaTxt = I.bojaRal ? ("RAL " + I.bojaRal) : "(po izboru)";

  let html = "";
  html += `<div class="doc-head">
    <div><div class="doc-title">RADNI NALOG</div>
      <div class="doc-sub">AG GROUP · LISTA ZA SEČENJE + MATERIJAL</div></div>
    <div class="doc-meta"><div class="badge">NALOG ZA PROIZVODNJU</div>
      <div style="margin-top:4px">Br. naloga: <b>${esc(I.brNaloga)||"______"}</b></div>
      <div>Datum: <b>${esc(I.datum)||"—"}</b> · Rok: <b>${esc(I.rok)||"—"}</b></div>
    </div></div>`;

  html += `<div class="info-row">
    <div class="card"><div class="card-t">KUPAC</div>
      <div style="font-size:14px;margin-top:3px"><b>${esc(I.kupac)||"—"}</b></div>
      <div style="font-size:12px;color:#5a5446">${esc(I.adresa)||"—"}</div>
      <div style="font-size:12px;margin-top:5px">Radnik: <b>${esc(I.radnik)||"________________"}</b></div></div>
    <div class="card"><div class="card-t">KONFIGURACIJA</div>
      <div class="mono" style="font-size:11px;margin-top:3px;line-height:1.65">
        Cev: <b>${esc(I.cev)}</b> · Stub: <b>${esc(I.stub)}</b> · Šina: <b>${esc(I.sirinaRaja)}×150 mm</b><br>
        Korniš: <b>${esc(R.kornis.tipSklopa)}</b><br>
        <b>Boja (sve): ${esc(bojaTxt)}</b> · Cerada: <b>${esc(I.bojaCerade)}</b><br>
        Sklop korniša: <b>${esc(R.kornis.tipSklopa)}</b></div></div></div>`;

  const dims=[["D · Širina",R.in.D],["B · Dubina",R.in.B],["A · Zadnja",R.in.A],["C · Prednja",R.in.C]];
  if(R.in.parapetVis>0) dims.push(["↕ Zidić",R.in.parapetVis]);
  html+=`<div class="dims">`+dims.map(d=>`<div class="dim"><div class="dim-k">${d[0]}</div><div class="dim-v">${d[1]} mm</div></div>`).join("")+`</div>`;
  html+=`<div class="calc-line">
    <span>Stubova: <b>${R.auto.brStubova}</b></span>
    <span>Raja: <b>${R.auto.brRaja}</b></span>
    <span>Polja: <b>${R.auto.brPolja}</b> (${R.auto.sirinaPolja} mm)</span>
    <span>Dijagonala: <b>${R.raj.dijagonala} mm</b></span>
    <span style="color:${R.raj.padOk?'#3f7a4d':'#bd4a2a'};font-weight:700">Pad: ${R.raj.pad}% ${R.raj.padOk?'✓':'⚠ van 8–10%'}</span>
    ${R.in.parapetVis>0?`<span style="color:#a9743c;font-weight:700">Stub seče na: ${R.profili2.duzStuba} mm (${R.in.C} − ${R.in.parapetVis})</span>`:''}
    ${R.auto.preko10m?'<span style="color:#bd4a2a;font-weight:700">⚠ ŠIRINA PREKO 10m</span>':''}
  </div>`;

  /* 01 — ALUMINIJUM sa slikama profila */
  html += `<div class="sec"><div class="sec-h"><span class="sec-n acc">01</span>
    <h3 class="sec-t">Aluminijum — za sečenje</h3></div>
    <table><thead><tr>
      <th style="width:64px">Profil</th>
      <th>Naziv</th>
      <th style="width:110px;text-align:right">Mera</th>
      <th style="width:42px;text-align:center">Kom</th>
      <th style="width:32px;text-align:center">✓</th>
    </tr></thead><tbody>`;
  alu.items.forEach((p,i)=>{
    html += `<tr style="background:${i%2?'#ebe7db':'transparent'}">
      <td style="vertical-align:middle">${profCell(p.prof)}</td>
      <td><b>${esc(p.naziv)}</b><div style="font-size:10px;color:#5a5446">${esc(p.nap)}</div></td>
      <td class="m" style="text-align:right"><b style="font-size:14px">${p.mera} mm</b></td>
      <td class="m" style="text-align:center;font-weight:700;font-size:14px">${p.kom}</td>
      <td style="text-align:center"><span class="chk"></span></td></tr>`;
  });
  html += `</tbody></table></div>`;

  /* 02 — CERADA + MAPA */
  html += `<div class="sec"><div class="sec-h"><span class="sec-n acc">02</span>
    <h3 class="sec-t">Cerada — sečenje i mapa kedera</h3></div>
    <div class="cerada-wrap"><div>
      <div class="box-cut"><div class="box-cut-t">MERA ZA KROJENJE</div>
        <div class="box-cut-v">${R.cerada.sirinaCerade} × ${R.cerada.duzCerade}</div>
        <div style="font-size:10px;color:#888">širina × dužina (mm) · 1 kom</div></div>
      <div class="card mono" style="margin-top:9px;font-size:11px;line-height:1.8">
        <div>Broj kedera: <b>${R.cerada.kornisaUkupno}</b></div>
        <div>Intervala: <b>${R.cerada.brIntervala}</b> ${autoOn?'(auto)':'(ručno)'}</div>
        <div>Razmak (centar–centar): <b>${R.cerada.razmakKornisa} mm</b></div>
        <div>Od prednje ivice do K1: <b>100 mm</b></div>
        <div>Rezerva uz zid: <b>470 mm</b> (400 + 70)</div></div>
      <div class="${R.cerada.razmakOk?'note-ok':'note-warn'}">
        <b style="color:${R.cerada.razmakOk?'#3f7a4d':'#bd4a2a'}">${R.cerada.razmakOk?'✓':'⚠'} Razmak ${R.cerada.razmakKornisa} mm</b> —
        ${R.cerada.razmakOk?'u opsegu 399–499mm.':'van opsega 399–499mm — promeni broj intervala.'}</div>
      ${R.splice.spliceNeeded ? (() => {
        let inner;
        if(!R.splice.spliceOk){
          inner = 'Sastav nije moguće izračunati — proveri broj korniša.';
        } else {
          const sastavi = R.splice.spliceList.map(s=>`Sastav na keder <b>K${s.kornis}</b> — <b>${s.pos} mm od fronta</b>`).join('<br>');
          const opis = i => i===0 ? 'od prednje ivice'
            : `od K${R.splice.spliceList[i-1].kornis}`;
          const kraj = i => i===R.splice.spliceRolne.length-1 ? 'do zadnje ivice'
            : `do K${R.splice.spliceList[i].kornis}`;
          const rolne = R.splice.spliceRolne.map((d,i)=>
            `✂ Rolna ${i+1} — ${opis(i)} ${kraj(i)}: <b style="font-size:14px;">${d} mm</b>`).join('<br>');
          inner = sastavi + '<br>' + rolne;
        }
        return `<div class="note-warn splice-warn" style="margin-top:6px;background:#fdf3e3;border:2px solid #c07000;color:#191814;">
          <b style="color:#9a5a00">⚠ SPAJANJE CERADE — ukupna dubina ${R.cerada.duzCerade} mm &gt; 3000 mm · ${R.splice.spliceRolne.length||'?'} rolne</b>
          <div style="margin-top:5px;font-size:11px;line-height:1.9;font-family:'Spline Sans Mono',monospace;color:#191814;">${inner}</div>
        </div>`;
      })() : ''}
    </div>`;

  const mapH=300;
  html += `<div class="mapa">
    <div class="mapa-edge"><span>▼ PREDNJA IVICA (uz oluk)</span><span>0 mm</span></div>
    <div class="mapa-body" style="height:${mapH}px">`;
  const n = cMap.length;
  cMap.forEach(k=>{
    const top=(k.pos/R.cerada.duzCerade)*mapH;
    const h=k.tip==="debeli"?8:5;
    const shadow=k.tip==="svetlo"?"box-shadow:0 0 0 1px #8a5d2e;":"";
    const mark=k.tip==="svetlo"?"★":k.tip==="debeli"?"■":"";
    const isLast = k.i===n;
    if(isLast){
      html += `<div class="keder" style="top:${top-4}px;z-index:5">
        <div class="keder-lbl" style="margin:0 0 1px 0">
          <span style="background:#191814;color:#f6f4ee;padding:1px 5px;border-radius:2px;font-weight:700">K${k.i} ${mark} (zadnji)</span>
          <span style="background:#191814;color:#f6f4ee;padding:1px 5px;border-radius:2px;font-weight:700">${round(k.pos)} mm</span>
        </div>
        <div class="keder-bar" style="height:${h}px;background:${BOJA[k.tip]}"></div>
      </div>`;
    } else {
      html += `<div class="keder" style="top:${top-4}px">
        <div class="keder-bar" style="height:${h}px;background:${BOJA[k.tip]};${shadow}"></div>
        <div class="keder-lbl"><span style="font-weight:700">K${k.i} ${mark}</span><span>${round(k.pos)} mm</span></div>
      </div>`;
    }
  });
  const rezH=(470/R.cerada.duzCerade)*mapH;
  html += `<div class="rezerva" style="height:${rezH}px"><span>▒ REZERVA UZ ZID 470mm</span></div>
    </div>
    <div class="mapa-edge"><span>▲ ZADNJA IVICA (uz zid)</span><span>${R.cerada.duzCerade} mm</span></div>
    <div class="legend">`+
    Object.keys(BOJA).map(k=>`<span><span class="swatch" style="background:${BOJA[k]}"></span>${LABELA[k]}</span>`).join("")+
    `</div></div></div></div>`;

  /* 03 — BRAVARIJA / OKOV — metalni delovi + okov po grupama */
  html += `<div class="sec"><div class="sec-h"><span class="sec-n">03</span>
    <h3 class="sec-t">Bravarija / okov</h3></div>`;

  // Metalna cev na zidu + trapezni lim
  html += `<div class="grp-t">METALNA CEV NA ZIDU + LIM</div><table><tbody>`;
  if(I.cev!=="nema") html += `<tr>
    <td style="width:64px">&nbsp;</td>
    <td><b>Cev na zidu ${esc(I.cev)}</b><div style="font-size:10px;color:#5a5446">Nosač pergole — dužina = širina pergole</div></td>
    <td class="m" style="width:110px;text-align:right"><b style="font-size:14px">${R.in.D} mm</b></td>
    <td class="m" style="width:42px;text-align:center;font-weight:700;font-size:14px">1</td>
    <td style="text-align:center;width:32px"><span class="chk"></span></td>
  </tr>`;
  html += `<tr style="background:#ebe7db">
    <td>&nbsp;</td>
    <td><b>Trapezni lim 125×80</b><div style="font-size:10px;color:#5a5446">Pokriva širinu pergole · 1 komad = 1,25×0,80m (1 m²)</div></td>
    <td class="m" style="text-align:right">1250 × 800</td>
    <td class="m" style="text-align:center;font-weight:700;font-size:14px">${R.profili2.limKom} kom</td>
    <td style="text-align:center"><span class="chk"></span></td>
  </tr>`;
  html += `</tbody></table>`;

  // Plastika, Metal, Fitilji
  OKOV_PODSEKCIJE.forEach(g=>{
    const items = okov.filter(x=>x.grupa===g.id);
    if(!items.length) return;
    html += `<div class="grp-t">${g.t.toUpperCase()}</div><table><tbody>`;
    items.forEach((s,i)=>{
      html += `<tr style="background:${i%2?'#ebe7db':'transparent'}">
        <td style="width:64px">${imgTag(s.img, s.naziv)}</td>
        <td><b>${esc(s.naziv)}</b><div style="font-size:10px;color:#888">${esc(s.pravilo)}</div></td>
        <td class="m" style="width:128px;text-align:right;font-weight:700;font-size:14px">${s.kol} ${s.jed}</td>
        <td style="text-align:center;width:32px"><span class="chk"></span></td></tr>`;
    });
    html += `</tbody></table>`;
  });
  html += `</div>`;

  /* 04 — ELEKTRONIKA */
  html += `<div class="sec"><div class="sec-h"><span class="sec-n">04</span>
    <h3 class="sec-t">Elektronika</h3></div>
    <div style="font-size:10.5px;color:#5a5446;margin-bottom:4px">
      Motor, daljinski, trafo i dimer idu uz svaki sistem da bi radila LED rasveta.</div>
    <table><tbody>`;
  // Motor / daljinski / trafo / dimer
  const motorNaziv = (I.motor||"").trim() || "Motor (po izboru)";
  const elekItems = [
    {naziv:motorNaziv, opis:"motor po izboru — upiši model", kol:1, jed:"kom"},
    {naziv:"Daljinski upravljač", opis:"posebno od motora", kol:1, jed:"kom"},
    {naziv:`Trafo ${R.led.trafo}`, opis:`uz svaki sistem — potrošnja ${R.led.potrosnja}A (${R.led.svetalaUkupno} × 0,34A)`, kol:1, jed:"kom"},
    {naziv:"Dimer", opis:"uz svaki sistem — za regulaciju LED-a", kol:1, jed:"kom"},
  ];
  elekItems.forEach((e,i)=>{
    html += `<tr style="background:${i%2?'#ebe7db':'transparent'}">
      <td style="width:64px">&nbsp;</td>
      <td><b>${esc(e.naziv)}</b><div style="font-size:10px;color:#888">${esc(e.opis)}</div></td>
      <td class="m" style="width:128px;text-align:right;font-weight:700;font-size:14px">${e.kol} ${e.jed}</td>
      <td style="text-align:center;width:32px"><span class="chk"></span></td></tr>`;
  });
  // LED svetla i kabl iz okov[grupa=led]
  okov.filter(x=>x.grupa==="led").forEach((s,i)=>{
    const idx = elekItems.length + i;
    html += `<tr style="background:${idx%2?'#ebe7db':'transparent'}">
      <td style="width:64px">${imgTag(s.img, s.naziv)}</td>
      <td><b>${esc(s.naziv)}</b><div style="font-size:10px;color:#888">${esc(s.pravilo)}</div></td>
      <td class="m" style="text-align:right;font-weight:700;font-size:14px">${s.kol} ${s.jed}</td>
      <td style="text-align:center"><span class="chk"></span></td></tr>`;
  });
  html += `</tbody></table>`;

  // LED — mapa bušenja sa ravnomernim pozicijama
  if(R.led.svetalaPoKornizu > 0){
    const L = R.kornis.duzKornisa;
    const poz = R.led.ledPozicije;
    html += `<div class="card mono" style="margin-top:9px;font-size:11px;line-height:1.8">
      <div style="font-family:'Fjalla One',sans-serif;font-size:11px;color:#8a5d2e;margin-bottom:3px">
        BUŠENJE RUPA ZA LED — korniši sa ★ (${R.cerada.tankiSvetlo} kom) · dužina korniša ${L} mm</div>
      <div>Svetala po kornišu: <b>${R.led.svetalaPoKornizu}</b>
        &nbsp;·&nbsp; Od ivice do 1. rupe: <b>${R.led.odIviceDoRupe} mm</b>
        &nbsp;·&nbsp; Razmak (c–c): <b>${R.led.razmakRupa} mm</b></div>
      ${rupeBar(L, poz, '#a9743c')}
      <div style="margin-top:4px;padding-top:4px;border-top:1px solid #ebe7db">
        ★ UKUPNO LED: <b style="font-size:14px">${R.led.svetalaUkupno} kom</b></div>
    </div>`;
  }
  // Rupe za kolica — samo jednostrani keder
  if(R.kolica.rupe.length){
    const L = R.kornis.duzKornisa;
    html += `<div class="card mono" style="margin-top:9px;font-size:11px;line-height:1.8">
      <div style="font-family:'Fjalla One',sans-serif;font-size:11px;color:#8a5d2e;margin-bottom:3px">
        BUŠENJE RUPA ZA KOLICA — SVI korniši (${R.cerada.kornisaUkupno} kom) · po ${R.kolica.rupe.length} rupe (1 po raju)</div>
      <div>45 mm od obe ivice${R.kolica.rupe.length>2?', ostale ravnomerno između':''}</div>
      ${rupeBar(L, R.kolica.rupe, '#3f7a4d')}
    </div>`;
  } else if(R.kornis.keder==="dvostrani"){
    html += `<div class="card mono" style="margin-top:9px;font-size:11px;line-height:1.8;color:#5a5446">
      Rupe za kolica se NE buše — dvostrani keder, kolica idu kroz rupe u umetcima.</div>`;
  }
  html += `</div>`;

  /* 05 — ČELIČNA KONSTRUKCIJA */
  html += `<div class="sec"><div class="sec-h"><span class="sec-n">05</span>
    <h3 class="sec-t">Čelična konstrukcija (opciono)</h3></div>`;
  if(!I.celicnaOn){
    html += `<div class="opt-off">Za ovaj objekat <b>nije</b> potrebna čelična konstrukcija.</div>`;
  } else {
    const valid = steelRows.filter(r => (+r.kom>0) && (+r.duzina>0));
    if(!valid.length){
      html += `<div class="note-warn"><b style="color:#bd4a2a">⚠</b> Čelična konstrukcija je uključena, ali nije unesena nijedna cev.</div>`;
    } else {
      html += `<table><thead><tr>
        <th>Profil cevi</th>
        <th style="width:130px;text-align:right">Dužina (mera)</th>
        <th style="width:50px;text-align:center">Kom</th>
        <th style="width:90px;text-align:right">Ukupno (m)</th>
        <th style="width:30px;text-align:center">✓</th>
      </tr></thead><tbody>`;
      let totalM=0;
      valid.forEach((r,i)=>{
        const uk=(+r.kom*+r.duzina)/1000; totalM+=uk;
        html += `<tr style="background:${i%2?'#ebe7db':'transparent'}">
          <td style="font-weight:600">Čelična cev ${esc(r.profil)}</td>
          <td class="m" style="text-align:right"><b style="font-size:13px">${esc(r.duzina)} mm</b></td>
          <td class="m" style="text-align:center;font-weight:700">${esc(r.kom)}</td>
          <td class="m" style="text-align:right;font-weight:700">${round(uk,2)} m</td>
          <td style="text-align:center"><span class="chk"></span></td></tr>`;
      });
      html += `<tr style="background:#191814;color:#fff">
        <td colspan="3" style="font-weight:700;border:0">UKUPNO ČELIČNE CEVI</td>
        <td class="m" style="text-align:right;font-weight:700;border:0">${round(totalM,2)} m</td>
        <td style="border:0"></td></tr></tbody></table>`;
    }
  }
  html += `</div>`;

  /* Napomene */
  html += `<div class="sec"><div class="sec-h"><span class="sec-n acc">!!</span>
    <h3 class="sec-t">Napomene za radnika</h3></div>
    <ol class="napomene">
      <li>Cerada: prvi keder na <b>100mm</b> od prednje ivice, rezerva uz zid <b>470mm</b>.</li>
      <li>Razmak kedera mora biti <b>399–499mm</b> — program uklapa automatski.</li>

      <li>Rupe za LED se buše <b>samo</b> na tankim kornišima sa ★.</li>

/* ───────── RENDER OBRAČUN ───────── */
function renderObracun(I, R, alu, okov, obr){
  const bojaTxt = I.bojaRal ? ("RAL " + I.bojaRal) : "(po izboru)";
  let html = "";
  html += `<div class="doc-head">
    <div><div class="doc-title">OBRAČUN MATERIJALA</div>
      <div class="doc-sub">AG GROUP · INTERNO · TROŠAK PO PERGOLI</div></div>
    <div class="doc-meta"><div class="badge obracun">SAMO ZA INTERNU UPOTREBU</div>
      <div style="margin-top:4px">Br. naloga: <b>${esc(I.brNaloga)||"______"}</b></div>
      <div>Datum: <b>${esc(I.datum)||"—"}</b></div>
    </div></div>`;

  html += `<div class="info-row">
    <div class="card"><div class="card-t">KUPAC / OBJEKAT</div>
      <div style="font-size:14px;margin-top:3px"><b>${esc(I.kupac)||"—"}</b></div>
      <div style="font-size:12px;color:#5a5446">${esc(I.adresa)||"—"}</div></div>
    <div class="card"><div class="card-t">KONFIGURACIJA</div>
      <div class="mono" style="font-size:11px;margin-top:3px;line-height:1.65">
        ${R.in.D} × ${R.in.B} mm · Visine ${R.in.A}/${R.in.C}<br>
        Šina <b>${esc(I.sirinaRaja)}×150</b> · Stub <b>${esc(I.stub)}</b><br>
        Boja: <b>${esc(bojaTxt)}</b><br>
        ${R.auto.brRaja} raja · ${R.auto.brStubova} stubova · ${R.cerada.kornisaUkupno} korniša</div></div></div>`;

  html += `<div class="obr-warning">⚠ Ovo nije ponuda za kupca — samo trošak materijala. Marža, rad, montaža, profit i PDV se dodaju na ovo.</div>`;

  /* 01 — Aluminijum */
  html += `<div class="sec"><div class="sec-h"><span class="sec-n">01</span>
    <h3 class="sec-t">Aluminijum (${ALU_PRICE_PER_KG.toFixed(2)} €/kg)</h3></div>
    <table><thead><tr>
      <th style="width:50px">Slika</th>
      <th style="width:54px">Šifra</th>
      <th>Profil</th>
      <th style="width:60px;text-align:right">Kg/m</th>
      <th style="width:60px;text-align:right">m × kom</th>
      <th style="width:60px;text-align:right">Kg</th>
      <th style="width:80px;text-align:right">Cena</th>
    </tr></thead><tbody>`;
  alu.items.forEach((p,i)=>{
    html += `<tr style="background:${i%2?'#ebe7db':'transparent'}">
      <td>${imgTag(p.prof.img, p.prof.nazivSr)}</td>
      <td class="m" style="font-weight:700">${esc(p.prof.sifra)}</td>
      <td><b>${esc(p.naziv)}</b></td>
      <td class="m" style="text-align:right">${p.prof.kgm}</td>
      <td class="m" style="text-align:right">${p.metaraUk} m</td>
      <td class="m" style="text-align:right;font-weight:600">${p.kg} kg</td>
      <td class="m euro" style="text-align:right">${eur(p.cena)}</td></tr>`;
  });
  html += `<tr class="obr-sum">
    <td colspan="5">UKUPNO ALUMINIJUM</td>
    <td class="m" style="text-align:right">${alu.totalKg} kg</td>
    <td class="m euro" style="text-align:right">${eur(alu.totalEur)}</td></tr>`;
  html += `</tbody></table></div>`;

  /* 02 — Cerada */
  html += `<div class="sec"><div class="sec-h"><span class="sec-n">02</span>
    <h3 class="sec-t">Cerada (${CERADA_PER_M2.toFixed(2)} €/m²)</h3></div>
    <table><tbody>
    <tr>
      <td><b>Cerada ${R.cerada.sirinaCerade} × ${R.cerada.duzCerade} mm</b><div style="font-size:10px;color:#888">Boja: ${esc(I.bojaCerade)}</div></td>
      <td class="m" style="width:90px;text-align:right">${obr.m2cerade} m²</td>
      <td class="m euro" style="width:90px;text-align:right;font-weight:700">${eur(obr.cerada)}</td>
    </tr></tbody></table></div>`;

  /* 03 — Okov po grupama */
  const groupTitles = {plastika:"Plastika okov", metal:"Metal okov", fitilj:"Fitilji / kederi (gumene trake)"};
  let okovSum = 0;
  ["plastika","metal","fitilj"].forEach(g=>{
    const items = okov.filter(x=>x.grupa===g);
    if(!items.length) return;
    const grpTot = round(items.reduce((s,x)=>s+x.ukupno,0), 2);
    okovSum += grpTot;
    html += `<div class="sec"><div class="sec-h"><span class="sec-n">${g==='plastika'?'03':g==='metal'?'04':'05'}</span>
      <h3 class="sec-t">${groupTitles[g]}</h3></div>
      <table><thead><tr>
        <th style="width:50px">Slika</th>
        <th style="width:64px">Šifra</th>
        <th>Naziv</th>
        <th style="width:90px;text-align:right">Količina</th>
        <th style="width:64px;text-align:right">€/jed</th>
        <th style="width:80px;text-align:right">Cena</th>
      </tr></thead><tbody>`;
    items.forEach((s,i)=>{
      html += `<tr style="background:${i%2?'#ebe7db':'transparent'}">
        <td>${imgTag(s.img, s.naziv)}</td>
        <td class="m" style="font-weight:600">${esc(s.sifra)}</td>
        <td>${esc(s.naziv)}</td>
        <td class="m" style="text-align:right">${s.kol} ${s.jed}</td>
        <td class="m" style="text-align:right">${eur(s.cena)}</td>
        <td class="m euro" style="text-align:right">${eur(s.ukupno)}</td></tr>`;
    });
    html += `<tr class="obr-sum"><td colspan="5">UKUPNO ${groupTitles[g].toUpperCase()}</td>
      <td class="m euro" style="text-align:right">${eur(grpTot)}</td></tr>`;
    html += `</tbody></table></div>`;
  });

  /* 06 — Elektronika */
  const ledItems = okov.filter(x=>x.grupa==="led");
  html += `<div class="sec"><div class="sec-h"><span class="sec-n">06</span>
    <h3 class="sec-t">Elektronika</h3></div>
    <table><tbody>
      <tr><td><b>Motor</b><div style="font-size:10px;color:#888">${esc((I.motor||"").trim()||"po izboru")}</div></td>
        <td class="m" style="width:90px;text-align:right">1 kom</td>
        <td class="m" style="width:64px;text-align:right">${eur(MOTOR_PRICE)}</td>
        <td class="m euro" style="width:80px;text-align:right;font-weight:700">${eur(MOTOR_PRICE)}</td></tr>
      <tr style="background:#ebe7db"><td><b>Daljinski upravljač</b></td>
        <td class="m" style="text-align:right">1 kom</td>
        <td class="m" style="text-align:right">${eur(DALJINSKI_PRICE)}</td>
        <td class="m euro" style="text-align:right;font-weight:700">${eur(DALJINSKI_PRICE)}</td></tr>
      <tr><td><b>Trafo ${R.led.trafo}</b><div style="font-size:10px;color:#888">${R.led.potrosnja}A potrošnja</div></td>
        <td class="m" style="text-align:right">1 kom</td>
        <td class="m" style="text-align:right">${eur(R.led.trafoCena)}</td>
        <td class="m euro" style="text-align:right;font-weight:700">${eur(R.led.trafoCena)}</td></tr>
      <tr style="background:#ebe7db"><td><b>Dimer</b></td>
        <td class="m" style="text-align:right">1 kom</td>
        <td class="m" style="text-align:right">${eur(DIMER_PRICE)}</td>
        <td class="m euro" style="text-align:right;font-weight:700">${eur(DIMER_PRICE)}</td></tr>`;
  ledItems.forEach((s,i)=>{
    html += `<tr style="background:${(i+4)%2?'#ebe7db':'transparent'}">
      <td><b>${esc(s.naziv)}</b><div style="font-size:10px;color:#888">${esc(s.pravilo)}</div></td>
      <td class="m" style="text-align:right">${s.kol} ${s.jed}</td>
      <td class="m" style="text-align:right">${eur(s.cena)}</td>
      <td class="m euro" style="text-align:right;font-weight:700">${eur(s.ukupno)}</td></tr>`;
  });
  html += `<tr class="obr-sum"><td colspan="3">UKUPNO ELEKTRONIKA</td>
    <td class="m euro" style="text-align:right">${eur(obr.elekTotal)}</td></tr>`;
  html += `</tbody></table></div>`;

  /* 07 — Paušal */
  html += `<div class="sec"><div class="sec-h"><span class="sec-n">07</span>
    <h3 class="sec-t">Vijci i pakovanje (paušal)</h3></div>
    <table><tbody>
      <tr><td><b>Vijci, navrtke, podloške + pakovanje (folija, ćoškovi, traka)</b></td>
        <td class="m euro" style="width:90px;text-align:right;font-weight:700">${eur(SRAFOVI_PAUSAL)}</td></tr>
    </tbody></table></div>`;

  /* 08 — Bravarija: cev na zidu + trapezni lim */
  html += `<div class="sec"><div class="sec-h"><span class="sec-n">08</span>
    <h3 class="sec-t">Bravarija — cev na zidu + lim</h3></div>
    <table><tbody>
      ${I.cev!=="nema"?`<tr><td><b>Cev na zidu ${esc(I.cev)}</b><div style="font-size:10px;color:#888">Nosač pergole · dužina = širina pergole · ${eur(CELIK_CEV_PER_M_EUR)}/m (1100 RSD/m)</div></td>
        <td class="m" style="width:90px;text-align:right">${obr.cevNaZiduM} m</td>
        <td class="m" style="width:80px;text-align:right">${eur(CELIK_CEV_PER_M_EUR)}</td>
        <td class="m euro" style="width:90px;text-align:right;font-weight:700">${eur(obr.cevNaZiduEur)}</td></tr>`:''}
      <tr style="background:#ebe7db"><td><b>Trapezni lim 125×80</b><div style="font-size:10px;color:#888">1 komad 1,25×0,80m = 1 m² · ${eur(TRAPEZ_LIM_PER_M2_EUR)}/m² (900 RSD/m²)</div></td>
        <td class="m" style="text-align:right">${obr.trapezniLimKom} kom (${obr.trapezniLimM2} m²)</td>
        <td class="m" style="text-align:right">${eur(TRAPEZ_LIM_PER_M2_EUR)}</td>
        <td class="m euro" style="text-align:right;font-weight:700">${eur(obr.trapezniLimEur)}</td></tr>
    </tbody></table></div>`;

  /* 09 — Čelična konstrukcija (samo ako uključena) */
  if (I.celicnaOn) {
    const valid = steelRows.filter(r => (+r.kom>0) && (+r.duzina>0));
    html += `<div class="sec"><div class="sec-h"><span class="sec-n">09</span>
      <h3 class="sec-t">Čelična konstrukcija (${eur(CELIK_CEV_PER_M_EUR)}/m · 1100 RSD/m)</h3></div>`;
    if (!valid.length) {
      html += `<div class="opt-off">Čelična konstrukcija je uključena, ali nije unesena nijedna cev.</div></div>`;
    } else {
      html += `<table><thead><tr>
        <th>Profil cevi</th>
        <th style="width:60px;text-align:right">Kom</th>
        <th style="width:90px;text-align:right">Dužina</th>
        <th style="width:80px;text-align:right">Ukupno (m)</th>
        <th style="width:90px;text-align:right">Cena</th>
      </tr></thead><tbody>`;
      valid.forEach((r,i)=>{
        const m = round((+r.kom * +r.duzina) / 1000, 2);
        const c = round(m * CELIK_CEV_PER_M_EUR, 2);
        html += `<tr style="background:${i%2?'#ebe7db':'transparent'}">
          <td><b>Čelična cev ${esc(r.profil)}</b></td>
          <td class="m" style="text-align:right">${esc(r.kom)}</td>
          <td class="m" style="text-align:right">${esc(r.duzina)} mm</td>
          <td class="m" style="text-align:right;font-weight:600">${m} m</td>
          <td class="m euro" style="text-align:right;font-weight:700">${eur(c)}</td></tr>`;
      });
      html += `<tr class="obr-sum"><td colspan="3">UKUPNO ČELIČNA KONSTRUKCIJA</td>
        <td class="m" style="text-align:right">${obr.celicnaM} m</td>
        <td class="m euro" style="text-align:right">${eur(obr.celicnaEur)}</td></tr>`;
      html += `</tbody></table></div>`;
    }
  }

  /* TOTAL */
  html += `<div class="sec"><table><tbody>
    <tr><td style="width:50%"><b>Aluminijum (${alu.totalKg} kg)</b></td><td class="m euro" style="text-align:right;font-size:13px;font-weight:700">${eur(obr.alu)}</td></tr>
    <tr><td><b>Cerada (${obr.m2cerade} m²)</b></td><td class="m euro" style="text-align:right;font-size:13px;font-weight:700">${eur(obr.cerada)}</td></tr>
    <tr><td><b>Plastika okov</b></td><td class="m euro" style="text-align:right;font-size:13px;font-weight:700">${eur(obr.plastika)}</td></tr>
    <tr><td><b>Metal okov</b></td><td class="m euro" style="text-align:right;font-size:13px;font-weight:700">${eur(obr.metal)}</td></tr>
    <tr><td><b>Fitilji / kederi</b></td><td class="m euro" style="text-align:right;font-size:13px;font-weight:700">${eur(obr.fitilj)}</td></tr>
    <tr><td><b>Elektronika</b></td><td class="m euro" style="text-align:right;font-size:13px;font-weight:700">${eur(obr.elekTotal)}</td></tr>
    ${I.cev!=="nema"?`<tr><td><b>Cev na zidu ${esc(I.cev)} (${obr.cevNaZiduM} m)</b></td><td class="m euro" style="text-align:right;font-size:13px;font-weight:700">${eur(obr.cevNaZiduEur)}</td></tr>`:''}
    <tr><td><b>Trapezni lim 125×80 (${obr.trapezniLimKom} kom · ${obr.trapezniLimM2} m²)</b></td><td class="m euro" style="text-align:right;font-size:13px;font-weight:700">${eur(obr.trapezniLimEur)}</td></tr>
    <tr><td><b>Vijci + pakovanje (paušal)</b></td><td class="m euro" style="text-align:right;font-size:13px;font-weight:700">${eur(obr.srafovi)}</td></tr>
    ${I.celicnaOn && obr.celicnaEur>0 ? `<tr><td><b>Čelična konstrukcija (${obr.celicnaM} m)</b></td><td class="m euro" style="text-align:right;font-size:13px;font-weight:700">${eur(obr.celicnaEur)}</td></tr>` : ''}
    <tr class="obr-total"><td>UKUPNO TROŠAK MATERIJALA</td><td class="amt" style="text-align:right">${eur(obr.subtotal)}</td></tr>
  </tbody></table></div>`;

  // Po m² indikator
  const projektM2 = round(R.in.D*R.in.B/1e6, 2);
  const trosakM2 = projektM2 ? round(obr.subtotal/projektM2, 2) : 0;
  html += `<div class="card mono" style="margin-top:14px;font-size:12px">
    Površina projekta: <b>${projektM2} m²</b> · Trošak po m² (samo materijal): <b>${eur(trosakM2)}/m²</b></div>`;

  html += `<div class="foot">AG GROUP · obračun materijala · cene: aluminijum ${ALU_PRICE_PER_KG.toFixed(2)} €/kg · cerada ${CERADA_PER_M2.toFixed(2)} €/m² · trapezni lim 900 RSD/m² · čelik 1100 RSD/m (kurs ${RSD_PER_EUR} din/€) · motor ${MOTOR_PRICE}€ · daljinski ${DALJINSKI_PRICE}€ · dimer ${DIMER_PRICE}€ · vijci paušal ${SRAFOVI_PAUSAL}€</div>`;

  $("doc").innerHTML = html;
}

    $("parapetInputWrap").style.display=$("parapetOn").checked?"block":"none";

})();

// custom artikli iz baze — spajaju se sa hardkodiranom listom
let customArtikliLoaded = false;
async function mergeCustomArtikli(){
  if(customArtikliLoaded) return;
  try {
    const res = await fetch(API_URL+'/artikli.php?action=list', {headers:{'X-Api-Key': API_KEY}});
    const json = await res.json();
    if(json.ok){
      json.data.forEach(a => {
        const sek = MAG_SEKCIJE.find(s => s.id === a.kategorija);
        if(!sek) return;
        const postojeci = sek.stavke.find(s => s.sifra === a.sifra);
        if(postojeci){ postojeci.naziv = a.naziv; return; }  // izmena naziva iz popisa
        sek.stavke.push({sifra: a.sifra, naziv: a.naziv, tip: a.tip === 'metar2' ? 'metar' : a.tip});
      });
      customArtikliLoaded = true;
    }
  } catch(e){}
}

let magState = null;

async function renderMagacin(){
  const doc = $("doc");
  doc.innerHTML = '<div class="mag-wrap"><div class="mag-empty">⏳ Učitavam magacin...</div></div>';
  await mergeCustomArtikli();
  try {
    const res = await fetch(API_URL+'/magacin.php?action=get', {headers:{'X-Api-Key': API_KEY}});
    const json = await res.json();
    if(json.ok) magState = json.data;
  } catch(e){ magState = null; }

  if(!magState){
    doc.innerHTML = '<div class="mag-wrap"><div class="mag-empty">❌ Ne mogu da učitam magacin — proveri konekciju.</div></div>';
    return;
  }

  // Ukupni stats profila
  let totalKom = 0, totalM = 0, totalKg = 0;
  MAG_PROFILI.forEach(s => {
    const komadi = magState[s.sifra]?.komadi || [];
    if(!komadi.length) return;
    const m = komadi.reduce((a,k)=>a+(+k.duzina||0),0)/1000;
    totalKom += komadi.length;
    totalM   += m;
    if(s.kg_m) totalKg += m * s.kg_m;
  });

  const kgStr = totalKg >= 1000 ? (totalKg/1000).toFixed(2)+' t' : Math.round(totalKg)+' kg';

  let html = '<div class="mag-wrap">';

  // Summary kartice
  html += `<div class="mag-summary">
    <div class="mag-stat">
      <span class="mag-stat-val">${totalKom}</span>
      <span class="mag-stat-lbl">Komada profila</span>
    </div>
    <div class="mag-stat">
      <span class="mag-stat-val">${totalM.toFixed(1)} m</span>
      <span class="mag-stat-lbl">Ukupno metara</span>
    </div>
    <div class="mag-stat">
      <span class="mag-stat-val">${kgStr}</span>
      <span class="mag-stat-lbl">Ukupno aluminijum</span>
    </div>
    <div class="mag-stat" style="cursor:pointer;" onclick="renderMagacin()">
      <span class="mag-stat-val" style="font-size:14px;">↻</span>
      <span class="mag-stat-lbl">Osveži</span>
    </div>
  </div>`;

  // Profili — clean table, bez chipova
  html += `<div class="mag-sek">
    <div class="mag-sek-h">Aluminijum profili</div>
    <div class="mag-row mag-thead">
      <div class="mag-sifra">Šifra</div>
      <div class="mag-naziv">Naziv</div>
      <div class="mag-kgm">kg/m</div>
      <div class="mag-stan">Na stanju</div>
      <div class="mag-kg">Težina</div>
      <div style="width:80px;flex-shrink:0;"></div>
    </div>`;

  MAG_PROFILI.forEach(s => {
    const komadi = magState[s.sifra]?.komadi || [];
    const prag   = OTPAD_PRAG_MAP[s.sifra] ?? OTPAD_PRAG_DEFAULT;
    const ukM    = komadi.reduce((a,k)=>a+(+k.duzina||0),0)/1000;
    const ukKg   = s.kg_m && ukM > 0 ? (ukM * s.kg_m).toFixed(0)+' kg' : '—';
    const hasWarn = komadi.some(k => +k.duzina > 0 && +k.duzina < prag);
    const stanCls = komadi.length === 0 ? 'zero' : hasWarn ? 'low' : '';
    const stanTxt = komadi.length
      ? `${komadi.length} kom · ${ukM.toFixed(1)} m`
      : 'nema na stanju';
    html += `<div class="mag-row">
      <div class="mag-sifra">${s.sifra}</div>
      <div class="mag-naziv">${s.naziv}</div>
      <div class="mag-kgm">${s.kg_m != null ? s.kg_m.toFixed(3) : '—'}</div>
      <div class="mag-stan ${stanCls}">${stanTxt}</div>
      <div class="mag-kg">${ukKg}</div>
      <button class="mag-kor-btn" onclick="openKor('${s.sifra}','${s.naziv.replace(/'/g,"\\'")}','profil')">Korekcija</button>
    </div>`;
  });
  html += `</div>`;

  // Ostale sekcije — kompaktan prikaz
  MAG_SEKCIJE.filter(sek => sek.id !== 'alu').forEach(sek => {
    html += `<div class="mag-sek"><div class="mag-sek-h">${sek.naziv}</div>`;
    sek.stavke.forEach(s => {
      const d   = magState[s.sifra];
      const tip = s.tip || sek.tip || 'kom';
      const kol = d?.kolicina ?? 0;
      const min = d?.minimum  ?? 0;
      const low = min > 0 && kol <= min;
      const jed = tip === 'metar' ? 'm' : 'kom';
      const cls = kol === 0 ? 'zero' : low ? 'low' : '';
      html += `<div class="mag-row">
        <div class="mag-sifra">${s.sifra}</div>
        <div class="mag-naziv">${s.naziv}</div>
        <div class="mag-stan ${cls}">${kol} ${jed}${low?' ⚠':''}</div>
        <button class="mag-kor-btn" onclick="openKor('${s.sifra}','${s.naziv.replace(/'/g,"\\'")}','${tip}')">Korekcija</button>
      </div>`;
    });
    html += `</div>`;
  });

  html += `<div style="padding:10px 0 20px;text-align:center;">
    <a href="popis.html" style="color:var(--bronze);text-decoration:none;font-weight:600;border:1px solid var(--bronze);border-radius:5px;padding:8px 18px;font-size:12px;">📝 Popis magacina (telefon)</a>
  </div>`;
  html += '</div>';
  doc.innerHTML = html;
}

async function renderIstorija(){
  const doc = $("doc");
  doc.innerHTML = '<div class="mag-wrap"><div class="mag-empty">⏳ Učitavam istoriju...</div></div>';
  let rows = [];
  try {
    const res = await fetch(API_URL+'/magacin.php?action=log', {headers:{'X-Api-Key': API_KEY}});
    const json = await res.json();
    if(json.ok) rows = json.data;
  } catch(e){}

  if(!rows.length){
    doc.innerHTML = '<div class="mag-wrap"><div class="mag-empty">Nema zapisa u istoriji.<br>Kada pustiš nalog u proizvodnju, ovde će se pojaviti svako sečenje.</div></div>';
    return;
  }

  let html = '<div class="mag-wrap">';
  html += `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
    <div style="color:var(--muted);font-size:11px;">Poslednjih ${rows.length} aktivnosti</div>
    <button class="btn-xs btn-xs-load" onclick="renderIstorija()">↻ Osveži</button>
  </div>`;
  html += `<div class="mag-sek"><div class="mag-sek-h">📋 ISTORIJA MAGACINA</div>`;

  rows.forEach(r => {
    const d = r.detalji || {};
    const vreme = (r.vreme||'').substring(0,16).replace('T',' ');
    let opis = '';

    if(r.akcija === 'secenje'){
      if(d.cuts && Array.isArray(d.cuts)){
        // New format: stockLen + cuts[]
        const cutsStr = d.cuts.map(c=>c+'mm').join(' + ');
        const ostStr = d.ostatak > 0
          ? (d.vracaSe ? ` → ↩ ostaje ${d.ostatak}mm` : ` → 🗑 otpad ${d.ostatak}mm`)
          : ' → tačno';
        opis = `Iz <b>${d.stockLen}mm</b>: ${cutsStr}${ostStr}`;
      } else if(d.iz){
        // Old single-cut format
        const ostStr = d.ostatak > 0
          ? (d.vracaSe ? ` → ↩ ostaje ${d.ostatak}mm` : ` → 🗑 otpad ${d.ostatak}mm`)
          : ' → tačno';
        opis = `Sečenje <b>${d.duzina}mm</b> iz ${d.iz}mm${ostStr}`;
      }
      if(d.nalog) opis += ` &nbsp;·&nbsp; Nalog: <b>${d.nalog}</b>`;
      if(d.kupac) opis += ` · ${d.kupac}`;
    } else if(r.akcija === 'korekcija'){
      opis = `Korekcija stanja`;
      if(d.razlog) opis += ` — <em>${d.razlog}</em>`;
    } else {
      opis = r.akcija;
    }

    const col = r.akcija === 'secenje' ? '#7dba8a' : '#a9743c';
    const lbl = r.akcija === 'secenje' ? '✂' : '⚙';

    html += `<div class="mag-row" style="gap:8px;align-items:flex-start;flex-wrap:nowrap;">
      <div style="font-family:monospace;font-size:9px;color:var(--muted);white-space:nowrap;min-width:92px;padding-top:1px;">${vreme}</div>
      <div style="font-family:monospace;font-size:10px;color:#c0b08a;min-width:50px;padding-top:1px;">${r.sifra}</div>
      <div style="flex:1;font-size:11px;line-height:1.55;">${opis}</div>
      <div style="font-size:13px;color:${col};padding-top:1px;">${lbl}</div>
    </div>`;
  });

  html += `</div></div>`;
  doc.innerHTML = html;
}

/* ── Magacin hints za sekciju 01 ── */
async function loadMagacinHints(items){
  if(!magState){
    try {
      const res = await fetch(API_URL+'/magacin.php?action=get', {headers:{'X-Api-Key':API_KEY}});
      const json = await res.json();
      if(json.ok) magState = json.data;
    } catch(e){ return; }
  }
  items.forEach((p,i) => {
    if(!(p.kom>0 && p.mera>0)) return;
    const el = document.getElementById('mh_'+p.prof.sifra+'_'+i);
    if(!el) return;
    const komadi = (magState[p.prof.sifra]?.komadi || []).map(k=>+k.duzina).filter(d=>d>0);
    if(!komadi.length){
      el.innerHTML = '<span style="color:#e07070;">⚠ nema na stanju</span>';
      return;
    }
    // best-fit: najmanji koji može da primi traženu dužinu
    const fit = komadi.filter(d=>d>=p.mera).sort((a,b)=>a-b)[0];
    if(fit){
      const ostatak = fit - p.mera;
      const prag = OTPAD_PRAG_MAP[p.prof.sifra] ?? OTPAD_PRAG_DEFAULT;
      const ostatakTxt = ostatak > 0
        ? (ostatak >= prag ? ` → ostatak <b>${ostatak}</b>mm` : ` → ostatak ${ostatak}mm (otpad)`)
        : '';
      el.innerHTML = `<span style="color:#7dba8a;">📦 iz <b>${fit}</b>mm${ostatakTxt}</span>`;
    } else {
      const maxKom = Math.max(...komadi);
      el.innerHTML = `<span style="color:#e07a5f;">⚠ max <b>${maxKom}</b>mm — premalo, naručiti</span>`;
    }
  });
}
