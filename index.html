<html lang="sr">

  <meta name="theme-color" content="#1a5f5f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <meta name="description" content="Aplikacija za listu secenja i pakovanje materijala" />

  <link rel="manifest" href="manifest.json" />

  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png" />

  <title>Lista Secenja - Pakovanje</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f4f4;

      min-height: 100vh;

       ============================================================ */

<body>

  <!-- ============================================================

       ============================================================ -->

  <script>
    // PWA Service Worker registracija
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW registrovan:', reg.scope))
          .catch(err => console.warn('SW greška:', err));
      });
    }

    // ============================================================
    // OVDE UBACI SVOJ JAVASCRIPT KOD

  </script>

</body>
