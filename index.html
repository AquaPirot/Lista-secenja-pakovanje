let korSifra = '', korTip = '';

function openKor(sifra, naziv, tip){
  korSifra = sifra; korTip = tip;
  $("korTitle").textContent = 'KOREKCIJA — '+sifra;
  document.getElementById('korOverlay').classList.add('open');
  buildKorBody();
}
function closeKor(){ document.getElementById('korOverlay').classList.remove('open'); }

function buildKorBody(){
  const body = document.getElementById('korBody');
  const d = magState?.[korSifra];
  const razlozi = ['Greška sečenja','Oštećen transport','Proveravana korekcija','Otpad','Ostalo'];
  let html = `<div style="margin-bottom:12px;">
    <label style="font-size:11px;color:var(--muted);display:block;margin-bottom:4px;">Razlog korekcije</label>
    <select id="korRazlog" style="width:100%;padding:8px;background:#101216;border:1px solid var(--line);border-radius:5px;color:#fff;font-size:13px;">
      ${razlozi.map(r=>`<option>${r}</option>`).join('')}
    </select>
  </div>`;

  if(korTip === 'profil'){
    const komadi = d?.komadi || [];
    const prag = OTPAD_PRAG_MAP[korSifra] ?? OTPAD_PRAG_DEFAULT;
    html += `<div style="font-size:11px;color:var(--muted);margin-bottom:6px;">Klikni × da ukloniš komad koji je pogrešno sečen ili oštećen:</div>`;
    html += `<div id="korKomadi" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;">`;
    komadi.forEach((k,i) => {
      const warn = +k.duzina > 0 && +k.duzina < prag;
      html += `<span class="mag-chip${warn?' warn':''}" style="cursor:pointer;padding:5px 10px;" onclick="korUkloniKomad(${i})" title="Klikni da ukloniš">
        ${k.duzina} mm <span style="color:#e07070;margin-left:4px;">×</span></span>`;
    });
    html += `</div>`;
    html += `<div style="font-size:11px;color:var(--muted);margin-bottom:4px;">Dodaj novi komad (mm):</div>
    <div style="display:flex;gap:6px;margin-bottom:14px;">
      <input type="number" id="korNovaDuz" placeholder="dužina mm" style="flex:1;padding:8px;background:#101216;border:1px solid var(--line);border-radius:5px;color:#fff;font-size:14px;font-family:monospace;">
      <button class="btn btn-secondary" onclick="korDodajKomad()" style="white-space:nowrap">+ Dodaj</button>
    </div>`;
  } else {
    const jed = korTip === 'metar' ? 'm' : 'kom';
    const kol = d?.kolicina ?? 0;
    const min = d?.minimum ?? 0;
    html += `<div style="margin-bottom:12px;">
      <label style="font-size:11px;color:var(--muted);display:block;margin-bottom:4px;">Nova količina (${jed})</label>
      <input type="number" id="korKolicina" value="${kol}" min="0" step="${korTip==='kom'?1:0.5}"
        style="width:100%;padding:8px;background:#101216;border:1px solid var(--line);border-radius:5px;color:#fff;font-size:18px;font-family:monospace;text-align:center;">
    </div>
    <div style="margin-bottom:12px;">
      <label style="font-size:11px;color:var(--muted);display:block;margin-bottom:4px;">Min. upozorenje (${jed})</label>
      <input type="number" id="korMinimum" value="${min}" min="0" step="${korTip==='kom'?1:0.5}"
        style="width:100%;padding:8px;background:#101216;border:1px solid var(--line);border-radius:5px;color:#fff;font-size:14px;font-family:monospace;text-align:center;">
    </div>`;
  }

  html += `<button class="btn btn-primary" style="width:100%;margin-bottom:6px;" onclick="sacuvajKorekciju()">✓ Sačuvaj korekciju</button>
    <button class="btn btn-secondary" style="width:100%;" onclick="closeKor()">Otkaži</button>`;
  body.innerHTML = html;
}

function korUkloniKomad(idx){
  if(!magState[korSifra]) return;
  magState[korSifra].komadi.splice(idx, 1);
  buildKorBody();
}

function korDodajKomad(){
  const duz = parseInt($("korNovaDuz").value);
  if(!duz || duz <= 0) return;
  if(!magState[korSifra]) magState[korSifra] = {komadi:[]};
  if(!magState[korSifra].komadi) magState[korSifra].komadi = [];
  magState[korSifra].komadi.push({duzina: String(duz)});
  magState[korSifra].komadi.sort((a,b)=>+b.duzina - +a.duzina);
  buildKorBody();
}

async function sacuvajKorekciju(){
  const razlog = $("korRazlog").value;
  let noviData;
  if(korTip === 'profil'){
    noviData = {komadi: magState[korSifra]?.komadi || []};
  } else {
    noviData = {
      kolicina: parseFloat($("korKolicina").value) || 0,
      minimum:  parseFloat($("korMinimum").value)  || 0,
    };
  }
  try {
    const res = await fetch(API_URL+'/magacin.php?action=korekcija', {
      method:'POST', headers:apiHeaders(),
      body: JSON.stringify({sifra: korSifra, data: noviData, razlog})
    });
    const json = await res.json();
    if(json.ok){
      if(!magState) magState = {};
      magState[korSifra] = noviData;
      closeKor();
      renderMagacin();
      return;
    }
  } catch(e){}
  alert('Greška pri čuvanju — proveri konekciju.');
}

const API_URL = 'https://app.aggroup.rs/api';

const ARCH_KEY = 'ag_arhiva';
const ARCH_FIELDS = ['sirina','dubina','zadnjaVisina','prednjaVisina','cev','stub',
  'sirinaRaja','kederTip','kornisSklop','cevMotora','bojaRal','bojaCerade',
  'autoInterval','brIntervala','svetalaPoKornizu','motor','celicnaOn',
  'parapetOn','parapetVisina',
  'brNaloga','kupac','adresa','datum','rok','radnik'];

function apiHeaders(){
  return {'Content-Type':'application/json','X-Api-Key': API_KEY};
}

async function saveOrder(){
  const btn = document.getElementById('btnSacuvaj');
  const orig = btn.textContent;
  btn.textContent = '⏳ Čuvam...';
  btn.disabled = true;

  const fields = {};
  ARCH_FIELDS.forEach(id => {
    const el = document.getElementById(id);
    if(!el) return;
    fields[id] = el.type==='checkbox' ? el.checked : el.value;
  });
  fields._steelRows = JSON.stringify(steelRows);

  const payload = {
    klijent:  [fields.brNaloga, fields.kupac].filter(Boolean).join(' · ') || '(bez naziva)',
    napomena: [fields.sirina&&fields.dubina ? fields.sirina+'×'+fields.dubina+'mm' : '', fields.datum].filter(Boolean).join(' · '),
    status:   'aktivan',
    input_data:  fields,
    result_data: null
  };

  try {
    const res = await fetch(API_URL+'/nalozi.php?action=save', {method:'POST', headers:apiHeaders(), body:JSON.stringify(payload)});
    const json = await res.json();
    if(json.ok){
      btn.textContent = '✓ Sačuvano';
      setTimeout(()=>{ btn.textContent=orig; btn.disabled=false; }, 1600);
      return;
    }
  } catch(e){}

  // fallback: localStorage kad nema interneta
  const entry = {id: Date.now(), savedAt: new Date().toLocaleString('sr-RS'), fields};
  const arch = JSON.parse(localStorage.getItem(ARCH_KEY)||'[]');
  arch.unshift(entry);
  localStorage.setItem(ARCH_KEY, JSON.stringify(arch));
  btn.textContent = '✓ Lokalno';
  setTimeout(()=>{ btn.textContent=orig; btn.disabled=false; }, 1600);
}

async function renderArchive(){
  const cont = document.getElementById('archList');
  cont.innerHTML = '<div class="arch-empty">⏳ Učitavam...</div>';

  const qs = archTab === 'proizvodnja' ? '&status=proizvodnja' : '';
  let arch = [];
  try {
    const res = await fetch(API_URL+'/nalozi.php?action=list'+qs, {headers:{'X-Api-Key': API_KEY}});
    const json = await res.json();
    if(json.ok) arch = json.data;
  } catch(e){
    // fallback na localStorage
    arch = JSON.parse(localStorage.getItem(ARCH_KEY)||'[]').map(o=>({
      id: o.id,
      klijent: [o.fields.brNaloga, o.fields.kupac].filter(Boolean).join(' · ') || '(bez naziva)',
      napomena: [o.fields.sirina&&o.fields.dubina ? o.fields.sirina+'×'+o.fields.dubina+'mm':'', o.fields.datum].filter(Boolean).join(' · '),
      created_at: o.savedAt,
      _local: true
    }));
  }

  if(!arch.length){
    cont.innerHTML = archTab === 'proizvodnja'
      ? '<div class="arch-empty">Još nijedan nalog nije pušten u proizvodnju.</div>'
      : '<div class="arch-empty">Nema sačuvanih naloga.<br>Klikni 💾 Sačuvaj da čuvaš trenutni nalog.</div>';
    return;
  }
  cont.innerHTML = arch.map(o=>{
    const naziv = o.klijent || '(bez naziva)';
    const opis  = o.napomena || '';
    const dat   = (o.created_at || '').substring(0,16).replace('T',' ');
    const local = o._local ? ' 📴' : '';
    const badge = o.status === 'proizvodnja' ? ' <span style="background:#2a3a28;color:#7dba8a;font-size:9px;padding:2px 6px;border-radius:3px;">🏭 PROIZVODNJA</span>' : '';
    return `<div class="arch-item">
      <div class="arch-item-head">
        <span class="arch-item-nr">${naziv}${local}${badge}</span>
        <span class="arch-item-date">${dat}</span>
      </div>
      <div class="arch-item-sub">${opis}</div>
      <div class="arch-item-acts">
        <button class="btn-xs btn-xs-load" onclick="loadOrder(${o.id})">Učitaj nalog</button>
        <button class="btn-xs btn-xs-del" onclick="deleteOrder(${o.id})">Obriši</button>
      </div>
    </div>`;
  }).join('');
}

async function loadOrder(id){
  let fields = null;

  try {
    const res = await fetch(API_URL+'/nalozi.php?action=get&id='+id, {headers:{'X-Api-Key': API_KEY}});
    const json = await res.json();
    if(json.ok) fields = json.data.input_data;
  } catch(e){}

  if(!fields){
    // fallback na localStorage
    const arch = JSON.parse(localStorage.getItem(ARCH_KEY)||'[]');
    const entry = arch.find(o=>o.id===id);
    if(entry) fields = entry.fields;
  }

  if(!fields) return;
  // backward compat: stari nalozi
  if(!fields.kederTip){
    const kv = fields.kornisVrsta || '';
    const o = fields.keder==='dvostrani' || kv[1]==='O';
    const s = fields.kornisTip==='sečeni' || kv[2]==='S';
    fields.kederTip    = o ? 'obostrani' : 'jednostrani';
    fields.kornisSklop = s ? 'seceni'    : 'jednodelni';
  }
  ARCH_FIELDS.forEach(fid=>{
    const el = document.getElementById(fid);
    if(!el) return;
    if(el.type==='checkbox') el.checked = !!fields[fid];
    else el.value = fields[fid]??'';
  });
  if(fields._steelRows){ steelRows=JSON.parse(fields._steelRows); renderSteelInputs(); }
  render();
  closeArchive();
}

async function deleteOrder(id){
  if(!confirm('Obrisati ovaj nalog iz arhive?')) return;
  try {
    await fetch(API_URL+'/nalozi.php?action=delete', {method:'POST', headers:apiHeaders(), body:JSON.stringify({id})});
  } catch(e){}
  renderArchive();
}

<script>
/* ───────── PROIZVODNJA — skidanje sa stanja magacina ───────── */
// pragovi otpada po šifri (mm) — ispod toga ostatak je otpad
const OTPAD_PRAG_DEFAULT = 2000;
const OTPAD_PRAG_MAP = {"10501":1500,"10475":1500,"10419":1500,"10414":1500};
function getOtpadPrag(sifra){ return OTPAD_PRAG_MAP[sifra] ?? OTPAD_PRAG_DEFAULT; }

let prodPlan = null; // čuva plan između pregleda i potvrde

function trazeniProfili(){
  // skupi sve aluminijumske pozicije trenutnog naloga: {sifra, naziv, duzina, kom}
  const I = {
    sirina:$("sirina").value, dubina:$("dubina").value,
    zadnjaVisina:$("zadnjaVisina").value, prednjaVisina:$("prednjaVisina").value,
    cev:$("cev").value, stub:$("stub").value, sirinaRaja:$("sirinaRaja").value,
    kederTip:$("kederTip").value,kornisSklop:$("kornisSklop").value, cevMotora:$("cevMotora").value,
    autoInterval:$("autoInterval").checked, brIntervala:$("brIntervala").value,
    svetalaPoKornizu:$("svetalaPoKornizu").value, celicnaOn:$("celicnaOn").checked,
    parapetOn:$("parapetOn").checked, parapetVisina:$("parapetVisina").value,
  };
  const R = compute(I);
  const alu = aluCalc(I, R);
  return alu.items
    .filter(it => it.kom > 0 && it.mera > 0)
    .map(it => ({sifra: it.prof.sifra, naziv: it.naziv, duzina: Math.round(it.mera), kom: it.kom}));
}

function planirajSecenje(trazeni, magacin){
  // Optimizovano sečenje: FFD bin-packing po šipki
  // Svaka šipka prima max moguće komade (od najvećeg naniže) pre nego što se uzme sledeća
  const stanje = {};
  for(const s in magacin){
    if(magacin[s].komadi) stanje[s] = magacin[s].komadi.map(k=>+k.duzina).filter(d=>d>0);
  }

  // koraci: {sifra, naziv, stockLen, cuts:[], ostatak, vracaSe, prag}
  const koraci = [], nedostaje = [];

  // Grupiši tražene komade po šifri profila
  const bySifra = {};
  trazeni.forEach(t => {
    if(!bySifra[t.sifra]) bySifra[t.sifra] = {naziv: t.naziv, cuts: []};
    for(let i = 0; i < t.kom; i++) bySifra[t.sifra].cuts.push(t.duzina);
  });

  for(const sifra in bySifra){
    const {naziv, cuts} = bySifra[sifra];
    cuts.sort((a, b) => b - a);  // najveći prvi (FFD)
    const stock = (stanje[sifra] || []).slice().sort((a, b) => b - a);
    const prag = getOtpadPrag(sifra);
    const remaining = cuts.slice();

    stock.forEach(stockLen => {
      if(!remaining.length) return;
      const cutsDone = [];
      let leftover = stockLen;
      let changed = true;
      // Pohlepno: ubaci što više komada (od najvećeg) u ovu šipku
      while(changed && remaining.length > 0){
        changed = false;
        for(let i = 0; i < remaining.length; i++){
          if(remaining[i] <= leftover){
            leftover -= remaining[i];
            cutsDone.push(remaining[i]);
            remaining.splice(i, 1);
            changed = true;
            break;  // počni ponovo od najvećeg preostalog
          }
        }
      }
      if(cutsDone.length > 0){
        const vracaSe = leftover >= prag;
        koraci.push({sifra, naziv, stockLen, cuts: cutsDone, ostatak: leftover, vracaSe, prag});
        const idx = stanje[sifra].indexOf(stockLen);
        if(idx !== -1) stanje[sifra].splice(idx, 1);
        if(vracaSe) stanje[sifra].push(leftover);
        stanje[sifra].sort((a, b) => b - a);
      }
    });

    remaining.forEach(duzina => nedostaje.push({sifra, naziv, duzina}));
  }

  return {koraci, nedostaje, novoStanje: stanje};
}

async function pustiUProizvodnju(){
  const body = document.getElementById('prodBody');
  document.getElementById('prodOverlay').classList.add('open');
  body.innerHTML = '⏳ Učitavam stanje magacina...';

  let magacin = null;
  try {
    const res = await fetch(API_URL+'/magacin.php?action=get', {headers:{'X-Api-Key': API_KEY}});
    const json = await res.json();
    if(json.ok) magacin = json.data;
  } catch(e){}

  if(!magacin){
    body.innerHTML = '<div style="color:#e07070;">❌ Ne mogu da učitam magacin — proveri internet konekciju.</div>';
    return;
  }

  const trazeni = trazeniProfili();
  if(!trazeni.length){
    body.innerHTML = '<div style="color:#e07070;">Nema profila u nalogu — unesi dimenzije pergole.</div>';
    return;
  }

  const plan = planirajSecenje(trazeni, magacin);
  prodPlan = {plan, magacin, brNaloga: $("brNaloga").value||'', kupac: $("kupac").value||'',
              datum: $("datum").value||'', radnik: $("radnik").value||''};

  let html = '';

  if(!plan.koraci.length && !plan.nedostaje.length){
    html += `<div style="color:#e07070;padding:16px 0;">
      ⚠ Magacin je prazan za ovaj nalog.<br>
      <span style="font-size:11px;color:#a09880;">Unesi stanje u tab <b>📦 Magacin</b> pa ponovo pokušaj.</span>
    </div>`;
  }

  if(plan.koraci.length){
    // Grupiši po šifri za pregled
    const bySifra = {};
    plan.koraci.forEach(k => {
      if(!bySifra[k.sifra]) bySifra[k.sifra] = {naziv: k.naziv, totalCuts: 0, pieces: []};
      bySifra[k.sifra].totalCuts += k.cuts.length;
      bySifra[k.sifra].pieces.push(k);
    });
    html += `<div style="font-weight:700;color:#7dba8a;margin-bottom:10px;">✓ SEČE SE SA STANJA</div>`;
    Object.entries(bySifra).forEach(([sifra, g]) => {
      html += `<div style="margin-bottom:12px;background:#161d16;border:1px solid #2e4a2e;border-radius:6px;overflow:hidden;">
        <div style="padding:7px 12px;background:#1e2e1e;font-weight:700;font-size:12px;color:#b8d8b0;">
          ${sifra} &nbsp;·&nbsp; ${g.naziv} &nbsp;·&nbsp; ${g.totalCuts} kom · ${g.pieces.length} šipki
        </div>`;
      g.pieces.forEach((k, pi) => {
        let cumLeft = k.stockLen;
        let cutsHtml = '';
        k.cuts.forEach((cut, ci) => {
          cumLeft -= cut;
          const intermed = ci < k.cuts.length - 1
            ? `<span style="color:#888;"> → ${cumLeft}mm</span>` : '';
          cutsHtml += `<span style="color:#fff;font-weight:700;">✂ ${cut}mm</span>${intermed} `;
        });
        const tag = k.ostatak > 0
          ? (k.vracaSe
              ? `<span style="color:#7dba8a;">→ ↩ ostaje <b>${k.ostatak}mm</b> (stanje)</span>`
              : `<span style="color:#e07a5f;">→ 🗑 otpad <b>${k.ostatak}mm</b></span>`)
          : `<span style="color:#7dba8a;">→ tačno</span>`;
        html += `<div style="padding:6px 12px;border-top:1px solid #2e3a2e;font-size:11px;color:#c0d8c0;">
          <span style="color:#888;font-size:10px;">Šipka ${pi+1} (${k.stockLen}mm):</span> &nbsp;
          ${cutsHtml} ${tag}
        </div>`;
      });
      html += `</div>`;
    });
  }

  if(plan.nedostaje.length){
    html += `<div style="font-weight:700;color:#e07070;margin:10px 0 6px;">⚠ NEMA NA STANJU — naručiti ili nova šipka</div>`;
    html += plan.nedostaje.map(n =>
      `<div style="padding:4px 0;border-bottom:1px solid #2e3138;font-size:11px;color:#e09080;">
        <b>${n.sifra}</b> ${n.naziv} — ${n.duzina} mm
      </div>`).join('');
  }

  if(plan.koraci.length){
    html += `<button class="btn btn-primary" style="width:100%;margin-top:14px;" onclick="potvrdiProizvodnju()">✓ POTVRDI — skini sa stanja</button>`;
  }
  html += `<button class="btn btn-secondary" style="width:100%;margin-top:8px;" onclick="closeProd()">Otkaži</button>`;
  body.innerHTML = html;
}

async function potvrdiProizvodnju(){
  if(!prodPlan) return;
  const body = document.getElementById('prodBody');
  body.innerHTML = '⏳ Ažuriram stanje...';

  const {plan, magacin} = prodPlan;
  // novo stanje: zameni komade profila novim, ostalo netaknuto
  const novoStanje = JSON.parse(JSON.stringify(magacin));
  for(const sifra in plan.novoStanje){
    novoStanje[sifra] = {komadi: plan.novoStanje[sifra].map(d=>({duzina:String(d)}))};
  }

  const log = plan.koraci.map(k => ({
    sifra: k.sifra, akcija: 'secenje',
    detalji: {stockLen: k.stockLen, cuts: k.cuts, ostatak: k.ostatak, vracaSe: k.vracaSe,
              nalog: prodPlan.brNaloga, kupac: prodPlan.kupac}
  }));

  try {
    const res = await fetch(API_URL+'/magacin.php?action=proizvodnja', {
      method:'POST', headers:apiHeaders(),
      body: JSON.stringify({state: novoStanje, log})
    });
    const json = await res.json();
    if(json.ok){
      const savedPlan = prodPlan; // čuvamo za print
      prodPlan = null;
      // upiši nalog u arhivu sa statusom 'proizvodnja' — tab „U proizvodnji"
      try {
        const fields = {};
        ARCH_FIELDS.forEach(id => {
          const el = document.getElementById(id);
          if(!el) return;
          fields[id] = el.type==='checkbox' ? el.checked : el.value;
        });
        fields._steelRows = JSON.stringify(steelRows);
        await fetch(API_URL+'/nalozi.php?action=save', {
          method:'POST', headers:apiHeaders(),
          body: JSON.stringify({
            klijent:  [fields.brNaloga, fields.kupac].filter(Boolean).join(' · ') || '(bez naziva)',
            napomena: [fields.sirina&&fields.dubina ? fields.sirina+'×'+fields.dubina+'mm' : '', fields.datum].filter(Boolean).join(' · '),
            status:   'proizvodnja',
            input_data:  fields,
            result_data: {koraci: savedPlan.plan.koraci}
          })
        });
      } catch(e){}
      body.innerHTML = `
        <div style="color:#7dba8a;font-weight:700;font-size:14px;padding:14px 0 10px;text-align:center;">
          ✓ Stanje magacina ažurirano!
          <div style="font-weight:400;font-size:11px;color:#a09880;margin-top:4px;">
            ${plan.koraci.length} sečenja skinuto sa stanja, upisano u istoriju.
          </div>
        </div>
        <button class="btn btn-primary" style="width:100%;margin-bottom:8px;" onclick="printProizvodnja()">🖨 Štampaj / Sačuvaj PDF listu sečenja</button>
        <button class="btn btn-secondary" style="width:100%;" onclick="closeProd()">Zatvori</button>`;
      // sačuvaj plan za print funkciju
      window._lastProdPlan = savedPlan;
      return;
    }
  } catch(e){}
  body.innerHTML = '<div style="color:#e07070;">❌ Greška pri čuvanju — pokušaj ponovo.</div>'
    + '<button class="btn btn-secondary" style="width:100%;margin-top:8px;" onclick="closeProd()">Zatvori</button>';
}

function closeProd(){
  document.getElementById('prodOverlay').classList.remove('open');
  prodPlan = null;
}

function printProizvodnja(){
  const p = window._lastProdPlan;
  if(!p) return;
  const {plan, brNaloga, kupac, datum, radnik} = p;

  // Grupiši po šifri
  const bySifra = {};
  plan.koraci.forEach(k => {
    if(!bySifra[k.sifra]) bySifra[k.sifra] = {naziv: k.naziv, pieces: [], totalCuts: 0};
    bySifra[k.sifra].pieces.push(k);
    bySifra[k.sifra].totalCuts += k.cuts.length;
  });

  let sections = '';
  Object.entries(bySifra).forEach(([sifra, g]) => {
    let rows = '';
    g.pieces.forEach((k, pi) => {
      const barW = 420;  // px width of bar
      let barHtml = '';
      let cumPct = 0;
      const colors = ['#a9743c','#c0943c','#d4a84c','#b88030','#9a6828'];
      k.cuts.forEach((cut, ci) => {
        const pct = (cut / k.stockLen * 100).toFixed(2);
        const color = colors[ci % colors.length];
        barHtml += `<div style="width:${pct}%;background:${color};height:100%;display:inline-block;vertical-align:top;position:relative;" title="${cut}mm">
          <span style="position:absolute;left:50%;transform:translateX(-50%);font-size:8px;color:#fff;white-space:nowrap;top:3px;font-weight:700;">${cut}</span>
        </div>`;
        cumPct += parseFloat(pct);
      });
      const otpadPct = (100 - cumPct).toFixed(2);
      if(k.ostatak > 0){
        const otpadColor = k.vracaSe ? '#3a7a4a' : '#bbb';
        barHtml += `<div style="width:${otpadPct}%;background:${otpadColor};height:100%;display:inline-block;vertical-align:top;position:relative;" title="${k.ostatak}mm ${k.vracaSe?'vraća se':'otpad'}">
          <span style="position:absolute;left:50%;transform:translateX(-50%);font-size:7px;color:#fff;white-space:nowrap;top:4px;">${k.ostatak}mm</span>
        </div>`;
      }

      const ostatakTxt = k.ostatak > 0
        ? (k.vracaSe ? `<span style="color:#2a6a3a;font-weight:700;">↩ ${k.ostatak} mm → VRAĆA SE</span>` : `<span style="color:#999;">🗑 ${k.ostatak} mm → otpad</span>`)
        : '<span style="color:#2a6a3a;">tačno</span>';

      rows += `<tr>
        <td style="font-size:11px;color:#555;padding:4px 8px;">${pi+1}.</td>
        <td style="padding:4px 8px;">
          <div style="font-weight:700;font-size:11px;color:#333;margin-bottom:4px;">
            Uzmi: <span style="font-size:14px;color:#191814;">${k.stockLen} mm</span>
            &nbsp;→&nbsp; ${k.cuts.length} ${k.cuts.length===1?'komad':'komada'}:
            <span style="font-weight:400;">${k.cuts.join(' + ')} mm</span>
          </div>
          <div style="height:22px;background:#eee;border-radius:3px;overflow:hidden;position:relative;width:100%;">
            ${barHtml}
          </div>
        </td>
        <td style="padding:4px 8px;font-size:11px;">${ostatakTxt}</td>
        <td style="text-align:center;font-size:20px;padding:4px 8px;border-left:1px solid #ccc;">☐</td>
      </tr>`;
    });

    sections += `
      <div style="margin-bottom:20px;page-break-inside:avoid;">
        <div style="background:#191814;color:#fff;padding:7px 12px;border-radius:4px 4px 0 0;display:flex;justify-content:space-between;align-items:center;">
          <span style="font-size:13px;font-weight:700;letter-spacing:.04em;">${sifra} &nbsp;·&nbsp; ${g.naziv}</span>
          <span style="font-size:11px;color:#c0b080;">${g.totalCuts} komada · ${g.pieces.length} šipki</span>
        </div>
        <table style="width:100%;border-collapse:collapse;border:1px solid #ddd;border-top:none;">
          <thead>
            <tr style="background:#f0ede5;">
              <th style="width:28px;padding:4px 8px;font-size:10px;text-align:center;">#</th>
              <th style="padding:4px 8px;font-size:10px;text-align:left;">Šipka → rezovi (vizuelno)</th>
              <th style="width:160px;padding:4px 8px;font-size:10px;">Ostatak</th>
              <th style="width:38px;padding:4px 8px;font-size:10px;text-align:center;">✓</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
  });

  let nedTxt = '';
  if(plan.nedostaje.length){
    nedTxt = `<div style="margin-top:16px;padding:10px 12px;background:#fff3f0;border:2px solid #e07070;border-radius:4px;">
      <b style="color:#c0392b;font-size:12px;">⚠ NEMA NA STANJU — naručiti ili uzeti iz nove šipke:</b><br><br>
      ${plan.nedostaje.map(n=>`<span style="display:inline-block;background:#fce;border:1px solid #e07070;border-radius:3px;padding:3px 8px;margin:2px;font-size:11px;"><b>${n.sifra}</b> ${n.naziv} — ${n.duzina} mm</span>`).join('')}
    </div>`;
  }

  const datumStr = datum || new Date().toLocaleDateString('sr-RS');
  const totalKomada = plan.koraci.reduce((a,k)=>a+k.cuts.length, 0);
  const totalSipki = plan.koraci.length;

  const w = window.open('','_blank');
  w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8">
  <title>Lista sečenja — ${brNaloga||'Nalog'}</title>

    .doc-sub{font-size:10px;color:#888;text-align:right;margin-top:3px;}
    .meta-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px;background:#f6f4ee;border:1px solid #e0dcd0;border-radius:5px;padding:10px 12px;}
    .meta-cell .k{font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:#888;font-weight:700;}

    .stat-bar{display:flex;gap:16px;margin-bottom:16px;font-size:11px;color:#555;}
