<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#191814" />
<meta name="description" content="AG GROUP — Radni nalog za sečenje i obračun giljotina sistema (GIO NOR)" />
<title>AG GROUP — Giljotina · radni nalog</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fjalla+One&family=Hanken+Grotesk:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500;600&display=swap');
  /* Isti izgled kao program za pergole: tamna radna površina, papirni nalog, bronzani akcenat */
  :root{
    --shell:#15171b; --shell2:#1e2127; --line:#33373f; --muted:#888;
    --paper:#f6f4ee; --paper2:#ebe7db; --ink:#191814;
    --bronze:#a9743c; --bronzeD:#8a5d2e; --ok:#3f7a4d; --warn:#bd4a2a; --info:#2f5f8f;
  }
  *{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--shell);font-family:'Hanken Grotesk',sans-serif;}

  .topbar{background:var(--ink);padding:12px 16px;display:flex;align-items:center;
    justify-content:space-between;gap:10px;position:sticky;top:0;z-index:50;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:10px;}
  .logo{padding:3px 8px;border:2px solid var(--bronze);border-radius:4px;
    font-family:'Fjalla One',sans-serif;color:var(--bronze);font-size:16px;}
  .brand-t{font-family:'Fjalla One',sans-serif;font-size:16px;color:#fff;letter-spacing:.04em;line-height:1;}
  .brand-s{font-size:9.5px;color:var(--muted);letter-spacing:.08em;margin-top:2px;}
  .topbar-actions{display:flex;gap:6px;flex-wrap:wrap;}
  .btn{border:0;padding:10px 14px;border-radius:5px;font-family:'Fjalla One',sans-serif;
    font-size:13px;letter-spacing:.04em;cursor:pointer;white-space:nowrap;}
  .btn-primary{background:var(--bronze);color:#fff;}
  .btn-primary:active{background:var(--bronzeD);}
  .btn-secondary{background:#2a2d34;color:#fff;border:1px solid var(--line);}
  .btn-secondary.active{background:var(--bronze);border-color:var(--bronze);}
  .btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--bronze);outline-offset:1px;}

  .panel{max-width:820px;margin:14px auto 0;padding:0 14px;}
  .card-in{background:var(--shell2);border:1px solid var(--line);border-radius:10px;padding:14px;}
  .grp{font-family:'Fjalla One',sans-serif;font-size:13px;color:var(--bronze);letter-spacing:.07em;margin:14px 0 8px;}
  .grp:first-child{margin-top:0;}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  @media(min-width:560px){.row{grid-template-columns:1fr 1fr 1fr;}}
  label{display:block;}
  .lbl{font-weight:700;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:#d8d4c4;}
  .sub{font-size:9.5px;color:var(--muted);margin:1px 0 3px;}
  input,select{width:100%;margin-top:2px;padding:9px 10px;background:#101216;
    border:1px solid var(--line);border-radius:5px;color:#fff;
    font-family:'Hanken Grotesk',sans-serif;font-size:14px;}
  input[type=number]{font-family:'Spline Sans Mono',monospace;font-size:15px;}
  input::placeholder{color:#5c606b;}
  select option{background:#1e2127;}
  .hint{text-align:center;color:var(--muted);font-size:11px;margin:10px 0 4px;}
  .sistem-izbor{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .sistem-izbor label{display:flex;gap:9px;align-items:flex-start;background:#101216;border:1px solid var(--line);
    border-radius:7px;padding:10px 11px;cursor:pointer;}
  .sistem-izbor input{width:auto;margin:3px 0 0;accent-color:var(--bronze);}
  .sistem-izbor b{display:block;color:#fff;font-size:13px;}
  .sistem-izbor small{display:block;color:var(--muted);font-size:10.5px;margin-top:2px;line-height:1.35;}
  .sistem-izbor label:has(input:checked){border-color:var(--bronze);background:#1c1813;}

  /* DOKUMENT */
  .doc{max-width:820px;margin:18px auto 50px;background:var(--paper);
    box-shadow:0 18px 45px rgba(0,0,0,.5);padding:22px 22px;color:var(--ink);}
  .doc-head{display:flex;justify-content:space-between;align-items:flex-start;
    border-bottom:3px solid var(--ink);padding-bottom:11px;gap:10px;}
  .doc-title{font-family:'Fjalla One',sans-serif;font-size:27px;letter-spacing:.02em;line-height:.95;}
  .doc-sub{font-family:'Fjalla One',sans-serif;font-size:12px;color:var(--bronze);letter-spacing:.16em;margin-top:3px;}
  .doc-meta{text-align:right;font-family:'Spline Sans Mono',monospace;font-size:10.5px;line-height:1.65;}
  .badge{background:var(--ink);color:#fff;padding:3px 7px;border-radius:3px;display:inline-block;font-weight:600;font-size:9.5px;}
  .badge.obracun{background:var(--bronze);}
  .info-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:11px;}
  @media(max-width:480px){.info-row{grid-template-columns:1fr;}}
  .card{background:var(--paper2);padding:9px 11px;border-radius:5px;}
  .card-t{font-family:'Fjalla One',sans-serif;font-size:10.5px;letter-spacing:.09em;color:var(--bronzeD);}
  .mono{font-family:'Spline Sans Mono',monospace;}
  .dims{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:11px;}
  @media(max-width:480px){.dims{grid-template-columns:1fr 1fr;}}
  .dim{background:var(--ink);color:#fff;padding:6px 7px;border-radius:4px;}
  .dim-k{font-size:8.5px;letter-spacing:.06em;color:#b9b3a0;}
  .dim-v{font-family:'Spline Sans Mono',monospace;font-weight:600;font-size:14px;}
  .calc-line{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-family:'Spline Sans Mono',monospace;font-size:11px;}

  .sec{margin-top:20px;}
  .sec-h{display:flex;align-items:baseline;gap:8px;border-bottom:2px solid var(--ink);padding-bottom:3px;margin-bottom:8px;}
  .sec-n{font-family:'Spline Sans Mono',monospace;font-weight:600;font-size:10.5px;background:var(--ink);color:#fff;padding:2px 6px;border-radius:3px;}
  .sec-n.acc{background:var(--bronze);}
  .sec-t{margin:0;font-family:'Fjalla One',sans-serif;font-size:16px;letter-spacing:.02em;text-transform:uppercase;}
  .sec-x{margin-left:auto;font-family:'Spline Sans Mono',monospace;font-size:11px;color:#5a5446;}

  .tw{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;}
  th{font-weight:700;font-size:10px;letter-spacing:.03em;text-transform:uppercase;color:#fff;background:var(--ink);padding:5px 7px;text-align:left;border-right:1px solid #43403a;}
  td{padding:5px 7px;border-bottom:1px solid var(--paper2);font-size:12px;vertical-align:middle;}
  td.m{font-family:'Spline Sans Mono',monospace;font-weight:500;}
  tbody tr:nth-child(even):not(.obr-sum):not(.obr-total){background:#efebe0;}
  .chk{width:14px;height:14px;border:1.5px solid #9a927c;border-radius:3px;display:inline-block;}
  .thumb{width:68px;height:50px;object-fit:contain;background:#fff;border:1px solid #d8d1bd;border-radius:4px;padding:2px;display:block;cursor:zoom-in;}
  @media(max-width:640px){.thumb{width:54px;height:40px;}}
  .sif{font-family:'Spline Sans Mono',monospace;font-size:9.5px;color:#7a7361;margin-bottom:2px;}
  .nap{font-size:10px;color:#5a5446;margin-top:1px;}
  .oz{display:inline-block;font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:3px;margin-left:5px;vertical-align:1px;background:#e3d6c3;color:#6b4a22;}
  .mera{font-family:'Spline Sans Mono',monospace;font-weight:600;font-size:14px;white-space:nowrap;}
  .kom{font-family:'Spline Sans Mono',monospace;font-weight:700;font-size:14px;text-align:center;}

  .box-cut{border:2px solid var(--ink);border-radius:6px;padding:10px 12px;}
  .box-cut-t{font-family:'Fjalla One',sans-serif;font-size:11px;letter-spacing:.05em;}
  .box-cut-v{font-family:'Spline Sans Mono',monospace;font-weight:600;font-size:22px;color:var(--bronze);}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(max-width:560px){.two{grid-template-columns:1fr;}}
  .note{border-radius:5px;padding:7px 10px;font-size:11.5px;margin-top:8px;line-height:1.45;}
  .note-ok{background:#e7efe6;border:1px solid var(--ok);}
  .note-warn{background:#f6e7df;border:1px solid var(--warn);}
  .note-info{background:#e5edf5;border:1px solid var(--info);}
  .sema{background:#fff;border:1px solid var(--paper2);border-radius:6px;padding:8px;}
  .sema svg{display:block;width:100%;height:auto;}

  ol.napomene{margin:0;padding-left:18px;font-size:11.5px;line-height:1.6;}
  .potpisi{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:22px;}
  .potpis{border-top:1px solid var(--ink);padding-top:5px;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#5a5446;}
  .potpis-l{margin-top:14px;font-weight:400;color:var(--muted);}
  .foot{margin-top:16px;border-top:1px solid var(--paper2);padding-top:6px;font-family:'Spline Sans Mono',monospace;font-size:9px;color:var(--muted);text-align:center;}

  /* OBRAČUN */
  .obr-sum{background:#191814;color:#fff;}
  .obr-sum td{border:0;font-weight:700;padding:7px 8px;font-size:13px;}
  .obr-total{background:var(--bronze);color:#fff;}
  .obr-total td{border:0;font-weight:700;padding:9px 10px;font-size:15px;}
  .obr-total td.amt{font-family:'Spline Sans Mono',monospace;font-size:18px;}
  .euro{font-family:'Spline Sans Mono',monospace;font-weight:600;text-align:right;white-space:nowrap;}
  .obr-warning{background:#fbe9b6;border:1px solid #c2933a;color:#5e4413;padding:8px 12px;border-radius:5px;font-size:11.5px;margin:10px 0;line-height:1.45;}
  .cene{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 10px;}
  .cene label{background:var(--paper2);border-radius:5px;padding:6px 8px;}
  .cene span{display:block;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#5a5446;}
  .cene input{background:#fff;color:var(--ink);border:1px solid #cfc7b2;font-size:14px;padding:6px 8px;}
  .cene input.prazno{border-color:var(--warn);background:#fff6f2;}
  .cene small{display:block;font-size:9.5px;color:#7a7361;margin-top:2px;}

  /* Kartica troška */
  .kartica{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:0;margin-top:12px;border-radius:7px;overflow:hidden;border:2px solid var(--ink);break-inside:avoid;}
  @media(max-width:600px){.kartica{grid-template-columns:1fr;}}
  .kart-gl{background:var(--ink);color:#fff;padding:14px 16px;display:flex;flex-direction:column;gap:2px;}
  .kart-k{font-family:'Fjalla One',sans-serif;font-size:12px;letter-spacing:.14em;color:#d9b48a;}
  .kart-v{font-family:'Spline Sans Mono',monospace;font-weight:600;font-size:30px;line-height:1.15;}
  .kart-s{font-size:11px;color:#b9b3a0;}
  .kart-mini{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:auto;padding-top:12px;border-top:1px solid #3a3730;}
  .kart-mini span{display:block;font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:#b9b3a0;}
  .kart-mini b{font-family:'Spline Sans Mono',monospace;font-size:13px;font-weight:600;}
  .kart-gr{background:#fff;padding:12px 14px;display:flex;flex-direction:column;gap:8px;}
  .kg-t{display:flex;justify-content:space-between;gap:8px;align-items:baseline;font-size:12px;}
  .kg-t span{font-weight:700;}
  .kg-t small{font-weight:400;color:#7a7361;margin-left:6px;font-size:10.5px;}
  .kg-t b{font-family:'Spline Sans Mono',monospace;font-weight:600;white-space:nowrap;}
  .kg-bar{height:6px;background:var(--paper2);border-radius:3px;overflow:hidden;margin-top:3px;}
  .kg-bar i{display:block;height:100%;background:var(--bronze);border-radius:3px;}
  .kg-nula .kg-t b{color:var(--warn);font-family:'Hanken Grotesk',sans-serif;font-size:11px;}
  .kg-fale{font-size:11px;line-height:1.45;background:#f6e7df;border:1px solid var(--warn);border-radius:5px;padding:6px 9px;margin-top:2px;}
  .kg-fale.kg-ok{background:#e7efe6;border-color:var(--ok);}

  /* ARHIVA */
  .arch-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;}
  .arch-overlay.open{display:flex;justify-content:flex-end;}
  .arch-panel{background:var(--shell2);border-left:1px solid var(--line);width:min(400px,100vw);height:100vh;overflow-y:auto;}
  .arch-head{background:var(--ink);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;}
  .arch-head-t{font-family:'Fjalla One',sans-serif;color:var(--bronze);font-size:15px;letter-spacing:.05em;}
  .arch-close{background:none;border:none;color:#aaa;font-size:20px;cursor:pointer;padding:4px 8px;line-height:1;}
  .arch-empty{padding:40px 20px;color:var(--muted);text-align:center;font-size:13px;line-height:1.5;}
  .arch-item{padding:13px 16px;border-bottom:1px solid var(--line);}
  .arch-item b{font-family:'Fjalla One',sans-serif;color:#fff;font-size:13px;font-weight:400;}
  .arch-item small{display:block;font-size:11px;color:#a09880;margin:3px 0 9px;}
  .btn-xs{border:0;padding:5px 11px;border-radius:4px;font-family:'Fjalla One',sans-serif;font-size:11px;cursor:pointer;letter-spacing:.03em;}
  .btn-xs-load{background:var(--bronze);color:#fff;}
  .btn-xs-del{background:#2e1a1a;color:#e07070;border:1px solid #5a2020;margin-left:6px;}

  #imgZoom{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:300;align-items:center;justify-content:center;flex-direction:column;gap:10px;cursor:zoom-out;}
  #imgZoom img{max-width:90vw;max-height:75vh;background:#fff;border-radius:8px;padding:14px;}
  #imgZoom div{color:#eee;font-size:14px;}

  @media print{
    @page{margin:10mm;}
    html,body{background:#fff;}
    .no-print{display:none!important;}
    .doc{box-shadow:none!important;margin:0!important;max-width:100%!important;padding:0!important;}
    .sec-h{break-after:avoid;} tr{break-inside:avoid;} thead{display:table-header-group;}
    .card,.box-cut,.note,.potpisi,.sema{break-inside:avoid;}
  }
</style>
</head>
<body>

<div class="topbar no-print">
  <div class="brand">
    <div class="logo">AG</div>
    <div>
      <div class="brand-t">AG GROUP · GILJOTINA</div>
      <div class="brand-s">PROGRAM ZA SEČENJE GIO NOR + OBRAČUN</div>
    </div>
  </div>
  <div class="topbar-actions">
    <button class="btn btn-secondary active" id="btnNalog" onclick="prikaz('nalog')">Nalog</button>
    <button class="btn btn-secondary" id="btnObracun" onclick="prikaz('obracun')">Obračun</button>
    <button class="btn btn-secondary" id="btnSacuvaj" onclick="sacuvaj()">💾 Sačuvaj</button>
    <button class="btn btn-secondary" onclick="otvoriArhivu()">📁 Arhiva</button>
    <button class="btn btn-primary" onclick="window.print()">⎙ PDF</button>
  </div>
</div>

<div class="panel no-print" id="unos">
  <div class="card-in">
    <div class="grp">① SISTEM</div>
    <div class="sistem-izbor">
      <label><input type="radio" name="sistem" id="sistemSil" value="silinebilir">
        <span><b>Brisiva giljotina</b><small>Silinebilir · gornja krila se obaraju za pranje stakla</small></span></label>
      <label><input type="radio" name="sistem" id="sistemSab" value="sabit" checked>
        <span><b>Fiksna giljotina</b><small>Sabit · staklena polja bez krila</small></span></label>
    </div>

    <div class="grp">② MERE OTVORA (mm)</div>
    <div class="row">
      <label><div class="lbl">Širina</div><div class="sub">ukupna širina sistema</div>
        <input type="number" id="sirina" value="3000" min="0" step="1"></label>
      <label><div class="lbl">Visina</div><div class="sub">ukupna visina sistema</div>
        <input type="number" id="visina" value="3000" min="0" step="1"></label>
      <label><div class="lbl">Broj sistema</div><div class="sub">istih giljotina u nalogu</div>
        <input type="number" id="kom" value="1" min="1" step="1"></label>
    </div>

    <div class="grp">③ STAKLO · POGON · BOJA</div>
    <div class="row">
      <label><div class="lbl">Staklo</div><div class="sub">utiče na meru stakla i profil Gio-16</div>
        <select id="staklo"><option value="ISICAM" selected>Termopan 4/16/4</option><option value="TEKCAM">Jednostruko 8 mm</option></select></label>
      <label><div class="lbl">Pogon</div><div class="sub">set okova</div>
        <select id="pogon"><option value="ZINCIRLI" selected>Lanac</option><option value="KAYISLI">Kaiš</option></select></label>
      <label><div class="lbl">Boja (RAL)</div><div class="sub">važi za sve profile</div>
        <input type="text" id="ral" value="7016" placeholder="npr. 7016"></label>
    </div>

    <div class="grp">④ PODACI ZA NALOG</div>
    <div class="row">
      <label><div class="lbl">Broj naloga</div><input type="text" id="brNaloga" placeholder="G-2026-001"></label>
      <label><div class="lbl">Kupac / firma</div><input type="text" id="kupac" placeholder="ime / firma"></label>
      <label><div class="lbl">Adresa</div><input type="text" id="adresa" placeholder="adresa montaže"></label>
      <label><div class="lbl">Datum</div><input type="date" id="datum"></label>
      <label><div class="lbl">Rok isporuke</div><input type="date" id="rok"></label>
      <label><div class="lbl">Zadužen radnik</div><input type="text" id="radnik" placeholder="ime radnika"></label>
    </div>
  </div>
  <div class="hint">Unesi mere → <b style="color:#cfcabb">Nalog</b> ili <b style="color:#cfcabb">Obračun</b> → <b style="color:#cfcabb">⎙ PDF</b>. Radi i bez interneta. <span id="ver" style="opacity:.55"></span></div>
</div>

<div class="doc" id="doc"></div>

<div class="arch-overlay no-print" id="arhiva" onclick="if(event.target===this)zatvoriArhivu()">
  <div class="arch-panel">
    <div class="arch-head"><span class="arch-head-t">📁 ARHIVA GILJOTINA</span><button class="arch-close" onclick="zatvoriArhivu()" aria-label="Zatvori">✕</button></div>
    <div id="arhivaLista"></div>
  </div>
</div>
<div id="imgZoom" class="no-print" onclick="this.style.display='none'"><img id="imgZoomPic" alt=""><div id="imgZoomCap"></div></div>

  "Gio-16": {naziv:"Profil jednostrukog stakla", kgm:0.294},
  "Gio-17": {naziv:"Profil krila",           kgm:1.295},
  "10417":  {naziv:"Cev motora (tambur)",    kgm:1.071},
};
const BADEM_OD = 3700;      // od ove širine ulazi bademasti kenet
const GUSTINA_STAKLA = 2.5; // kg po m² po mm debljine

/* ───────── helperi ───────── */
const $ = id => document.getElementById(id);
const r2 = n => Math.round(n*100)/100;
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mm = n => { const v=Math.round(n*10)/10; return (Number.isInteger(v)?String(v):v.toFixed(1).replace('.',',')); };
const br = (n,d=2) => (Math.round(n*10**d)/10**d).toFixed(d).replace('.',',').replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const eur = n => br(n,2)+" €";
const datumSr = s => /^\d{4}-\d{2}-\d{2}$/.test(s||'') ? s.split('-').reverse().join('.')+'.' : (s||'—');

/* ───────── JEZGRO — tačno po kalkulatoru Gio Nor Hesaplama Tablosu ─────────
   W širina, H visina, n broj sistema. Svaka pozicija nosi i oznaku reda iz Excela. */
function proracun(I){
  const W=+I.sirina||0, H=+I.visina||0, n=Math.max(1,Math.round(+I.kom||1));
  const sil = I.sistem==="silinebilir";
  const tek = I.staklo==="TEKCAM";
  const siroko = W > BADEM_OD-1;          // Excel: F12>3699
  const P = [];  // {sif, mera, kom, nap, oz}
  const add = (sif, mera, kom, nap, oz) => P.push({sif, mera, kom, nap:nap||"", oz:oz||""});
  let vb, staklo;

  if(sil){
    vb = (H-186)/3 + 11;                            // F38 vertikalna baza
    const rukohvat = W-176, krilo = vb-20.33;
    add("Gio-01", W-16, n, "širina − 16");
    add("Gio-02", W-17, n, "šasija − 1");
    add("Gio-03", H-155, 2*n, "visina − 155");
    add("Gio-04", H-158, 2*n, "bočni ram − 3");
    add("Gio-05", H-187.667-vb, 2*n, "visina − 187,67 − vertikalna baza");
    add("Gio-06", W-30, n, "širina − 30");
    add("Gio-07", rukohvat, n, "širina − 176");
    add("Gio-08", siroko?rukohvat:0, siroko?n:0, "samo od 3700 mm širine", "široko");
    add("Gio-08", siroko?rukohvat+8:0, siroko?n:0, "gornji kenet otvarajućeg stakla, od 3700 mm", "široko");
    add("Gio-11", rukohvat+8, siroko?0:n, "gornji kenet otvarajućeg stakla");
    add("Gio-11", rukohvat, siroko?2*n:3*n, "rukohvat");
    add("Gio-10", rukohvat, n, "rukohvat");
    add("Gio-10", rukohvat+8, n, "donja baza otvarajućeg stakla");
    add("Gio-12", vb, 4*n, "(visina − 186) / 3 + 11");
    add("Gio-13", vb+16, 2*n, "vertikalna baza + 16");
    add("Gio-15", vb+16, 2*n, "vertikalna baza + 16");
    add("Gio-17", krilo, 2*n, "vertikalna baza − 20,33");
    add("10417",  W-65, n, "širina − 65");
    if(tek){
      add("Gio-16", rukohvat, (siroko?n:0)+(siroko?2*n:3*n)+n, "u kenet + bazu", "8 mm");
      add("Gio-16", vb, 4*n, "u vertikalnu bazu", "8 mm");
      add("Gio-16", krilo, 2*n, "u krilo", "8 mm");
    }
    staklo = { s: tek?W-141:W-138, v: tek?vb-24.33:vb-21.33, kom:3*n };
  } else {
    vb = (H-155)/3;                                 // F35 vertikalna baza
    const rukohvat = W-176;
    add("Gio-01", W-16, n, "širina − 16");
    add("Gio-02", W-17, n, "šasija − 1");
    add("Gio-03", H-155, 2*n, "visina − 155");
    add("Gio-04", H-155, 2*n, "= bočni ram");
    add("Gio-05", H-155, 2*n, "= bočni ram");
    add("Gio-06", W-30, n, "širina − 30");
    add("Gio-07", rukohvat, n, "širina − 176");
    add("Gio-08", siroko?rukohvat:0, siroko?2*n:0, "samo od 3700 mm širine", "široko");
    add("Gio-11", rukohvat, siroko?2*n:4*n, "rukohvat");
    add("Gio-10", rukohvat, 2*n, "rukohvat");
    add("Gio-12", vb, 6*n, "(visina − 155) / 3");
    add("Gio-15", vb+993.3333, 2*n, "vertikalna baza + 993,33");
    add("10417",  W-60, n, "širina − 60");
    if(tek){
      add("Gio-16", rukohvat, (siroko?2*n:0)+(siroko?2*n:4*n)+2*n, "u kenet + bazu", "8 mm");
      add("Gio-16", vb, 6*n, "u vertikalnu bazu", "8 mm");
    }
    staklo = { s: tek?W-143:W-140, v: tek?vb-26:vb-23, kom:3*n };
  }

  P.forEach(p => { p.kg = (p.mera/1000)*p.kom*PROFIL[p.sif].kgm; });
  const aktivni = P.filter(p => p.kom>0 && p.mera>0);
  const kg = aktivni.reduce((a,p)=>a+p.kg,0);

  // pomoćne veličine za okov (iste ćelije kao u Excelu)
  const f = sif => P.filter(p=>p.sif===sif);
  const len = p => p.mera*p.kom;
  let fitilj;
  if(sil){
    // ((F27·G27)+(F28·G28·2)+(F29·G29·3)+(F30·G30)+(F32·G32·2)+(F35·G35·2)+(F41·G41))/1000
    fitilj = ( len(f("Gio-03")[0]) + 2*len(f("Gio-04")[0]) + 3*len(f("Gio-05")[0]) + len(f("Gio-06")[0])
             + 2*len(f("Gio-08")[0]) + 2*len(f("Gio-11")[1]) + len(f("Gio-17")[0]) )/1000;
  } else {
    // ((F27·G27)+(F28·G28·2)+(F29·G29·3)+(F30·G30)+(F32·G32·2)+(F33·G33·2))/1000
    fitilj = ( len(f("Gio-03")[0]) + 2*len(f("Gio-04")[0]) + 3*len(f("Gio-05")[0]) + len(f("Gio-06")[0])
             + 2*len(f("Gio-08")[0]) + 2*len(f("Gio-11")[0]) )/1000;
  }
  const m2 = staklo.s*staklo.v*staklo.kom/1e6;
  const debljina = 8;               // 8 mm stakla u oba slučaja (4/16/4 = 4+4 stakla + 16 vazduha)
  const OK = [
    {id:"set",    naziv:I.pogon==="ZINCIRLI"?"Set okova — lanac":"Set okova — kaiš", kol:n, jed:"set", nap:"po sistemu"},
    {id:"vuca",   naziv:I.pogon==="ZINCIRLI"?"Lanac":"Kaiš", kol:5*n, jed:"m", nap:"5 m po sistemu"},
    {id:"zapRam", naziv:"Zaptivka rama", kol:(W-16)*n/1000, jed:"m", nap:"dužina šasije"},
  ];
  if(sil) OK.push({id:"zapKrilo", naziv:"Zaptivka krila", kol:(vb-20.33)*2*n/1000, jed:"m", nap:"dužina profila krila × 2"});
  OK.push(
    {id:"fitilj", naziv:"Četkasti fitilj", kol:fitilj, jed:"m", nap:"ramovi, šine i keneti"},
    {id:"motor",  naziv:"Motor", kol:n, jed:"kom", nap:"po sistemu"},
    {id:"daljinski", naziv:"Daljinski upravljač", kol:n, jed:"kom", nap:"po sistemu"},
    {id:"staklo", naziv:tek?"Staklo 8 mm":"Termopan 4/16/4", kol:m2, jed:"m²", nap:"3 polja po sistemu"},
  );

  return { W,H,n,sil,tek,siroko,vb, P, aktivni, kg, staklo, m2,
           tezinaPolja: staklo.s*staklo.v/1e6*debljina*GUSTINA_STAKLA,
           OK };
}

/* ───────── PROVERE (samo činjenice koje proizlaze iz kalkulatora) ───────── */
function provere(R){
  const out=[];
  if(R.W<=0||R.H<=0) out.push(["warn","Unesi širinu i visinu sistema."]);
  if(R.siroko) out.push(["info",`Širina ${R.W} mm — od ${BADEM_OD} mm naviše ulazi bademasti kenet Gio-08, a običnih keneta je manje.`]);
  if(R.staklo.v<=0||R.staklo.s<=0) out.push(["warn","Mera stakla je nula ili negativna — proveri visinu i širinu."]);
  if(R.P.some(p=>p.kom>0&&p.mera<0)) out.push(["warn","Neka mera sečenja je negativna — sistem je premali za ove profile."]);
  if(!R.sil && Math.round(R.H)!==3000) out.push(["warn",`Poklopac rama (Gio-15) računa se kao vertikalna baza + 993,33 mm. Ta konstanta odgovara visini 3000 mm; na visini ${R.H} mm proveri meru pre sečenja.`]);
  if(R.tek) out.push(["info","Jednostruko staklo 8 mm — dodaje se profil Gio-16 u kenet, bazu i vertikalnu bazu."]);
  return out;
}

/* ───────── ŠEMA — pogled spreda, u razmeri ───────── */
function sema(R){
  const W=Math.max(R.W,1), H=Math.max(R.H,1);
  const maxW=330, maxH=250, k=Math.min(maxW/W, maxH/H);
  const w=W*k, h=H*k, x0=60, y0=26;
  const kutija=Math.min(26, h*0.12);
  const unutra={x:x0+8, y:y0+kutija, w:w-16, h:h-kutija-8};
  const pH=unutra.h/3;
  let polja='';
  for(let i=0;i<3;i++){
    const y=unutra.y+i*pH;
    const krilo = R.sil && i<2;
    polja += `<rect x="${unutra.x}" y="${y+2}" width="${unutra.w}" height="${pH-4}" fill="#e3edf3" stroke="#191814" stroke-width="1.2"/>
      <line x1="${unutra.x+6}" y1="${y+pH-8}" x2="${unutra.x+unutra.w*0.32}" y2="${y+8}" stroke="#ffffff" stroke-width="2.4" opacity=".9"/>
      <text x="${unutra.x+unutra.w/2}" y="${y+pH/2+4}" text-anchor="middle" font-family="Spline Sans Mono, monospace" font-size="10.5" fill="#191814">${mm(R.staklo.s)} × ${mm(R.staklo.v)}</text>
      <text x="${unutra.x+unutra.w-6}" y="${y+14}" text-anchor="end" font-family="Hanken Grotesk, sans-serif" font-size="9" fill="#5a5446">${i+1}${krilo?' · krilo':''}</text>`;
  }
  return `<svg viewBox="0 0 ${x0+w+70} ${y0+h+46}" role="img" aria-label="Šema giljotine spreda, ${R.W} × ${R.H} mm, tri staklena polja">
    <rect x="${x0}" y="${y0}" width="${w}" height="${h}" fill="#fff" stroke="#191814" stroke-width="2.2"/>
    <rect x="${x0}" y="${y0}" width="${w}" height="${kutija}" fill="#2a2d34"/>
    <circle cx="${x0+w/2}" cy="${y0+kutija/2}" r="${Math.min(8,kutija/2-2)}" fill="none" stroke="#a9743c" stroke-width="1.6"/>
    <text x="${x0+w/2+14}" y="${y0+kutija/2+3.5}" font-family="Hanken Grotesk, sans-serif" font-size="9" fill="#e8e2d0">šasija · motor u cevi 10417</text>
    ${polja}
    <g stroke="#a9743c" stroke-width="1" fill="none">
      <line x1="${x0}" y1="${y0+h+14}" x2="${x0+w}" y2="${y0+h+14}"/><line x1="${x0}" y1="${y0+h+8}" x2="${x0}" y2="${y0+h+20}"/><line x1="${x0+w}" y1="${y0+h+8}" x2="${x0+w}" y2="${y0+h+20}"/>
      <line x1="${x0-16}" y1="${y0}" x2="${x0-16}" y2="${y0+h}"/><line x1="${x0-22}" y1="${y0}" x2="${x0-10}" y2="${y0}"/><line x1="${x0-22}" y1="${y0+h}" x2="${x0-10}" y2="${y0+h}"/>
    </g>
    <text x="${x0+w/2}" y="${y0+h+32}" text-anchor="middle" font-family="Spline Sans Mono, monospace" font-size="12" font-weight="600" fill="#8a5d2e">${R.W}</text>
    <text x="${x0-22}" y="${y0+h/2}" text-anchor="middle" font-family="Spline Sans Mono, monospace" font-size="12" font-weight="600" fill="#8a5d2e" transform="rotate(-90 ${x0-22} ${y0+h/2})">${R.H}</text>
  </svg>`;
}

/* ───────── NALOG ───────── */

  R.aktivni.forEach(p=>{
    h += `<tr><td><div class="sif">${p.sif}</div>${imgTag(p.sif)}</td>
      <td><b>${PROFIL[p.sif].naziv}</b>${p.oz?`<span class="oz">${p.oz}</span>`:''}<div class="nap">${p.nap}</div></td>

  });
  h += `</tbody></table></div></div>`;

  h += `<div class="sec"><div class="sec-h"><span class="sec-n">02</span><h3 class="sec-t">Staklo i šema</h3><span class="sec-x">${br(R.m2,2)} m²</span></div>
   <div class="two"><div>
     <div class="box-cut"><div class="box-cut-t">MERA STAKLA ZA NARUDŽBINU</div>
       <div class="box-cut-v">${mm(R.staklo.s)} × ${mm(R.staklo.v)}</div>
       <div style="font-size:10.5px;color:#5a5446">širina × visina (mm) · <b>${R.staklo.kom} kom</b> · ${R.tek?'jednostruko 8 mm':'termopan 4/16/4'}</div></div>
     <div class="card mono" style="margin-top:9px;font-size:11px;line-height:1.85">
       <div>Polja po sistemu: <b>3</b>${R.sil?' (gornja dva su krila)':''}</div>
       <div>Ukupno stakla: <b>${br(R.m2,2)} m²</b></div>
       <div>Težina jednog polja: <b>≈ ${br(R.tezinaPolja,1)} kg</b></div>
       <div>Mera stakla: <b>širina − ${R.sil?(R.tek?141:138):(R.tek?143:140)}</b>, visina = vert. baza − <b>${R.sil?(R.tek?'24,33':'21,33'):(R.tek?'26':'23')}</b></div></div>
   </div><div class="sema">${sema(R)}</div></div></div>`;

  h += `<div class="sec"><div class="sec-h"><span class="sec-n">03</span><h3 class="sec-t">Okov, zaptivke i pogon</h3></div>
   <div class="tw"><table><thead><tr><th>Stavka</th><th style="width:120px;text-align:right">Količina</th><th style="width:30px;text-align:center">✓</th></tr></thead><tbody>`;
  R.OK.forEach(o=>{
    h += `<tr><td><b>${o.naziv}</b><div class="nap">${o.nap}</div></td>
      <td class="mera" style="text-align:right">${o.jed==='kom'||o.jed==='set'?o.kol:br(o.kol, o.jed==='m²'?2:1)} ${o.jed}</td><td style="text-align:center"><span class="chk"></span></td></tr>`;
  });
  h += `</tbody></table></div></div>`;

  h += `<div class="sec"><div class="sec-h"><span class="sec-n">04</span><h3 class="sec-t">Napomene za radionicu</h3></div>
    <ol class="napomene">
      <li>Mere su date na desetinu milimetra tačno po kalkulatoru; seče se na najbliži milimetar.</li>
      <li>Šasija i poklopac šasije razlikuju se za 1 mm — ne mešati pri pakovanju.</li>
      ${R.sil?'<li>Kenet i baza otvarajućeg stakla su 8 mm duži od rukohvata — obeležiti pri sečenju.</li>':''}
      ${R.siroko?'<li>Širina preko 3700 mm: koristi se bademasti kenet Gio-08.</li>':''}
      <li>Staklo naručiti po meri iz okvira „Mera stakla", ${R.staklo.kom} kom.</li>
    </ol></div>
  <div class="potpisi"><div class="potpis">Pripremio / radionica<div class="potpis-l">Ime / potpis: ______________________</div></div>
    <div class="potpis">Montirao / montaža<div class="potpis-l">Ime / potpis: ______________________</div></div></div>
  <div class="foot">AG GROUP · program za giljotine GIO NOR · ${VER}</div>`;
  return h;
}

/* ───────── OBRAČUN — struktura troška kao u kalkulatoru ───────── */
// Motor se nabavlja u kompletu sa daljinskim — cela cena je na motoru, daljinski 0.
const CENE_DEF = {alu:5.50, fire:0, boja:0, set:100, vuca:0, zapRam:0, zapKrilo:0, fitilj:0, motor:100, daljinski:0, staklo:0, rad:0, marza:30, pdv:20};
const CENE_OPIS = {
  alu:["Aluminijum","€/kg"], fire:["Otpad aluminijuma","% na kg"], boja:["Plastifikacija","€/kg"],
  set:["Set okova","€/set"], vuca:["Kaiš / lanac","€/m"], zapRam:["Zaptivka rama","€/m"], zapKrilo:["Zaptivka krila","€/m"],
  fitilj:["Četkasti fitilj","€/m"], motor:["Motor + daljinski","€/komplet"], daljinski:["Daljinski posebno","€/kom · 0 ako je uz motor"], staklo:["Staklo","€/m²"],
  rad:["Rad","€/sistem"], marza:["Marža","%"], pdv:["PDV","%"]
};
function citajCene(){
  try{ return Object.assign({},CENE_DEF, JSON.parse(localStorage.getItem('gio_cene2')||'{}')); }
  catch(e){ return Object.assign({},CENE_DEF); }
}
function obracun(R,C){
  const alu = R.kg*C.alu;
  const fire = R.kg*(C.fire/100)*C.alu;
  const boja = R.kg*C.boja;
  const okov = R.OK.map(o=>({...o, cena:C[o.id]||0, ukupno:o.kol*(C[o.id]||0)}));
  const okovUk = okov.reduce((a,o)=>a+o.ukupno,0);
  const rad = R.n*C.rad;
  const trosak = alu+fire+boja+okovUk+rad;
  const prodaja = trosak*(1+C.marza/100);
  const pdv = prodaja*C.pdv/100;
  return {alu,fire,boja,okov,okovUk,rad,trosak,prodaja,pdv,ukupno:prodaja+pdv};
}
/* Kartica troška — koliko nas košta jedan nalog, po grupama, i šta još fali */
function karticaTroska(R,C,O,fale){
  const g = id => O.okov.filter(o=>id.includes(o.id)).reduce((a,o)=>a+o.ukupno,0);
  const grupe = [
    ["Aluminijum", O.alu+O.fire+O.boja, `${br(R.kg,1)} kg × ${br(C.alu,2)} €`+(C.boja>0?' + plastifikacija':'')],
    ["Staklo", g(["staklo"]), `${br(R.m2,2)} m²`],
    ["Motor + daljinski", g(["motor","daljinski"]), `${R.n} kompl.`],
    ["Set okova i "+(R.OK[1].naziv.toLowerCase()), g(["set","vuca"]), `${R.n} set + ${br(R.OK[1].kol,0)} m`],
    ["Zaptivke i fitilj", g(["zapRam","zapKrilo","fitilj"]), "po metru"],
    ["Rad", O.rad, `${R.n} sist.`],
  ];
  const max = Math.max(1,...grupe.map(x=>x[1]));
  const m2otvora = R.W*R.H/1e6*R.n;
  return `<div class="kartica">
    <div class="kart-gl">
      <div class="kart-k">KOŠTA NAS</div>
      <div class="kart-v">${eur(O.trosak)}</div>
      <div class="kart-s">materijal + rad · ${R.n} ${R.n===1?'sistem':'sistema'} ${R.W} × ${R.H}</div>
      <div class="kart-mini">
        <div><span>Po sistemu</span><b>${eur(O.trosak/R.n)}</b></div>
        <div><span>Po m² otvora</span><b>${m2otvora>0?eur(O.trosak/m2otvora):'—'}</b></div>
        <div><span>Prodajna sa PDV</span><b>${eur(O.ukupno)}</b></div>
      </div>
    </div>
    <div class="kart-gr">
      ${grupe.map(([n,v,d])=>`<div class="kg-red${v>0?'':' kg-nula'}">
        <div class="kg-t"><span>${n}<small>${d}</small></span><b>${v>0?eur(v):'cena nije uneta'}</b></div>
        <div class="kg-bar"><i style="width:${(v/max*100).toFixed(1)}%"></i></div></div>`).join('')}
      ${fale.length?`<div class="kg-fale">Još fali cena za: <b>${fale.map(k=>CENE_OPIS[k][0]).join(', ')}</b>. Dok se ne unese, trošak je niži od stvarnog.</div>`
                   :`<div class="kg-fale kg-ok">Sve cene su unete.</div>`}
    </div>
  </div>`;
}
function obracunHTML(I,R){
  const C=citajCene(), O=obracun(R,C);
  const fale = Object.keys(C).filter(k=>k!=='fire' && k!=='daljinski' && !(k==='zapKrilo'&&!R.sil) && !(+C[k]>0));
  let h = zaglavlje(I,R,true);
  h += karticaTroska(R,C,O,fale);
  h += `<div class="obr-warning no-print">Cene se upisuju u polja ispod i pamte u ovom pregledaču. Polja bez cene su crveno uokvirena i računaju se kao 0.</div>`;

  h += `<div class="sec no-print"><div class="sec-h"><span class="sec-n acc">€</span><h3 class="sec-t">Jedinične cene</h3></div><div class="cene">`;
  Object.keys(CENE_DEF).forEach(k=>{
    if(k==='zapKrilo'&&!R.sil) return;
    h += `<label><span>${CENE_OPIS[k][0]}</span><input type="number" step="0.01" min="0" id="c_${k}" value="${C[k]}" class="${+C[k]>0||k==='fire'?'':'prazno'}"><small>${CENE_OPIS[k][1]}</small></label>`;
  });
  h += `</div></div>`;

  h += `<div class="sec"><div class="sec-h"><span class="sec-n">01</span><h3 class="sec-t">Aluminijum po profilima</h3></div>
   <div class="tw"><table><thead><tr><th>Šifra</th><th>Profil</th><th style="text-align:right">Mera</th><th style="text-align:center">Kom</th><th style="text-align:right">kg/m</th><th style="text-align:right">kg</th></tr></thead><tbody>`;
  R.aktivni.forEach(p=>{
    h += `<tr><td class="m">${p.sif}</td><td>${PROFIL[p.sif].naziv}${p.oz?`<span class="oz">${p.oz}</span>`:''}</td><td class="m" style="text-align:right">${mm(p.mera)}</td><td class="m" style="text-align:center">${p.kom}</td><td class="m" style="text-align:right">${br(PROFIL[p.sif].kgm,3)}</td><td class="euro">${br(p.kg,3)}</td></tr>`;
  });
  h += `<tr class="obr-sum"><td colspan="5">UKUPNO ALUMINIJUM</td><td class="euro">${br(R.kg,2)} kg</td></tr></tbody></table></div></div>`;

  h += `<div class="sec"><div class="sec-h"><span class="sec-n">02</span><h3 class="sec-t">Trošak</h3></div>
   <div class="tw"><table><thead><tr><th>Stavka</th><th style="text-align:right">Količina</th><th style="text-align:right">Cena</th><th style="text-align:right">Iznos</th></tr></thead><tbody>
   <tr><td><b>Aluminijum</b></td><td class="m" style="text-align:right">${br(R.kg,2)} kg</td><td class="euro">${eur(C.alu)}</td><td class="euro">${eur(O.alu)}</td></tr>
   <tr><td><b>Otpad aluminijuma</b></td><td class="m" style="text-align:right">${br(C.fire,1)} %</td><td class="euro">${eur(C.alu)}</td><td class="euro">${eur(O.fire)}</td></tr>
   <tr><td><b>Plastifikacija</b> · RAL ${esc(I.ral)||'—'}</td><td class="m" style="text-align:right">${br(R.kg,2)} kg</td><td class="euro">${eur(C.boja)}</td><td class="euro">${eur(O.boja)}</td></tr>`;
  O.okov.forEach(o=>{
    h += `<tr><td><b>${o.naziv}</b></td><td class="m" style="text-align:right">${o.jed==='kom'||o.jed==='set'?o.kol:br(o.kol,2)} ${o.jed}</td><td class="euro">${eur(o.cena)}</td><td class="euro">${eur(o.ukupno)}</td></tr>`;
  });
  h += `<tr><td><b>Rad</b></td><td class="m" style="text-align:right">${R.n} sist.</td><td class="euro">${eur(C.rad)}</td><td class="euro">${eur(O.rad)}</td></tr>
   <tr class="obr-sum"><td colspan="3">TROŠAK (materijal + rad)</td><td class="euro">${eur(O.trosak)}</td></tr>
   <tr><td colspan="3">Prodajna cena bez PDV-a · marža ${br(C.marza,0)} %</td><td class="euro">${eur(O.prodaja)}</td></tr>
   <tr><td colspan="3">PDV ${br(C.pdv,0)} %</td><td class="euro">${eur(O.pdv)}</td></tr>
   <tr class="obr-total"><td colspan="3">PRODAJNA CENA SA PDV-om</td><td class="amt euro">${eur(O.ukupno)}</td></tr>
   </tbody></table></div></div>
   <div class="foot">AG GROUP · obračun giljotine GIO NOR · ${VER}</div>`;
  return h;
}
function vezeCena(I,R){
  Object.keys(CENE_DEF).forEach(k=>{
    const el=$('c_'+k); if(!el) return;
    el.addEventListener('change',()=>{
      const C=citajCene(); C[k]=Math.max(0,+el.value||0);
      try{ localStorage.setItem('gio_cene2',JSON.stringify(C)); }catch(e){}
      const y=window.scrollY; crtaj(); window.scrollTo(0,y);
    });
  });
}

/* ───────── ARHIVA (lokalno, u ovom pregledaču) ───────── */
const ARH='gio_arhiva';
function arhiva(){ try{return JSON.parse(localStorage.getItem(ARH)||'[]');}catch(e){return [];} }
function sacuvaj(){
  const I=citaj(), R=proracun(I), a=arhiva();
  a.unshift({id:Date.now(), vreme:new Date().toLocaleString('sr-RS'), I,
    opis:`${R.sil?'Brisiva':'Fiksna'} · ${R.W}×${R.H}${R.n>1?' ×'+R.n:''}`});
  try{ localStorage.setItem(ARH,JSON.stringify(a.slice(0,200))); }catch(e){}
  const b=$("btnSacuvaj"), t=b.textContent; b.textContent='✓ Sačuvano'; setTimeout(()=>b.textContent=t,1500);
}
function otvoriArhivu(){
  const a=arhiva();
  $("arhivaLista").innerHTML = a.length ? a.map(o=>`<div class="arch-item">
      <b>${esc([o.I.brNaloga,o.I.kupac].filter(Boolean).join(' · ')||'(bez naziva)')}</b>
      <small>${esc(o.opis)} · ${esc(o.vreme)}</small>
      <button class="btn-xs btn-xs-load" onclick="ucitaj(${o.id})">Učitaj</button><button class="btn-xs btn-xs-del" onclick="obrisi(${o.id})">Obriši</button></div>`).join('')
    : '<div class="arch-empty">Nema sačuvanih naloga.<br>Klikni 💾 Sačuvaj da sačuvaš trenutni.</div>';
  $("arhiva").classList.add('open');
}
function zatvoriArhivu(){ $("arhiva").classList.remove('open'); }
function ucitaj(id){
  const o=arhiva().find(x=>x.id===id); if(!o) return;
  $(o.I.sistem==='sabit'?'sistemSab':'sistemSil').checked=true;
  POLJA.forEach(k=>{ if(o.I[k]!==undefined) $(k).value=o.I[k]; });
  zatvoriArhivu(); crtaj();
}
function obrisi(id){
  try{ localStorage.setItem(ARH,JSON.stringify(arhiva().filter(x=>x.id!==id))); }catch(e){}
  otvoriArhivu();
}
